<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a new password — Theraglee</title>
<meta name="description" content="Choose a new password for your Theraglee account.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main class="section">
  <div class="wrap" style="max-width:470px">
    <div class="center" style="margin-bottom:26px">
      <h1 style="font-size:2rem">Choose a new password</h1>
      <p class="muted" id="lead">One moment while we check your link.</p>
    </div>

    <div class="card pad-lg">
      <div id="alert"></div>
      <div id="box"><div class="skeleton" style="height:180px"></div></div>
    </div>

    <p class="center faint" style="margin-top:22px">
      Know your password after all? <a href="login.html">Member sign in</a> ·
      <a href="therapist-login.html">Therapist sign in</a>
    </p>
  </div>
</main>

<script type="module">
// The page the link in a password-reset email lands on, for members and
// therapists alike. Supabase signs the person in from the tokens the link
// carries; this page asks for the new password, saves it and sends them to
// their own dashboard. A link that has expired, or was used already, arrives
// with an error instead, and the page offers to send a fresh one.
import { chrome, sb, access, clearAccess, esc, busy, $, homeFor } from './assets/app.js';
import { pwField, wireEyes, resetLandingUrl } from './assets/auth.js';

// What the link brought is in the part of the address after #. supabase-js
// clears it a moment after the page opens, so read it now.
const arrived = new URLSearchParams(location.hash.replace(/^#/, ''));
const linkError = arrived.get('error_description') || (arrived.get('error') ? 'That link did not work.' : '');

await chrome({ showcase: false });
const box = $('#box');
const lead = $('#lead');
const say = (msg, kind = 'err') => {
  $('#form-alert').innerHTML = `<div class="notice ${kind}" style="margin:18px 0 0">${msg}</div>`;
};

// A session means the link worked (or the person is signed in already, which
// is fine: anyone signed in may choose a new password here).
const { data: { session } } = await sb.auth.getSession();

/* The form that sets the new password. */
function passwordForm() {
  lead.innerHTML = `Setting a new password for <strong>${esc(session.user.email || 'your account')}</strong>.`;
  box.innerHTML = `
    <form id="form" class="stack" novalidate>
      <div class="field">
        <label for="password">New password</label>
        ${pwField('password', 'new-password', 'At least 8 characters')}
        <div class="help" id="pw-hint" aria-live="polite">At least 8 characters.</div>
      </div>
      <div class="field">
        <label for="password2">Confirm new password</label>
        ${pwField('password2', 'new-password', 'Type it again')}
        <div class="help">Type the same password again so we know it is what you meant.</div>
      </div>
      <button class="btn lg block" id="submit" type="submit">Save new password</button>
      <div id="form-alert"></div>
    </form>`;
  const form = $('#form');
  wireEyes(form);
  const hint = $('#pw-hint');
  $('#password').addEventListener('input', (e) => {
    const ok = e.target.value.length >= 8;
    hint.classList.toggle('ok', ok);
    hint.textContent = ok ? '✓ At least 8 characters.' : 'At least 8 characters.';
  });
  $('#password').focus({ preventScroll: true });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = $('#password').value;
    const password2 = $('#password2').value;
    if (password.length < 8) return say('Please choose a password of at least 8 characters.');
    if (!password2) return say('Please type your new password again in the second box.');
    if (password !== password2) {
      say('Those passwords do not match. Please type the same password in both boxes.');
      $('#password2').focus({ preventScroll: true });
      return;
    }
    const btn = $('#submit');
    busy(btn, true, 'Saving…');
    const { error } = await sb.auth.updateUser({ password });
    if (error) { busy(btn, false); return say(esc(error.message)); }
    // Done: the button stays gray and the page moves on to the dashboard.
    btn.disabled = true;
    btn.classList.add('done');
    btn.textContent = 'Password saved';
    clearAccess();
    const a = await access(true);
    const home = homeFor(a.profile);
    say(`<strong>Your new password is saved.</strong><br>
         You are signed in. Taking you to your dashboard, or
         <a href="${home}">go there now</a>.`, 'warn');
    setTimeout(() => location.replace(home), 2500);
  });
}

/* No usable link: offer to send another. */
function askForLink(intro) {
  lead.textContent = 'Reset links work once and expire after an hour.';
  box.innerHTML = `
    <form id="again" class="stack" novalidate>
      <div class="notice err" style="margin:0 0 18px">${intro}</div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <button class="btn lg block" id="send" type="submit">Send me a new link</button>
      <div id="form-alert"></div>
    </form>`;
  $('#again').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim();
    if (!email) return say('Type your email first.');
    const btn = $('#send');
    busy(btn, true, 'Sending…');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: resetLandingUrl() });
    busy(btn, false);
    say(error ? esc(error.message)
      : `<strong>Check your email.</strong><br>A new link is on its way to ${esc(email)}. It can take a minute,
         and it sometimes lands in your spam or junk folder.`, error ? 'err' : 'warn');
  });
}

if (session) passwordForm();
else if (linkError) {
  askForLink(`<strong>${esc(linkError.replace(/\+/g, ' '))}</strong><br>
    The link may have expired, or it may have been used already. Ask for a new one below.`);
} else {
  askForLink(`<strong>This page works from the link in a reset email.</strong><br>
    Type your email and we will send you one.`);
}
</script>
</body>
</html>
