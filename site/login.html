<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member sign in — Theraglee</title>
<meta name="description" content="Sign in to your Theraglee member account.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main class="section">
  <div class="wrap" style="max-width:470px">
    <div class="center" style="margin-bottom:26px">
      <h1 style="font-size:2rem">Create an account or sign in</h1>
      <p class="muted">Sign in below to pick up where you left off, or <a href="signup.html">create a free account</a> to get started.</p>
    </div>

    <div class="card pad-lg">
      <div id="alert"></div>
      <div id="auth"><div class="skeleton" style="height:220px"></div></div>
    </div>

    <p class="center muted" style="margin-top:22px">
      New here? <a href="signup.html">Create a free account</a>
    </p>
    <p class="center faint" style="margin-top:8px">
      Registering is free and never asks for a card.
    </p>
    <p class="center faint" style="margin-top:20px">
      Are you a licensed therapist? <a href="therapist-login.html">Sign in to your practice</a>
    </p>
  </div>
</main>

<script type="module">
import { chrome } from './assets/app.js';
import { authPage } from './assets/auth.js';
// The old address for creating a member account was login.html?mode=signup.
// It now has a page of its own; carry the rest of the address across.
{
  const q = new URLSearchParams(location.search);
  if (q.get('mode') === 'signup') { q.delete('mode'); location.replace('signup.html' + ([...q].length ? '?' + q : '')); }
}
await chrome();
await authPage({ audience: 'member', mode: 'signin' });
</script>
</body>
</html>
