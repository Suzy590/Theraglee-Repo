<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goals &amp; tracking — Theraglee</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin:24px 0 28px;overflow-x:auto}
  .tabs button{border:0;background:none;font:inherit;font-size:.95rem;padding:12px 18px;cursor:pointer;
    color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--green);border-bottom-color:var(--green);font-weight:500}
  .week{display:flex;gap:6px}
  .week span{flex:1;height:34px;border-radius:8px;background:var(--sand);display:grid;place-items:center;
    font-size:.72rem;color:var(--faint)}
  .week span.hit{background:var(--lime);color:var(--ink);font-weight:600}
  /* Wellness note: shown on every tab, above the content. */
  .wellness{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-sm);
    background:var(--sand);border:1px solid var(--hair);font-size:.88rem;color:var(--muted);margin-bottom:22px}
  .wellness strong{color:var(--ink);font-weight:500}
  .quest{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
  @media(max-width:860px){.quest{grid-template-columns:minmax(0,1fr)}}
  .mapcard svg g[data-ch]:focus{outline:none}
  .mapcard svg g[data-ch]:focus circle:nth-of-type(1){stroke:var(--lime-2)}
  .act{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--hair)}
  .act:first-of-type{border-top:0}
  .act .txt{flex:1;min-width:0}
  .act .meta{font-size:.8rem;color:var(--faint)}
  .tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--hair);background:var(--paper);
    cursor:pointer;display:grid;place-items:center;font-size:.95rem;color:#fff;padding:0}
  .tick.on{background:var(--green);border-color:var(--green)}
  .tick:disabled{cursor:default;opacity:.6}
  .tick:not(.on):not(:empty){color:var(--muted);font-size:.85rem}
  .note{margin-top:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--sand);font-size:.92rem}
  .note a{display:inline-block;margin-top:4px;font-size:.85rem}
  .side{margin-top:16px;padding:14px 16px;border:1px dashed var(--mist);border-radius:var(--r-sm);background:var(--soft)}
  .steps-nav{display:flex;gap:8px;margin-bottom:18px}
  .steps-nav span{flex:1;height:5px;border-radius:5px;background:var(--hair)}
  .steps-nav span.on{background:var(--lime-2)}
  .pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .pick button{text-align:left;font:inherit;padding:14px 16px;border-radius:var(--r-sm);border:1px solid var(--hair);
    background:var(--paper);cursor:pointer;color:var(--ink)}
  .pick button:hover{border-color:var(--lime-2)}
  .pick button.on{border-color:var(--green);background:var(--soft);box-shadow:0 0 0 1px var(--green) inset}
  .pick button small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
  .stat{font-size:2rem;font-weight:500;letter-spacing:-.03em;line-height:1}
  .refl{padding:14px 0;border-top:1px solid var(--hair)}
  .refl:first-child{border-top:0}
  textarea{width:100%}
</style>
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:220px"></div>
</div></main>

<script type="module">
import { chrome, sb, requireAuth, esc, toast, busy, fmtDate, lockNotice, modal } from './assets/app.js';
import { mapView as nearbyView } from './assets/nearby-ui.js';
import { VALUES, CATEGORIES, MINUTES, SCENES, buildQuest, progress, milestoneFor,
  helper, action, valueOf } from './assets/quest-paths.js';
import { questMap, scene } from './assets/quest-scene.js';
// The Playlists tab moved to the dashboard; an old link to it still lands there.
if (location.hash === '#music') location.replace('dashboard.html#playlists');
await chrome({ active:'dashboard.html' });
const a = await requireAuth();
if (a) {
const root = document.getElementById('root');

if (a.level < 3) {
  lockNotice(root, 3, 'Goals and the resource map');
} else {
let tab = location.hash.replace('#','') || 'quest';
const uid = a.profile.id;

// The member's own calendar day, so "today" turns over at their midnight.
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());

/* The wellness note. Shown on every tab, the setup and the reflection box. */
const WELLNESS = `<div class="wellness" role="note"><span aria-hidden="true">🌱</span><div>
  <strong>General wellness and self-help only.</strong> Theraglee is not psychotherapy or clinical
  care, and it is not a substitute for help from a licensed professional.
  <a href="therapists.html">Find a therapist</a> · <a href="#map" data-go="map">Help near you</a> ·
  In crisis, call or text <a href="tel:988">988</a>, or call 911.</div></div>`;

const shell = (body) => `
  <h1>Goals &amp; tracking</h1>
  <p class="muted" style="max-width:60ch">A map for the everyday things you would like more of.
    Pick small actions, show up when you can, and watch your own story unfold. Your daily mood
    check-in is on the <a href="dashboard.html#mood">Mood tab of your dashboard</a>, and music is on
    its <a href="dashboard.html#playlists">Playlists tab</a>.</p>
  <div class="tabs">${[['quest','Your quest'],['goals','Goals'],['reflect','What helped'],
      ['data','Your data'],['map','Nearby help']]
    .map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>
  ${WELLNESS}
  <div id="body">${body}</div>`;

const body = () => document.getElementById('body');

/* ------------------------------------------------------ shared data */
async function load() {
  const [q, s, g, r] = await Promise.all([
    sb.from('quests').select('*').eq('user_id', uid).eq('active', true).maybeSingle(),
    sb.from('quest_steps').select('quest_id,action_key,done_on,note').eq('user_id', uid),
    sb.from('goals').select('*').eq('user_id', uid).order('created_at', { ascending:false }),
    sb.from('quest_reflections').select('*').eq('user_id', uid).order('noted_on', { ascending:false }),
  ]);
  const goals = g.data || [];
  let logs = [];
  if (goals.length) {
    const { data } = await sb.from('goal_logs').select('*').in('goal_id', goals.map(x=>x.id));
    logs = data || [];
  }
  const steps = s.data || [], reflections = r.data || [];
  // A day counts when the member did anything: a micro-action, a goal, or a note.
  const days = [...steps.map(x=>x.done_on), ...logs.map(x=>x.logged_on), ...reflections.map(x=>x.noted_on)];
  return { quest: q.data, steps, goals, logs, reflections, days };
}

/** A light, one-off celebration when a day is a milestone or opens a chapter. */
function celebrate(before, after, map) {
  if (after.days === before.days) return;
  if (after.open > before.open) {
    const c = map.chapters[after.open];
    modal(`<div class="center"><div style="font-size:2.4rem">✨</div>
      <h2>A new chapter opens</h2><p><strong>${esc(c.place)}</strong></p>
      <p class="muted">${esc(c.story)}</p>
      <button class="btn" onclick="this.closest('.backdrop').remove()">Keep going</button></div>`);
  } else if (milestoneFor(after.days)) {
    toast(after.days === 1 ? 'Your first day on the map. Welcome.' :
      `${after.days} days you have shown up. That is yours to keep.`, 'ok');
  } else toast('Marked. Nice.', 'ok');
}

/* ------------------------------------------------------------ quest */
let chapter = null;           // chapter on screen; null means the newest open one
const swaps = {};             // helper: action key -> shorter action key, this visit only

async function questView() {
  const d = await load();
  if (!d.quest) return setup();
  const q = d.quest;
  const map = buildQuest({ id: q.id, value: q.value_key, categories: q.categories, minutes: q.minutes });
  const prog = progress(d.days);
  const ci = chapter ?? prog.open;
  const c = map.chapters[ci];
  const open = ci <= prog.open;
  const t = today();
  // action key -> today's step row, so a writing action can show its note.
  const doneToday = new Map(d.steps.filter(x => x.done_on === t).map(x => [x.action_key, x]));

  const row = (act, optional) => {
    const shown = swaps[act.key] ? action(swaps[act.key]) : act;
    const done = open && doneToday.has(shown.key);
    const shorter = open && q.helper && !done ? helper.shorter(shown.key, q) : null;
    const note = done ? doneToday.get(shown.key)?.note : null;
    return `<div class="act">
      ${open ? `<button class="tick ${done?'on':''}" data-step="${shown.key}" aria-pressed="${done}"
        aria-label="${done ? 'Done today. Tap to undo' : shown.write ? 'Open a note box, then mark done' : 'Mark done today'}">${done?'✓':(shown.write?'✎':'')}</button>`
        : '<span class="tick" aria-hidden="true" style="cursor:default">·</span>'}
      <div class="txt"><div>${esc(shown.text)}</div>
        <div class="meta">${CATEGORIES.find(x=>x.key===shown.cat)?.icon||''} ${esc(CATEGORIES.find(x=>x.key===shown.cat)?.label||'')}
          · about ${shown.min} min${optional?' · optional':''}${shown.write && open && !done ? ' · tap to write it here' : ''}
          ${shorter ? ` · <a href="#" data-shorter="${act.key}" data-to="${shorter.key}">Shorter idea (${shorter.min} min)</a>` : ''}
          ${swaps[act.key] ? ` · <a href="#" data-unswap="${act.key}">Back to the original</a>` : ''}</div>
        ${done && shown.write ? `<div class="note">${note ? `<div style="white-space:pre-wrap">${esc(note)}</div>` : '<span class="faint">Marked done without a note.</span>'}
          <a href="#" data-note="${shown.key}">${note ? 'Edit note' : 'Add a note'}</a></div>` : ''}</div>
    </div>`;
  };

  body().innerHTML = `
    <div class="quest">
      <div class="stack">
        <div class="card">
          <div class="spread" style="align-items:flex-end">
            <div><div class="faint">${esc(map.value.icon)} A quest toward ${esc(map.value.phrase)}</div>
              ${q.intention ? `<div style="font-family:var(--serif);font-style:italic;font-size:1.25rem">“${esc(q.intention)}”</div>` : ''}</div>
            <div style="text-align:right"><div class="stat">${prog.days}</div>
              <div class="faint">day${prog.days===1?'':'s'} you've shown up</div></div>
          </div>
          <div style="margin-top:14px">${scene(q.scene, prog)}</div>
          <p class="muted" style="margin:12px 0 0;font-size:.9rem">${prog.next
            ? `${prog.next.left} more day${prog.next.left===1?'':'s'}, whenever they come, opens <strong>${esc(prog.next.place)}</strong>. Missed days never count against you.`
            : 'Every chapter is open. The path keeps going as long as you like.'}</p>
        </div>
        <div class="card mapcard">${questMap(map.chapters, prog.open, ci)}</div>
      </div>

      <div class="stack">
        <div class="card pad-lg">
          <div class="spread"><span class="badge ${open?'live':'gray'}">Chapter ${ci+1} of ${map.chapters.length}</span>
            ${open ? '' : `<span class="faint">Opens after ${c.at} days</span>`}</div>
          <h2 style="margin:12px 0 6px">${esc(c.place)}</h2>
          <p class="muted">${esc(c.story)}</p>
          <h3 style="margin-top:18px">${open ? 'Micro-actions for today' : 'A peek at what is here'}</h3>
          <p class="faint" style="margin:-4px 0 6px">${open ? 'Do one, all, or none, then tap its circle. Any one of them counts the day. A pencil means you can write it right here.'
            : `This chapter opens after ${c.at} days shown up, in a row or not. Until then, the open chapters are where to mark things done.`}</p>
          ${c.main.map(x => row(x, false)).join('')}
          ${c.side ? `<div class="side"><strong>Optional side path</strong>
            <p class="faint" style="margin:2px 0 0">Something from outside your usual picks, if you feel like it.</p>
            ${row(c.side, true)}</div>` : ''}
        </div>
        <div class="card">
          <div class="spread"><h3 style="margin:0">Your quest settings</h3>
            <button class="btn sm ghost" id="edit">Adjust</button></div>
          <p class="faint" style="margin:8px 0 0">${q.categories.map(k=>esc(CATEGORIES.find(x=>x.key===k)?.label||k)).join(', ')}
            · up to ${q.minutes} min · ${esc(SCENES.find(x=>x.key===q.scene)?.label||'')}
            · suggestion helper ${q.helper?'on':'off'}</p>
          <p class="faint" style="margin:6px 0 0"><a href="#" id="restart">Start a new quest</a>
            (your days shown up carry over)</p>
        </div>
      </div>
    </div>`;

  body().querySelectorAll('g[data-ch]').forEach(g => {
    const go = () => { chapter = Number(g.dataset.ch); questView(); };
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  body().querySelectorAll('[data-shorter]').forEach(l => l.onclick = (e) => {
    e.preventDefault(); swaps[l.dataset.shorter] = l.dataset.to; questView();
  });
  body().querySelectorAll('[data-unswap]').forEach(l => l.onclick = (e) => {
    e.preventDefault(); delete swaps[l.dataset.unswap]; questView();
  });
  // Marks a step done for today, with an optional note, and celebrates the day.
  const markDone = async (key, note = null) => {
    const { error } = await sb.from('quest_steps').insert({ quest_id: q.id, user_id: uid, action_key: key, done_on: t, note });
    if (error) { toast(error.message, 'err'); return false; }
    celebrate(prog, progress([...d.days, t]), map);
    chapter = null;
    questView();
    return true;
  };
  // The note box for a writing action: the prompt, a text box, and a way to
  // mark it done without writing anything down here.
  const noteBox = (key, existing = null) => {
    const act = action(key);
    const back = modal(`<p class="faint" style="margin:0 0 4px">${esc(CATEGORIES.find(x=>x.key===act.cat)?.label||'')} · about ${act.min} min</p>
      <h2 style="margin-bottom:6px">${esc(act.text)}</h2>
      <p class="muted">Only you can read this. Keep it as short as you like.</p>
      <textarea id="stepnote" rows="5" maxlength="1000" placeholder="Write it here…">${esc(existing?.note||'')}</textarea>
      <div class="row" style="justify-content:flex-end;margin-top:12px">
        <button class="btn ghost" id="no">Cancel</button>
        ${existing ? '' : '<button class="btn ghost" id="skip">Mark done without writing</button>'}
        <button class="btn" id="yes">${existing ? 'Save note' : 'Save and mark done'}</button></div>`);
    back.querySelector('#stepnote').focus();
    back.querySelector('#no').onclick = () => back.remove();
    back.querySelector('#skip')?.addEventListener('click', async (e) => {
      busy(e.target, true, 'Marking…');
      if (await markDone(key)) back.remove(); else busy(e.target, false);
    });
    back.querySelector('#yes').onclick = async (e) => {
      const note = back.querySelector('#stepnote').value.trim() || null;
      busy(e.target, true, 'Saving…');
      if (existing) {
        const { error } = await sb.from('quest_steps').update({ note })
          .eq('quest_id', q.id).eq('action_key', key).eq('done_on', t);
        busy(e.target, false);
        if (error) return toast(error.message, 'err');
        back.remove(); toast('Saved.', 'ok'); questView();
      } else if (await markDone(key, note)) back.remove(); else busy(e.target, false);
    };
  };
  body().querySelectorAll('[data-step]').forEach(b => b.onclick = async () => {
    const key = b.dataset.step;
    if (doneToday.has(key)) {
      b.disabled = true;
      const { error } = await sb.from('quest_steps').delete()
        .eq('quest_id', q.id).eq('action_key', key).eq('done_on', t);
      if (error) { b.disabled = false; return toast(error.message, 'err'); }
      return questView();
    }
    if (action(key)?.write) return noteBox(key);
    b.disabled = true;
    if (!await markDone(key)) b.disabled = false;
  });
  body().querySelectorAll('[data-note]').forEach(l => l.onclick = (e) => {
    e.preventDefault(); noteBox(l.dataset.note, doneToday.get(l.dataset.note));
  });
  document.getElementById('edit').onclick = () => setup(q);
  document.getElementById('restart').onclick = (e) => { e.preventDefault(); setup(null, true); };
}

/* The setup: values first, never symptoms. Also used to adjust a quest. */
function setup(existing = null, fresh = false) {
  const st = {
    step: 0,
    value: existing?.value_key || null, intention: existing?.intention || '',
    categories: new Set(existing?.categories || []), minutes: existing?.minutes || 5,
    scene: existing?.scene || 'garden', helper: existing?.helper || false,
  };
  const STEPS = 4;
  const draw = () => {
    const nav = `<div class="steps-nav">${Array.from({length:STEPS},(_,i)=>`<span class="${i<=st.step?'on':''}"></span>`).join('')}</div>`;
    let inner = '';
    if (st.step === 0) inner = `
      <h2>What would you like more of in your everyday life?</h2>
      <p class="muted">Pick the one that feels closest. There are no wrong answers, and you can change it later.</p>
      <div class="pick">${VALUES.map(v=>`<button data-v="${v.key}" class="${st.value===v.key?'on':''}">${v.icon} ${esc(v.label)}</button>`).join('')}</div>
      <div class="field" style="margin-top:18px"><label for="int">In your own words (optional)</label>
        <input id="int" maxlength="140" value="${esc(st.intention)}" placeholder="e.g. Evenings that feel like mine again"></div>`;
    if (st.step === 1) inner = `
      <h2>Which kinds of practice appeal to you?</h2>
      <p class="muted">Pick as many as you like. Your map draws its main actions from these, and offers the others as optional side paths.</p>
      <div class="pick">${CATEGORIES.map(c=>`<button data-c="${c.key}" class="${st.categories.has(c.key)?'on':''}">${c.icon} ${esc(c.label)}</button>`).join('')}</div>`;
    if (st.step === 2) inner = `
      <h2>How much time do you usually have?</h2>
      <p class="muted">Actions on your map will fit inside this. Short is fine; short is how most habits start.</p>
      <div class="pick">${MINUTES.map(m=>`<button data-m="${m}" class="${st.minutes===m?'on':''}">Up to ${m} minutes</button>`).join('')}</div>`;
    if (st.step === 3) inner = `
      <h2>How should your progress look?</h2>
      <p class="muted">It only ever grows. A missed day never takes anything away.</p>
      <div class="pick">${SCENES.map(s=>`<button data-s="${s.key}" class="${st.scene===s.key?'on':''}">${esc(s.label)}<small>${esc(s.blurb)}</small></button>`).join('')}</div>
      <label class="row" style="margin-top:20px;align-items:flex-start;gap:10px;cursor:pointer">
        <input type="checkbox" id="hlp" ${st.helper?'checked':''} style="margin-top:5px">
        <span><strong>Turn on the suggestion helper</strong> (optional)<br>
          <span class="faint">Offers a shorter version of an action, and reflection prompt ideas, using only
          the time and categories you picked above. It never reads what you write, does not use AI,
          and makes no judgments about you.</span></span></label>`;
    body().innerHTML = `<div class="card pad-lg narrow" style="margin:0 auto">${nav}${inner}
      <div class="row" style="justify-content:space-between;margin-top:24px">
        <span class="row">${st.step>0 ? '<button class="btn ghost" id="back">Back</button>' : ''}
          ${existing || fresh ? '<button class="btn ghost" id="cancel">Cancel</button>' : ''}</span>
        <button class="btn" id="next">${st.step===STEPS-1 ? (existing?'Save changes':'Draw my map') : 'Next'}</button>
      </div></div>`;
    const $ = (s) => body().querySelector(s);
    body().querySelectorAll('[data-v]').forEach(b => b.onclick = () => { st.value = b.dataset.v; st.intention = $('#int').value; draw(); });
    body().querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
      st.categories.has(b.dataset.c) ? st.categories.delete(b.dataset.c) : st.categories.add(b.dataset.c); draw(); });
    body().querySelectorAll('[data-m]').forEach(b => b.onclick = () => { st.minutes = Number(b.dataset.m); draw(); });
    body().querySelectorAll('[data-s]').forEach(b => b.onclick = () => { st.scene = b.dataset.s; st.helper = $('#hlp').checked; draw(); });
    $('#back')?.addEventListener('click', () => {
      if ($('#hlp')) st.helper = $('#hlp').checked;
      if ($('#int')) st.intention = $('#int').value;
      st.step--; draw(); });
    $('#cancel')?.addEventListener('click', () => questView());
    $('#next').onclick = async (e) => {
      if (st.step === 0) { st.intention = $('#int').value.trim(); if (!st.value) return toast('Pick the one that feels closest.', 'err'); }
      if (st.step === 1 && !st.categories.size) return toast('Pick at least one kind of practice.', 'err');
      if (st.step < STEPS - 1) { st.step++; return draw(); }
      st.helper = $('#hlp').checked;
      const row = { value_key: st.value, intention: st.intention || null, categories: [...st.categories],
        minutes: st.minutes, scene: st.scene, helper: st.helper };
      busy(e.target, true, 'Drawing…');
      let error;
      if (existing) ({ error } = await sb.from('quests').update(row).eq('id', existing.id));
      else {
        // One quest on the go at a time: the old one is kept, just no longer active.
        await sb.from('quests').update({ active:false }).eq('user_id', uid).eq('active', true);
        ({ error } = await sb.from('quests').insert({ ...row, user_id: uid }));
      }
      busy(e.target, false);
      if (error) return toast(error.message, 'err');
      chapter = null;
      toast(existing ? 'Saved.' : 'Your map is ready.', 'ok');
      questView();
    };
  };
  draw();
}

/* ------------------------------------------------------------ goals */
// SMART, in plain words: what exactly (Specific), how often (Measurable), how
// long (Achievable), which value it serves (Relevant), and a day to look back
// on it (Time-bound).
async function goalsView(){
  const { goals, logs } = await load();
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay()+6)%7));
  const week = Array.from({length:7}, (_,i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return ymd(d); });
  const t = today();
  const active = goals.filter(g=>g.active);

  body().innerHTML = `
    <div class="spread"><h2 style="margin:0">Your goals</h2>
      <button class="btn" id="add">Add a goal</button></div>
    <p class="muted" style="max-width:62ch;margin-top:8px">Everyday actions you choose, sized so they fit.
      Every day you log a goal also counts as a day shown up on your quest map.</p>
    ${active.length ? `<div class="grid g2" style="margin-top:20px">
      ${active.map(g=>{
        const mine = logs.filter(l=>l.goal_id===g.id).map(l=>l.logged_on);
        const hits = week.filter(d=>mine.includes(d)).length;
        const v = valueOf(g.value_key);
        const due = g.review_on && g.review_on <= t;
        return `<div class="card">
          <div class="spread"><h3 style="margin:0">${esc(g.title)}</h3>
            <span class="badge ${hits>=g.target_per_week?'done':'gray'}">${hits} of ${g.target_per_week} this week</span></div>
          <p class="faint" style="margin:6px 0 0">${[
            g.cue && esc(g.cue), g.minutes && `about ${g.minutes} min`, v && `${v.icon} ${esc(v.label)}`,
            g.review_on && `look back on ${fmtDate(g.review_on+'T12:00')}`].filter(Boolean).join(' · ')}</p>
          <div class="week" style="margin:14px 0">${week.map((d,i)=>
            `<span class="${mine.includes(d)?'hit':''}">${'MTWTFSS'[i]}</span>`).join('')}</div>
          ${due ? `<div class="notice" style="margin-bottom:12px">It's your look-back day. You have shown up for this
            ${mine.length} time${mine.length===1?'':'s'}. Keep it as it is, change it, or archive it: all fine.</div>` : ''}
          <div class="row">
            <button class="btn sm ${mine.includes(t)?'ghost':''}" data-log="${g.id}" data-on="${mine.includes(t)?1:''}">
              ${mine.includes(t)?'Logged today · undo':'Log today'}</button>
            <button class="btn sm ghost" data-edit="${g.id}">Edit</button>
            <button class="btn sm ghost" data-archive="${g.id}">Archive</button>
            <span class="faint">${mine.length} day${mine.length===1?'':'s'} in all</span>
          </div></div>`;
      }).join('')}</div>`
      : `<div class="empty" style="margin-top:20px">No goals yet. Try something small and specific:
         “walk 10 minutes after lunch”, “message one friend on Sundays”.</div>`}`;

  const form = (g = {}) => {
    const back = modal(`<h2>${g.id ? 'Edit goal' : 'New goal'}</h2>
      <div class="field"><label for="gt">What exactly will you do?</label>
        <input id="gt" maxlength="120" value="${esc(g.title||'')}" placeholder="e.g. Walk around the block"></div>
      <div class="field"><label for="gc">When and where? (optional)</label>
        <input id="gc" maxlength="140" value="${esc(g.cue||'')}" placeholder="e.g. After lunch, from the front door"></div>
      <div class="row" style="gap:14px;align-items:flex-start">
        <div class="field" style="flex:1;min-width:130px"><label for="gn">Times a week</label>
          <input id="gn" type="number" min="1" max="21" value="${g.target_per_week||3}"></div>
        <div class="field" style="flex:1;min-width:130px"><label for="gm">Minutes each time</label>
          <input id="gm" type="number" min="1" max="240" value="${g.minutes||10}"></div></div>
      <div class="field"><label for="gv">What it is for (optional)</label>
        <select id="gv"><option value="">Choose one</option>${VALUES.map(v=>
          `<option value="${v.key}" ${g.value_key===v.key?'selected':''}>${v.icon} ${esc(v.label)}</option>`).join('')}</select></div>
      <div class="field"><label for="gr">A day to look back on it (optional)</label>
        <input id="gr" type="date" value="${g.review_on||''}" min="${today()}"></div>
      <p class="faint">Small and specific tends to stick. You can change any of this later.</p>
      <div class="row" style="justify-content:flex-end">
        <button class="btn ghost" id="no">Cancel</button><button class="btn" id="yes">${g.id?'Save':'Add goal'}</button></div>`);
    back.querySelector('#no').onclick = () => back.remove();
    back.querySelector('#yes').onclick = async (e) => {
      const $ = (s) => back.querySelector(s);
      const title = $('#gt').value.trim();
      if (!title) return toast('Give it a name.','err');
      const clamp = (v, lo, hi, d) => Math.min(hi, Math.max(lo, Number(v) || d));
      const row = { title, cue: $('#gc').value.trim() || null,
        target_per_week: clamp($('#gn').value, 1, 21, 3), minutes: clamp($('#gm').value, 1, 240, 10),
        value_key: $('#gv').value || null, review_on: $('#gr').value || null };
      busy(e.target, true, 'Saving…');
      const { error } = g.id ? await sb.from('goals').update(row).eq('id', g.id)
                             : await sb.from('goals').insert({ ...row, user_id: uid });
      busy(e.target, false);
      if (error) return toast(error.message,'err');
      back.remove(); goalsView();
    };
  };
  document.getElementById('add').onclick = () => form();
  body().querySelectorAll('[data-edit]').forEach(b => b.onclick = () => form(goals.find(g=>g.id===b.dataset.edit)));
  body().querySelectorAll('[data-log]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = b.dataset.on
      ? await sb.from('goal_logs').delete().eq('goal_id', b.dataset.log).eq('logged_on', t)
      : await sb.from('goal_logs').insert({ goal_id: b.dataset.log, logged_on: t });
    if (error) { b.disabled = false; return toast(error.message,'err'); }
    if (!b.dataset.on) toast('Logged. Nice.','ok');
    goalsView();
  });
  body().querySelectorAll('[data-archive]').forEach(b => b.onclick = async () => {
    await sb.from('goals').update({ active:false }).eq('id', b.dataset.archive);
    goalsView();
  });
}

/* ------------------------------------------------------ what helped */
async function reflectView(){
  const { quest, reflections, steps } = await load();
  const t = today();
  const mine = reflections.find(r => r.noted_on === t);
  // Notes written on the quest map's writing actions show here too, newest first.
  const stepNotes = steps.filter(x => x.note).sort((a, b) => b.done_on.localeCompare(a.done_on));
  body().innerHTML = `
    <div class="grid g2">
      <div class="card pad-lg">
        <h2 style="margin-top:0">What felt helpful today?</h2>
        <p class="muted">A line or two, only if you want to. These notes are yours: nobody else can read
          them and nobody reviews them. Writing one also counts as a day shown up.</p>
        ${quest?.helper ? `<p class="faint" id="idea"></p>
          <button class="btn sm ghost" id="another" style="margin-bottom:12px">Give me a prompt idea</button>` : ''}
        <textarea id="helped" rows="5" maxlength="1000" placeholder="e.g. The walk after lunch. Tea without my phone.">${esc(mine?.helped||'')}</textarea>
        <div class="row" style="justify-content:flex-end;margin-top:12px">
          <button class="btn" id="save">${mine?'Update today\'s note':'Save'}</button></div>
        <p class="faint" style="margin-top:14px">If today was hard in a way that a note can't hold, you don't have
          to handle it alone: <a href="therapists.html">find a therapist</a>, see
          <a href="#map" data-go="map">help near you</a>, or call or text <a href="tel:988">988</a> any time.</p>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Earlier notes</h3>
        ${reflections.length ? reflections.map(r=>`<div class="refl">
          <div class="spread"><span class="faint">${fmtDate(r.noted_on+'T12:00')}</span>
            <button class="btn sm ghost" data-del="${r.id}">Delete</button></div>
          <div style="white-space:pre-wrap">${esc(r.helped)}</div></div>`).join('')
          : '<p class="faint">Nothing yet.</p>'}
        ${stepNotes.length ? `<h3 style="margin-top:22px">From your quest map</h3>
          ${stepNotes.map(x=>`<div class="refl">
            <div class="faint">${fmtDate(x.done_on+'T12:00')} · ${esc(action(x.action_key)?.text||x.action_key)}</div>
            <div style="white-space:pre-wrap">${esc(x.note)}</div></div>`).join('')}` : ''}
      </div>
    </div>`;
  const idea = () => { const el = document.getElementById('idea');
    if (el) el.textContent = '💡 ' + helper.prompt(quest.categories, Date.now()); };
  idea();
  document.getElementById('another')?.addEventListener('click', idea);
  document.getElementById('save').onclick = async (e) => {
    const helped = document.getElementById('helped').value.trim();
    if (!helped) return toast('Write a few words first, or leave it for another day.', 'err');
    busy(e.target, true, 'Saving…');
    const { error } = await sb.from('quest_reflections')
      .upsert({ user_id: uid, noted_on: t, helped }, { onConflict: 'user_id,noted_on' });
    busy(e.target, false);
    if (error) return toast(error.message, 'err');
    toast('Saved.', 'ok'); reflectView();
  };
  body().querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('quest_reflections').delete().eq('id', b.dataset.del);
    if (error) return toast(error.message, 'err');
    reflectView();
  });
}

/* -------------------------------------------------------- your data */
function dataView(){
  body().innerHTML = `
    <div class="grid g2">
      <div class="card pad-lg">
        <h2 style="margin-top:0">Your data, your call</h2>
        <ul class="muted" style="padding-left:18px">
          <li>Your quest, goals and notes can only be read by you. Therapists on Theraglee, other members and
            the admin screen have no access to them.</li>
          <li>We never sell or share this data, and it is not used for advertising.</li>
          <li>The suggestion helper runs in your browser from the choices you made. Nothing you write is
            sent to an AI service or anywhere else.</li>
          <li>Theraglee is a wellness site, not a health care provider, so nothing here is a medical record.
            See the <a href="privacy.html">privacy policy</a> for the details.</li>
        </ul>
      </div>
      <div class="card pad-lg stack">
        <div><h3>Download</h3><p class="faint">Everything on this page, as a file you keep.</p>
          <button class="btn ghost" id="dl">Download my goals and quest data</button></div>
        <div><h3>Delete notes</h3><p class="faint">Removes every "What helped" note. Your map and goals stay.</p>
          <button class="btn danger" id="del-notes">Delete all my notes</button></div>
        <div><h3>Start over</h3><p class="faint">Removes your quests, the actions you marked, your notes, and
          your goals and their logs. This cannot be undone.</p>
          <button class="btn danger" id="del-all">Delete all goals and quest data</button></div>
      </div>
    </div>`;
  document.getElementById('dl').onclick = async (e) => {
    busy(e.target, true, 'Gathering…');
    const [q, s, r, g] = await Promise.all([
      sb.from('quests').select('*').eq('user_id', uid),
      sb.from('quest_steps').select('*').eq('user_id', uid),
      sb.from('quest_reflections').select('*').eq('user_id', uid),
      sb.from('goals').select('*, goal_logs(*)').eq('user_id', uid),
    ]);
    const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(),
      quests: q.data, quest_steps: s.data, reflections: r.data, goals: g.data }, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = 'theraglee-goals-and-quest.json'; link.click();
    URL.revokeObjectURL(url);
    busy(e.target, false);
  };
  const confirmThen = (title, text, run) => {
    const back = modal(`<h2>${title}</h2><p class="muted">${text}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="no">Keep it</button>
      <button class="btn danger" id="yes">Delete</button></div>`);
    back.querySelector('#no').onclick = () => back.remove();
    back.querySelector('#yes').onclick = async (e) => {
      busy(e.target, true, 'Deleting…');
      const errors = (await run()).map(x => x.error).filter(Boolean);
      busy(e.target, false); back.remove();
      if (errors.length) return toast(errors[0].message, 'err');
      toast('Deleted.', 'ok');
    };
  };
  document.getElementById('del-notes').onclick = () => confirmThen('Delete all notes?',
    'Every "What helped" note will be removed for good.',
    () => Promise.all([sb.from('quest_reflections').delete().eq('user_id', uid)]));
  document.getElementById('del-all').onclick = () => confirmThen('Delete all goals and quest data?',
    'Your quests, marked actions, notes, goals and goal logs will be removed for good.',
    () => Promise.all([
      sb.from('quests').delete().eq('user_id', uid),              // takes its quest_steps with it
      sb.from('quest_steps').delete().eq('user_id', uid),
      sb.from('quest_reflections').delete().eq('user_id', uid),
      sb.from('goals').delete().eq('user_id', uid),               // takes its goal_logs with it
    ]));
}

/* ------------------------------------------------------------- map */
const mapView = () => nearbyView(body(), a.profile.zip || '');

function render(){
  root.innerHTML = shell('<div class="skeleton" style="height:120px"></div>');
  root.querySelectorAll('.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
  ({ quest: questView, goals: goalsView, reflect: reflectView, data: dataView, map: mapView }[tab] || questView)();
}
function go(t){ tab = t; history.replaceState({},'', '#'+tab); render(); window.scrollTo({ top: 0 }); }
// "Help near you" links in the wellness note and the reflection box open the Nearby help tab.
root.addEventListener('click', (e) => {
  const l = e.target.closest('[data-go]');
  if (l) { e.preventDefault(); go(l.dataset.go); }
});
render();
}
}
</script>
</body>
</html>
