<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<title>Challenges — Theraglee</title>
<meta name="description" content="Free 7-day mental health challenges, 30-day programmes, and custom challenges up to a full year.">
<style>
  .day{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border:1px solid var(--hair);
    border-radius:var(--r-sm);margin-bottom:8px;background:var(--paper)}
  .day.done{background:var(--soft);border-color:var(--mist)}
  .day.today{border-color:var(--lime-2);box-shadow:0 0 0 3px rgba(141,198,29,.15)}
  .day .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--sand);display:grid;
    place-items:center;font-size:.82rem;font-weight:600;color:var(--muted)}
  .day.done .n{background:var(--green);color:#fff}
  .day input{margin-top:9px;accent-color:var(--green);width:18px;height:18px}
</style>
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:200px"></div>
</div></main>

<script type="module">
import { chrome, sb, esc, qs, tierName, toast, busy, fmtDate, modal, unlockHref } from './assets/app.js';
const a = await chrome({ active:'challenges.html' });
const root = document.getElementById('root');

async function view(){
  const openId = qs('open'), tmplSlug = qs('template');
  if (openId) return viewRun(openId);
  if (tmplSlug) return viewTemplate(tmplSlug);
  return viewIndex();
}

async function viewIndex(){
  const { data: cat } = await sb.from('content_catalog').select('*').eq('kind','challenge');
  let mine = [];
  if (a.authenticated) {
    const { data } = await sb.from('user_challenges')
      .select('*').eq('user_id', a.profile.id).order('created_at', { ascending:false });
    mine = data || [];
  }
  let doneMap = {};
  if (mine.length) {
    const { data: prog } = await sb.from('user_challenge_progress')
      .select('user_challenge_id, day').in('user_challenge_id', mine.map(m=>m.id));
    (prog||[]).forEach(r => { (doneMap[r.user_challenge_id] ||= new Set()).add(r.day); });
  }

  root.innerHTML = `
    <h1>Challenges</h1>
    <p class="muted" style="max-width:56ch">Small daily actions, one at a time. Registered members get
      7-day challenges free; Basic and Premium design their own, up to a full year.</p>

    ${mine.length ? `<h2 style="margin-top:36px">Yours</h2><div class="grid g2">${mine.map(c=>{
        const n = doneMap[c.id]?.size || 0, pct = Math.round(n/c.total_days*100);
        return `<a class="tile" href="challenges.html?open=${c.id}">
          <h3>${esc(c.title)}</h3>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <span class="meta">${n} of ${c.total_days} days · started ${fmtDate(c.started_on)}${c.archived?' · archived':''}</span>
        </a>`; }).join('')}</div>` : ''}

    <div class="spread" style="margin-top:40px">
      <h2 style="margin:0">Ready-made</h2>
      <button class="btn ${a.level<2?'ghost':''}" id="custom">Design your own</button>
    </div>
    <div class="grid g3" style="margin-top:18px">${(cat||[]).sort((x,y)=>x.min_level-y.min_level).map(r=>{
      const locked = r.min_level > a.level;
      return `<a class="tile ${locked?'locked':''}" href="${locked?unlockHref(r.min_level,a.authenticated):'challenges.html?template='+encodeURIComponent(r.slug)}">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <h3>${esc(r.title)}</h3>
          ${locked?`<span class="badge lock">${tierName(r.min_level)}</span>`:''}
        </div>
        <p class="meta" style="color:var(--muted)">${esc(String(r.description||'').slice(0,120))}</p>
      </a>`; }).join('')}</div>`;

  document.getElementById('custom').addEventListener('click', customFlow);
}

function customFlow(){
  if (!a.authenticated) { location.href = 'login.html?next=challenges.html'; return; }
  const cap = a.level >= 2 ? 365 : 7;
  const back = modal(`
    <h2>Design your own challenge</h2>
    <p class="muted">${a.level>=2
      ? 'Choose any length up to 365 days, then write a task for each day as you go.'
      : 'On the Free membership you can build a 7-day challenge. Basic and Premium go up to 365.'}</p>
    <div class="field"><label for="ct">What are you calling it?</label>
      <input id="ct" type="text" placeholder="e.g. My sleep reset"></div>
    <div class="field"><label for="cd">How many days? (1–${cap})</label>
      <input id="cd" type="number" min="1" max="${cap}" value="${Math.min(7,cap)}"></div>
    ${a.level<2?'<div class="notice warn">Want longer than 7 days? <a href="pricing.html">See Basic</a>.</div>':''}
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      <button class="btn ghost" id="cancel">Cancel</button>
      <button class="btn" id="create">Create</button></div>`);
  back.querySelector('#cancel').onclick = () => back.remove();
  back.querySelector('#create').onclick = async (e) => {
    const title = back.querySelector('#ct').value.trim();
    const days  = Number(back.querySelector('#cd').value);
    if (!title) return toast('Give it a name first.','err');
    if (!(days >= 1 && days <= cap)) return toast(`Choose between 1 and ${cap} days.`,'err');
    busy(e.target, true, 'Creating…');
    const { data, error } = await sb.from('user_challenges')
      .insert({ user_id: a.profile.id, title, total_days: days }).select().single();
    busy(e.target, false);
    if (error) return toast(error.message,'err');
    location.href = 'challenges.html?open=' + data.id;
  };
}

async function viewTemplate(slug){
  const { data: t } = await sb.from('challenge_templates').select('*').eq('slug', slug).maybeSingle();
  if (!t) {
    const { data: cat } = await sb.from('content_catalog').select('*').eq('slug',slug).eq('kind','challenge').maybeSingle();
    if (cat) return root.innerHTML = `<div class="wrap narrow"><div class="card pad-lg center">
      <span class="badge lock">${tierName(cat.min_level)} membership</span>
      <h2 style="margin-top:14px">${esc(cat.title)}</h2>
      <p class="muted">This challenge is part of ${tierName(cat.min_level)}.</p>
      <a class="btn lg" href="${unlockHref(cat.min_level, a.authenticated)}">${
        cat.min_level <= 1 && !a.authenticated ? 'Create a free account' : 'See membership options'}</a></div></div>`;
    return root.innerHTML = '<div class="empty">Challenge not found.</div>';
  }
  document.title = t.title + ' — Theraglee';
  const { data: days } = await sb.from('challenge_days').select('*').eq('template_id', t.id).order('day');
  root.innerHTML = `
    <div class="narrow" style="margin:0 auto">
    <a class="faint" href="challenges.html">← All challenges</a>
    <h1 style="margin-top:12px">${esc(t.title)}</h1>
    <p class="muted">${esc(t.description||'')}</p>
    <div class="row"><span class="badge">${t.total_days} days</span>
      <button class="btn" id="start">Start this challenge</button></div>
    <h2 style="margin-top:34px">The plan</h2>
    ${(days||[]).map(d=>`<div class="day"><div class="n">${d.day}</div>
      <div><strong>${esc(d.title||('Day '+d.day))}</strong><br>
      <span class="muted">${esc(d.task)}</span></div></div>`).join('')}
    </div>`;
  document.getElementById('start').addEventListener('click', async (e) => {
    if (!a.authenticated) { location.href = 'login.html?next=' + encodeURIComponent('challenges.html?template='+slug); return; }
    busy(e.target, true, 'Starting…');
    const { data, error } = await sb.from('user_challenges').insert({
      user_id: a.profile.id, template_id: t.id, title: t.title, total_days: t.total_days,
    }).select().single();
    busy(e.target, false);
    if (error) return toast(error.message,'err');
    location.href = 'challenges.html?open=' + data.id;
  });
}

async function viewRun(id){
  if (!a.authenticated) { location.href = 'login.html?next=' + encodeURIComponent('challenges.html?open='+id); return; }
  const { data: run } = await sb.from('user_challenges').select('*').eq('id', id).maybeSingle();
  if (!run) return root.innerHTML = '<div class="empty">Challenge not found.</div>';
  document.title = run.title + ' — Theraglee';

  let plan = [];
  if (run.template_id) {
    const { data } = await sb.from('challenge_days').select('*').eq('template_id', run.template_id).order('day');
    plan = data || [];
  } else {
    plan = (run.custom_days || []);
  }
  const { data: prog } = await sb.from('user_challenge_progress')
    .select('day').eq('user_challenge_id', run.id);
  const done = new Set((prog||[]).map(r=>r.day));

  const started = new Date(run.started_on);
  const elapsed = Math.floor((Date.now() - started.getTime()) / 86400000) + 1;

  function paint(){
    const pct = Math.round(done.size / run.total_days * 100);
    root.innerHTML = `
      <div class="narrow" style="margin:0 auto">
      <a class="faint" href="challenges.html">← All challenges</a>
      <div class="spread" style="margin-top:12px">
        <h1 style="margin:0">${esc(run.title)}</h1>
        <button class="btn ghost sm" id="archive">${run.archived?'Unarchive':'Archive'}</button>
      </div>
      <div class="bar" style="margin:18px 0 8px"><i style="width:${pct}%"></i></div>
      <p class="faint">${done.size} of ${run.total_days} days complete · started ${fmtDate(run.started_on)}</p>
      <div style="margin-top:24px">${Array.from({length: run.total_days}, (_,i)=>{
        const d = i+1;
        const item = plan.find(x => x.day === d);
        const isToday = d === Math.min(elapsed, run.total_days);
        return `<div class="day ${done.has(d)?'done':''} ${isToday && !done.has(d)?'today':''}">
          <input type="checkbox" data-d="${d}" ${done.has(d)?'checked':''}>
          <div class="n">${d}</div>
          <div style="flex:1">
            <strong>${esc(item?.title || 'Day ' + d)}</strong>
            ${item?.task ? `<br><span class="muted">${esc(item.task)}</span>`
              : `<br><input type="text" class="taskin" data-d="${d}" placeholder="What will you do on day ${d}?"
                   value="${esc(item?.task||'')}" style="margin-top:6px">`}
          </div></div>`;
      }).join('')}</div></div>`;

    root.querySelectorAll('.day input[type=checkbox]').forEach(c => c.addEventListener('change', async () => {
      const d = Number(c.dataset.d);
      if (c.checked) {
        done.add(d);
        await sb.from('user_challenge_progress').upsert(
          { user_challenge_id: run.id, day: d }, { onConflict: 'user_challenge_id,day' });
      } else {
        done.delete(d);
        await sb.from('user_challenge_progress').delete().eq('user_challenge_id', run.id).eq('day', d);
      }
      c.closest('.day').classList.toggle('done', c.checked);
      root.querySelector('.bar>i').style.width = Math.round(done.size/run.total_days*100) + '%';
      root.querySelector('.bar + .faint').textContent =
        `${done.size} of ${run.total_days} days complete · started ${fmtDate(run.started_on)}`;
    }));

    let t;
    root.querySelectorAll('.taskin').forEach(inp => inp.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(async () => {
        const d = Number(inp.dataset.d);
        const idx = plan.findIndex(x => x.day === d);
        if (idx >= 0) plan[idx].task = inp.value; else plan.push({ day:d, title:null, task: inp.value });
        await sb.from('user_challenges').update({ custom_days: plan }).eq('id', run.id);
      }, 900);
    }));

    document.getElementById('archive').addEventListener('click', async (e) => {
      await sb.from('user_challenges').update({ archived: !run.archived }).eq('id', run.id);
      run.archived = !run.archived; toast(run.archived?'Archived.':'Back in progress.','ok'); paint();
    });
  }
  paint();
}

view();
</script>
</body>
</html>
