<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<title>Challenges — Theraglee</title>
<meta name="description" content="Themed daily challenges for everyday wellbeing. Pick a theme like gratitude or slowing down the mental chatter, choose 7 to 365 days, and check off one small to-do a day.">
<style>
  .theme{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px}
  .day{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border:1px solid var(--hair);
    border-radius:var(--r-sm);margin-bottom:8px;background:var(--paper);scroll-margin-top:90px}
  .day.done{background:var(--soft);border-color:var(--mist)}
  .day.done .task{text-decoration:line-through;color:var(--muted)}
  .day.today{border-color:var(--lime-2);box-shadow:0 0 0 3px rgba(141,198,29,.15)}
  .day .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--sand);display:grid;
    place-items:center;font-size:.82rem;font-weight:600;color:var(--muted)}
  .day.done .n{background:var(--green);color:#fff}
  .day input[type=checkbox]{margin-top:9px;accent-color:var(--green);width:18px;height:18px;flex:0 0 auto}
  .day .when{font-size:.78rem;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0 6px}
  .stat{padding:14px 16px;border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--paper)}
  .stat b{display:block;font-size:1.45rem;font-weight:400;color:var(--green);line-height:1.15}
  .stat span{font-size:.8rem;color:var(--muted)}
  .lengths{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .lengths .chip.lock{opacity:.6}
  .customrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .customrow input{width:110px}
</style>
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:200px"></div>
</div></main>

<script type="module">
import { chrome, sb, esc, qs, tierName, toast, busy, fmtDate, modal, unlockHref } from './assets/app.js';
const a = await chrome({ active:'challenges.html' });
const root = document.getElementById('root');

/* A challenge is a theme with 365 daily to-dos. The member picks how long it
   runs (7 to 365 days) and day d shows to-do d. Runs longer than the bank only
   happen for a theme that predates the full year; those go back to the top. */
const LENGTHS = [7, 21, 30, 90, 120, 150, 180, 365];
const CUSTOM = { min: 8, max: 364 };
const FREE_CAP = 7;   // the database enforces this too (guard_challenge_length)
const NOTICE = 'Challenges are everyday practices for wellbeing, not a diagnosis or a treatment for any mental health condition. If things feel heavier than a small daily step can help with, a therapist is the right next call.';

const pad = (n) => String(n).padStart(2, '0');
const localISO = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay = (iso) => { const [y,m,d] = String(iso).slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (date, n) => { const x = new Date(date); x.setDate(x.getDate() + n); return x; };
const taskFor = (bank, d) => bank.length ? (bank[d - 1] ?? bank[(d - 1) % bank.length]) : null;
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

async function view(){
  const openId = qs('open'), tmplSlug = qs('template');
  if (openId) return viewRun(openId);
  if (tmplSlug) return viewTemplate(tmplSlug);
  return viewIndex();
}

/* ------------------------------------------------------------ index */
async function viewIndex(){
  // content_catalog is readable signed out, so visitors can browse the themes.
  const { data: cat } = await sb.from('content_catalog').select('*').eq('kind','challenge').order('title');
  let mine = [];
  if (a.authenticated) {
    const { data } = await sb.from('user_challenges')
      .select('*').eq('user_id', a.profile.id).order('created_at', { ascending:false });
    mine = data || [];
  }
  const doneMap = {};
  if (mine.length) {
    const { data: prog } = await sb.from('user_challenge_progress')
      .select('user_challenge_id, day').in('user_challenge_id', mine.map(m=>m.id));
    (prog||[]).forEach(r => { (doneMap[r.user_challenge_id] ||= new Set()).add(r.day); });
  }

  root.innerHTML = `
    <h1>Challenges</h1>
    <p class="muted" style="max-width:60ch">Pick a theme, choose how many days you want it to run, and
      check off one small to-do each day. Every registered member can run any theme for a week;
      Basic and Premium choose any length up to a full year.</p>

    ${mine.length ? `<h2 style="margin-top:36px">Yours</h2><div class="grid g2" id="mine">${mine.map(c=>{
        const n = doneMap[c.id]?.size || 0, pct = Math.round(n/c.total_days*100);
        return `<div class="tile" data-run="${c.id}">
          <h3><a href="challenges.html?open=${c.id}">${esc(c.title)}</a></h3>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <span class="meta">${n} of ${c.total_days} days · started ${fmtDate(c.started_on)}${c.archived?' · archived':''}</span>
          <div class="row" style="margin-top:12px">
            <a class="btn sm" href="challenges.html?open=${c.id}">Open</a>
            <button class="btn ghost sm" data-remove="${c.id}" data-title="${esc(c.title)}">Remove</button></div>
        </div>`; }).join('')}</div>` : ''}

    <h2 style="margin-top:40px">Pick a theme</h2>
    <div class="field" style="margin-top:14px;max-width:48ch">
      <label for="q">Search the themes</label>
      <input id="q" type="search" placeholder="Try “gratitude”, “sleep”, “worry”…" autocomplete="off">
    </div>
    <p class="faint" id="count"></p>
    <div class="grid g3" id="themes" style="margin-top:14px"></div>
    <p class="faint" style="margin-top:32px;max-width:64ch">${NOTICE}</p>`;

  const themes = (cat || []).map(r => ({ r, text: [r.title, r.description, r.category, ...(r.tags||[])].join(' ').toLowerCase() }));
  const grid = document.getElementById('themes'), count = document.getElementById('count'), q = document.getElementById('q');
  function paintThemes(){
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = themes.filter(t => words.every(w => t.text.includes(w)));
    grid.innerHTML = hits.map(({ r }) => `
      <a class="tile" href="challenges.html?template=${encodeURIComponent(r.slug)}">
        <p class="theme">${esc(r.category||'Challenge')}</p>
        <h3>${esc(r.title)}</h3>
        <p class="meta" style="color:var(--muted)">${esc(r.description||'')}</p>
      </a>`).join('');
    if (!themes.length) grid.innerHTML = '<div class="empty">The themes are on their way. Check back soon.</div>';
    else if (!hits.length) grid.innerHTML = `<div class="empty">Nothing matches “${esc(q.value)}”. Try a different word, or clear the search to see every theme.</div>`;
    count.textContent = words.length ? `${hits.length} of ${themes.length} themes` : `${themes.length} themes, two more added every day`;
  }
  q.addEventListener('input', paintThemes);
  paintThemes();

  root.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
    confirmRemove(b.dataset.remove, b.dataset.title, () => {
      b.closest('[data-run]').remove();
      const grid = document.getElementById('mine');
      if (grid && !grid.children.length) { grid.previousElementSibling.remove(); grid.remove(); }
    });
  }));
}

/* Removing a challenge deletes the run and every day ticked on it. A member
   who wants to keep the record archives it instead. */
function confirmRemove(id, title, done){
  const back = modal(`
    <h2>Remove this challenge?</h2>
    <p class="muted">“${esc(title)}” and the days you have checked off on it will be deleted. This cannot be undone.
      If you would rather keep the record, archive it instead.</p>
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      <button class="btn ghost" id="keep">Keep it</button>
      <button class="btn danger" id="remove">Remove</button></div>`);
  back.querySelector('#keep').onclick = () => back.remove();
  back.querySelector('#remove').onclick = async (e) => {
    busy(e.target, true, 'Removing…');
    const { error } = await sb.from('user_challenges').delete().eq('id', id);
    busy(e.target, false);
    if (error) return toast(error.message, 'err');
    back.remove();
    toast('Challenge removed.', 'ok');
    done();
  };
}

/* --------------------------------------------------------- a theme */
async function viewTemplate(slug){
  const { data: t } = await sb.from('challenge_templates').select('*').eq('slug', slug).maybeSingle();
  if (!t) {
    // Signed-out visitors can read the tile but not the theme itself.
    const { data: cat } = await sb.from('content_catalog').select('*').eq('slug',slug).eq('kind','challenge').maybeSingle();
    if (cat) {
      document.title = cat.title + ' — Theraglee';
      return root.innerHTML = `<div class="narrow" style="margin:0 auto">
        <a class="faint" href="challenges.html">← All challenges</a>
        <p class="theme" style="margin-top:12px">${esc(cat.category||'Challenge')}</p>
        <h1>${esc(cat.title)}</h1>
        <p class="muted">${esc(cat.description||'')}</p>
        <div class="card pad-lg center" style="margin-top:24px">
          <span class="badge lock">Free membership</span>
          <h2 style="margin-top:14px">Start it with a free account</h2>
          <p class="muted">Registering is free and never asks for a card. You choose how many days the
            challenge runs and check off one small to-do a day.</p>
          <a class="btn lg" href="${unlockHref(1, a.authenticated)}">Create a free account</a></div>
        <p class="faint" style="margin-top:28px">${NOTICE}</p></div>`;
    }
    return root.innerHTML = '<div class="empty">Challenge not found. <a href="challenges.html">Back to the challenges</a></div>';
  }
  document.title = t.title + ' — Theraglee';
  const { data: days } = await sb.from('challenge_days').select('day,task').eq('template_id', t.id).order('day');
  const bank = (days||[]).map(d => d.task);
  const canLong = a.level >= 2;
  let chosen = 7;

  root.innerHTML = `
    <div class="narrow" style="margin:0 auto">
    <a class="faint" href="challenges.html">← All challenges</a>
    <p class="theme" style="margin-top:12px">${esc(t.category||'Challenge')} · ${plural(bank.length, 'daily to-do')}</p>
    <h1 style="margin-top:4px">${esc(t.title)}</h1>
    <p class="muted">${esc(t.description||'')}</p>

    <div class="card" style="margin-top:22px">
      <h3 style="margin:0">How many days?</h3>
      <p class="muted" style="margin:6px 0 0">Pick a length, or type your own between ${CUSTOM.min} and ${CUSTOM.max} days.${canLong ? '' :
        ' Free members run any theme for 7 days; Basic and Premium choose any length up to a year.'}</p>
      <div class="lengths" id="lengths">${LENGTHS.map(n =>
        `<button class="chip ${n===chosen?'on':''}" data-n="${n}">${n} days${!canLong && n > FREE_CAP ? ' <span class="badge lock">Basic</span>' : ''}</button>`
      ).join('')}</div>
      <div class="customrow">
        <label for="custom-n" class="muted">Custom:</label>
        <input id="custom-n" type="number" min="${CUSTOM.min}" max="${CUSTOM.max}" placeholder="${CUSTOM.min}–${CUSTOM.max}">
        <span class="faint">days${!canLong ? ' (Basic and Premium)' : ''}</span></div>
      <div class="row" style="margin-top:18px;align-items:center;gap:14px">
        <button class="btn" id="start">Start a 7-day challenge</button>
        <span class="faint" id="ends"></span></div>
    </div>

    <h2 style="margin-top:34px">What the days look like</h2>
    <p class="muted">The first week, to give you a feel for it. Each day is one small thing.</p>
    ${bank.slice(0, 7).map((task, i) => `<div class="day"><div class="n">${i+1}</div>
      <div class="task">${esc(task)}</div></div>`).join('')}
    ${bank.length > 7 ? `<p class="faint">…and ${bank.length - 7} more, a different one for every day${bank.length >= 365 ? ' of a full year' : ''}.</p>` : ''}
    <p class="faint" style="margin-top:28px">${NOTICE}</p>
    </div>`;

  const startBtn = root.querySelector('#start');
  const ends = root.querySelector('#ends');
  const customIn = root.querySelector('#custom-n');
  function paintChoice(){
    startBtn.textContent = `Start a ${chosen}-day challenge`;
    ends.textContent = `Starts today and ends ${fmtDate(addDays(parseDay(localISO()), chosen - 1))}.`;
    root.querySelectorAll('#lengths .chip[data-n]').forEach(c => c.classList.toggle('on', Number(c.dataset.n) === chosen));
  }
  // A Free member who picks more than a week is shown what Basic adds, and the
  // choice snaps back to 7 days. The database refuses the longer run anyway.
  function upgradePrompt(n){
    const back = modal(`
      <span class="badge lock">Basic membership</span>
      <h2 style="margin-top:14px">Longer challenges come with Basic</h2>
      <p class="muted">On the Free membership a challenge runs for 7 days. Basic and Premium members choose any length
        up to a full year, so a ${n}-day run of this theme is one upgrade away. It is quick to set up and just as easy to cancel.</p>
      <div class="row" style="margin-top:18px;justify-content:flex-end">
        <button class="btn ghost" id="stay">Stay with 7 days</button>
        <a class="btn" href="pricing.html">See membership options</a></div>`);
    back.querySelector('#stay').onclick = () => back.remove();
  }
  function choose(n, fromCustom = false){
    if (!canLong && n > FREE_CAP) {
      upgradePrompt(n);
      chosen = FREE_CAP;
      if (fromCustom) customIn.value = '';
    } else chosen = n;
    if (!fromCustom) customIn.value = '';
    paintChoice();
  }
  root.querySelectorAll('#lengths .chip[data-n]').forEach(c => c.addEventListener('click', () => choose(Number(c.dataset.n))));
  customIn.addEventListener('change', () => {
    const n = Number(customIn.value);
    if (customIn.value === '') return;
    if (!(n >= CUSTOM.min && n <= CUSTOM.max)) { toast(`A custom length is between ${CUSTOM.min} and ${CUSTOM.max} days.`, 'err'); customIn.value = ''; return; }
    choose(n, true);
  });
  customIn.addEventListener('input', () => {
    const n = Number(customIn.value);
    if (n >= CUSTOM.min && n <= CUSTOM.max && (canLong || n <= FREE_CAP)) { chosen = n; paintChoice(); }
  });
  paintChoice();

  startBtn.addEventListener('click', async (e) => {
    if (!a.authenticated) { location.href = 'login.html?next=' + encodeURIComponent('challenges.html?template='+slug); return; }
    if (customIn.value !== '' && !(Number(customIn.value) >= CUSTOM.min && Number(customIn.value) <= CUSTOM.max)) {
      return toast(`A custom length is between ${CUSTOM.min} and ${CUSTOM.max} days.`, 'err');
    }
    if (!canLong && chosen > FREE_CAP) return upgradePrompt(chosen);
    busy(e.target, true, 'Starting…');
    const { data, error } = await sb.from('user_challenges').insert({
      user_id: a.profile.id, template_id: t.id, title: t.title, total_days: chosen,
    }).select().single();
    busy(e.target, false);
    if (error) return toast(error.message,'err');
    location.href = 'challenges.html?open=' + data.id;
  });
}

/* ----------------------------------------------------------- a run */
async function viewRun(id){
  if (!a.authenticated) { location.href = 'login.html?next=' + encodeURIComponent('challenges.html?open='+id); return; }
  const { data: run } = await sb.from('user_challenges').select('*').eq('id', id).maybeSingle();
  if (!run) return root.innerHTML = '<div class="empty">Challenge not found. <a href="challenges.html">Back to the challenges</a></div>';
  document.title = run.title + ' — Theraglee';

  let theme = null, bank = [];
  if (run.template_id) {
    const [{ data: t }, { data: days }] = await Promise.all([
      sb.from('challenge_templates').select('slug,title,description,category').eq('id', run.template_id).maybeSingle(),
      sb.from('challenge_days').select('day,task').eq('template_id', run.template_id).order('day'),
    ]);
    theme = t; bank = (days||[]).map(d => d.task);
  }
  const custom = !bank.length;                 // a run from before themes, or a retired theme
  const plan = run.custom_days || [];          // that run's own to-dos, by day
  const { data: prog } = await sb.from('user_challenge_progress')
    .select('day, completed_on').eq('user_challenge_id', run.id);
  const done = new Map((prog||[]).map(r => [r.day, r.completed_on]));

  const N = run.total_days;
  const start = parseDay(run.started_on);
  const today = parseDay(localISO());
  const todayN = Math.floor((today - start) / 86400000) + 1;   // which day of the run today is
  const current = Math.min(Math.max(todayN, 1), N);
  const endDate = addDays(start, N - 1);

  function stats(){
    const n = done.size;
    const pct = Math.round(n / N * 100);
    const finished = n >= N;
    const ended = todayN > N;
    const soFar = Math.min(Math.max(todayN, 0), N);
    const doneSoFar = [...done.keys()].filter(d => d <= soFar).length;
    const weekAgo = localISO(addDays(today, -6));
    const thisWeek = [...done.values()].filter(d => d && d >= weekAgo).length;
    const tiles = [
      [`${n} of ${N}`, 'days completed'],
      [`${pct}%`, 'of the way there'],
      [ended ? 'Ended' : `Day ${current}`, ended ? fmtDate(endDate) : `of ${N} · today`],
      [`${N - n}`, 'still to do'],
      [`${doneSoFar} of ${soFar}`, 'checked off so far'],
      [`${thisWeek}`, 'done in the last 7 days'],
      [finished ? 'Finished' : fmtDate(endDate), finished ? 'every day done' : 'last day'],
    ];
    let nudge = '';
    if (finished) nudge = `<div class="notice">You finished every day of this challenge. Pick a <a href="challenges.html">new theme</a> whenever you like.</div>`;
    else if (ended) nudge = `<div class="notice warn">This challenge ended on ${fmtDate(endDate)}. You can still check off days you did, or archive it and start another.</div>`;
    else if (todayN < 1) nudge = `<div class="notice">This challenge starts ${fmtDate(start)}.</div>`;
    else if (!done.has(current)) {
      const task = custom ? (plan.find(x => x.day === current)?.task || '') : taskFor(bank, current);
      nudge = `<div class="notice"><strong>Today is day ${current}${task ? ':' : '.'}</strong> ${esc(task||'')}<br>
        <span class="muted">Check it off once you have done it.</span></div>`;
    } else nudge = `<div class="notice">Day ${current} is done. Come back tomorrow for the next one.</div>`;
    return `<div class="bar"><i style="width:${pct}%"></i></div>
      <div class="stats">${tiles.map(([b,s]) => `<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('')}</div>
      ${nudge}`;
  }

  root.innerHTML = `
    <div class="narrow" style="margin:0 auto">
    <a class="faint" href="challenges.html">← All challenges</a>
    <div class="spread" style="margin-top:12px;align-items:flex-start">
      <div>
        ${theme?.category ? `<p class="theme">${esc(theme.category)} · ${N} days</p>` : `<p class="theme">Challenge · ${N} days</p>`}
        <h1 style="margin:0">${esc(run.title)}</h1>
        ${theme?.description ? `<p class="muted" style="margin-top:8px">${esc(theme.description)}</p>` : ''}
      </div>
      <div class="row">
        <button class="btn ghost sm" id="archive">${run.archived?'Unarchive':'Archive'}</button>
        <button class="btn ghost sm" id="remove">Remove</button></div>
    </div>
    <p class="faint">Started ${fmtDate(run.started_on)}${run.archived ? ' · archived' : ''}</p>
    <div id="stats">${stats()}</div>

    <div class="spread" style="margin-top:26px">
      <h2 style="margin:0">Your days</h2>
      ${todayN >= 1 && todayN <= N ? `<a class="btn ghost sm" href="#d${current}" id="jump">Jump to today</a>` : ''}
    </div>
    <div style="margin-top:14px">${Array.from({length: N}, (_,i)=>{
      const d = i+1;
      const task = custom ? (plan.find(x => x.day === d)?.task || '') : taskFor(bank, d);
      const isToday = d === todayN;
      return `<div class="day ${done.has(d)?'done':''} ${isToday && !done.has(d)?'today':''}" id="d${d}">
        <input type="checkbox" data-d="${d}" ${done.has(d)?'checked':''} aria-label="Day ${d} done">
        <div class="n">${d}</div>
        <div style="flex:1">
          <span class="when">Day ${d} · ${fmtDate(addDays(start, i))}${isToday ? ' · today' : ''}</span>
          ${custom
            ? `<input type="text" class="taskin" data-d="${d}" placeholder="What will you do on day ${d}?"
                 value="${esc(task)}" style="margin-top:6px">`
            : `<div class="task">${esc(task)}</div>`}
        </div></div>`;
    }).join('')}</div>
    <p class="faint" style="margin-top:28px">${NOTICE}</p>
    </div>`;

  const statsEl = root.querySelector('#stats');
  root.querySelectorAll('.day input[type=checkbox]').forEach(c => c.addEventListener('change', async () => {
    const d = Number(c.dataset.d);
    const row = c.closest('.day');
    if (c.checked) {
      const on = localISO();
      done.set(d, on);
      const { error } = await sb.from('user_challenge_progress').upsert(
        { user_challenge_id: run.id, day: d, completed_on: on }, { onConflict: 'user_challenge_id,day' });
      if (error) { done.delete(d); c.checked = false; return toast(error.message, 'err'); }
    } else {
      done.delete(d);
      const { error } = await sb.from('user_challenge_progress').delete().eq('user_challenge_id', run.id).eq('day', d);
      if (error) { done.set(d, localISO()); c.checked = true; return toast(error.message, 'err'); }
    }
    row.classList.toggle('done', c.checked);
    row.classList.toggle('today', d === todayN && !c.checked);
    statsEl.innerHTML = stats();
  }));

  let timer;
  root.querySelectorAll('.taskin').forEach(inp => inp.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const d = Number(inp.dataset.d);
      const idx = plan.findIndex(x => x.day === d);
      if (idx >= 0) plan[idx].task = inp.value; else plan.push({ day:d, title:null, task: inp.value });
      await sb.from('user_challenges').update({ custom_days: plan }).eq('id', run.id);
    }, 900);
  }));

  document.getElementById('archive').addEventListener('click', async () => {
    const { error } = await sb.from('user_challenges').update({ archived: !run.archived }).eq('id', run.id);
    if (error) return toast(error.message, 'err');
    run.archived = !run.archived;
    toast(run.archived ? 'Archived.' : 'Back in progress.', 'ok');
    document.getElementById('archive').textContent = run.archived ? 'Unarchive' : 'Archive';
  });
  document.getElementById('remove').addEventListener('click', () => {
    confirmRemove(run.id, run.title, () => { location.href = 'challenges.html'; });
  });
}

view();
</script>
</body>
</html>
