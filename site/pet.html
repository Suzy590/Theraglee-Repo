<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desktop pet — Theraglee</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .pet-art{display:flex;justify-content:center;margin-bottom:2px}
  .pet-art img{width:186px;height:auto;animation:pet-bob 3.4s ease-in-out infinite}
  @keyframes pet-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){.pet-art img{animation:none}}
  .pet-lede{max-width:60ch;margin-left:auto;margin-right:auto}
  .dl{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:22px}
  .dl .card{padding:22px;display:flex;flex-direction:column;gap:10px;text-align:left}
  .dl .card.here{border-color:var(--lime-2);box-shadow:var(--shadow-2)}
  .dl h3{margin:0;font-size:1.02rem}
  .dl .meta{font-size:.84rem;color:var(--faint)}
  .steps{counter-reset:s;list-style:none;padding:0;margin:10px 0 0;text-align:left}
  .steps li{counter-increment:s;position:relative;padding-left:30px;margin:9px 0;font-size:.93rem;
    color:var(--muted)}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:20px;height:20px;
    border-radius:50%;background:var(--soft);color:var(--green-deep);font-size:.75rem;font-weight:600;
    display:flex;align-items:center;justify-content:center}
  .doing{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:18px}
  .doing .card{padding:18px}
  .doing h3{font-size:.98rem;margin:0 0 6px}
  .doing p{margin:0;font-size:.93rem}
</style>
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:240px"></div>
</div></main>

<script type="module">
import { chrome } from './assets/app.js';
const a = await chrome({ active:'dashboard.html' });
const root = document.getElementById('root');

/* Pip, drawn by the same code that draws him in the app. */
const ART = `<div class="pet-art"><img src="assets/pip.png" width="261" height="222"
  alt="Pip, a small round green cat with closed happy eyes and a curled tail"></div>`;

const MAC = { file:'downloads/Pip-mac.zip', size:'568 KB', needs:'macOS 12 or later' };
const WIN = { file:'downloads/Pip-windows.zip', size:'8.9 MB', needs:'Windows 10 or 11, 64-bit' };

const onMac = /Mac|iPhone|iPad/.test(navigator.platform || '') ||
              /Mac OS X/.test(navigator.userAgent || '');

const downloads = () => {
  const mac = `<div class="card ${onMac?'here':''}">
      <h3>For Mac</h3>
      <span class="meta">${MAC.needs} · ${MAC.size}</span>
      <a class="btn ${onMac?'':'ghost'}" href="${MAC.file}" download>Download for Mac</a>
      <ol class="steps">
        <li>Open the downloaded file, then drag <strong>Pip</strong> to your Applications folder.</li>
        <li>Double-click Pip. The first time, macOS says it cannot check the app — that is
            normal for small apps like this one, not a sign of a problem.</li>
        <li>Open <strong>System Settings → Privacy &amp; Security</strong>, scroll down, and
            click <strong>Open Anyway</strong>. You only do this once.</li>
      </ol>
    </div>`;
  const win = `<div class="card ${onMac?'':'here'}">
      <h3>For Windows</h3>
      <span class="meta">${WIN.needs} · ${WIN.size}</span>
      <a class="btn ${onMac?'ghost':''}" href="${WIN.file}" download>Download for Windows</a>
      <ol class="steps">
        <li>Open the downloaded file and drag <strong>Pip</strong> somewhere you will find it
            again — your Desktop is fine.</li>
        <li>Double-click Pip. Windows shows a blue "Windows protected your PC" box the first
            time, because the app is small and new rather than because anything is wrong.</li>
        <li>Click <strong>More info</strong>, then <strong>Run anyway</strong>. You only do
            this once.</li>
      </ol>
    </div>`;
  return `<div class="dl">${onMac ? mac + win : win + mac}</div>`;
};

const ABOUT = `
  <h2 style="margin:40px 0 4px">What Pip does</h2>
  <p class="muted" style="margin-top:0">A companion, not another thing to keep up with.</p>
  <div class="doing">
    <div class="card"><h3>Lives at the edge of your screen</h3>
      <p class="muted">Pip wanders along the bottom of your desktop, sits, dozes off, and
        watches your cursor while you work. No notifications, no streaks to keep alive.</p></div>
    <div class="card"><h3>Cat or dog, four colors</h3>
      <p class="muted">Right-click Pip to switch between a cat and a dog and to pick a color.
        Your choice is remembered.</p></div>
    <div class="card"><h3>Play with it</h3>
      <p class="muted">Click to pet it. Drag it around and let go. Double-click for zoomies —
        a sprint, a somersault and a silent "Theragleeeeee!!!"</p></div>
    <div class="card"><h3>Self-care nudges</h3>
      <p class="muted">Switch on self-care mode and every 25 minutes or so Pip holds up a small
        sign: drink water, or stretch. Off by default.</p></div>
    <div class="card"><h3>Quiet by design</h3>
      <p class="muted">Never steals focus from what you are typing, makes no sound at all,
        and sits out of the way in the corner.</p></div>
    <div class="card"><h3>Stays on your computer</h3>
      <p class="muted">Pip has no internet access. It does not read your journal, your quizzes,
        or anything else in your account.</p></div>
  </div>`;

const memberView = () => `
  ${ART}
  <div class="center">
    <span class="badge live">Included with your membership</span>
    <h1 style="margin:14px 0 10px">Meet Pip, your desktop pet</h1>
    <p class="muted pet-lede">A small companion for the corner of your screen, for the days when a
      little company helps. Yours to download and keep.</p>
  </div>
  ${downloads()}
  ${ABOUT}`;

const upgradeView = () => `
  ${ART}
  <div class="center">
    <span class="badge lock">Basic membership</span>
    <h1 style="margin:14px 0 10px">Pip comes with Basic</h1>
    <p class="muted pet-lede">A small companion for the corner of your screen, for the days when a
      little company helps. Pip is included with <strong>Basic</strong> and with
      <strong>Premium</strong>, for Mac and for Windows.</p>
  </div>
  <div class="card pad-lg center" style="margin-top:26px">
    <h2 style="margin:0 0 10px">Upgrade to bring Pip home</h2>
    <p class="muted pet-lede">Upgrade any time, and cancel just as easily. You get Pip along with
      the 62 quizzes, 16 worksheets and year-long challenges in Basic.</p>
    <div class="row" style="justify-content:center;margin-top:16px">
      <a class="btn lg" href="pricing.html">See membership options</a>
      <a class="btn ghost" href="dashboard.html">Back to Today</a>
    </div>
  </div>
  ${ABOUT}`;

root.innerHTML = a.level >= 2 ? memberView() : upgradeView();
</script>
</body>
</html>
