<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<title>Journal — Theraglee</title>
<style>
  .entry{border-left:3px solid var(--mist);padding:4px 0 4px 16px;margin-bottom:20px}
  .entry h4{margin:0 0 2px;font-size:1rem;font-weight:500}
  .entry .when{font-size:.8rem;color:var(--faint)}
  .entry p{margin:6px 0 0;color:var(--ink-2);white-space:pre-wrap}
  .prompt-box{background:var(--soft);border:1px solid var(--mist);border-radius:var(--r-sm);
    padding:14px 16px;font-family:var(--serif);font-style:italic;font-size:1.08rem;color:var(--green-deep)}
</style>
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:220px"></div>
</div></main>

<script type="module">
import { chrome, sb, requireAuth, esc, qs, toast, busy, fmtDate } from './assets/app.js';
await chrome({ active:'journal.html' });
const a = await requireAuth();
if (a) {
const root = document.getElementById('root');
const promptId = qs('prompt');

let prompt = null;
if (promptId) {
  const { data } = await sb.from('daily_content').select('*').eq('id', promptId).maybeSingle();
  prompt = data;
}
if (!prompt) {
  const { data } = await sb.rpc('daily_pick', { p_kind: 'journal_prompt' });
  prompt = data?.[0] || null;
}

async function entries(){
  const { data } = await sb.from('journal_entries').select('*')
    .eq('user_id', a.profile.id).order('created_at', { ascending:false }).limit(50);
  return data || [];
}

function paint(list){
  root.innerHTML = `
    <div class="grid" style="grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:34px;align-items:start">
      <div>
        <h1>Journal</h1>
        <p class="muted">Private to your account. Nobody else can read it — not therapists, not us.</p>
        ${prompt ? `<div class="prompt-box" id="pbox">${esc(prompt.body)}</div>
          <div class="row" style="margin:10px 0 18px">
            <button class="btn sm ghost" id="newprompt">Give me another prompt</button>
            <button class="btn sm ghost" id="freewrite">Write freely instead</button></div>` : ''}
        <div class="field"><label for="title">Title <span class="faint">(optional)</span></label>
          <input id="title" type="text" placeholder="A word for today"></div>
        <div class="field"><label for="body">Your entry</label>
          <textarea id="body" style="min-height:230px" placeholder="Whatever is on your mind…"></textarea></div>
        <div class="row"><button class="btn" id="save">Save entry</button>
          <span class="faint" id="status"></span></div>
      </div>
      <div>
        <h2 style="font-size:1.2rem">Earlier entries</h2>
        <div id="list">${list.length ? list.map(e=>`
          <div class="entry">
            <h4>${esc(e.title || 'Untitled')}</h4>
            <div class="when">${fmtDate(e.created_at)}</div>
            ${e.prompt_text ? `<div class="faint" style="font-style:italic;margin-top:4px">${esc(e.prompt_text)}</div>` : ''}
            <p>${esc(String(e.body).slice(0,300))}${e.body.length>300?'…':''}</p>
          </div>`).join('') : '<div class="empty">Nothing yet. Your first entry will show up here.</div>'}
        </div>
      </div>
    </div>
    <style>@media(max-width:860px){#root .grid{grid-template-columns:1fr!important}}</style>`;

  document.getElementById('save').addEventListener('click', async (e) => {
    const body = document.getElementById('body').value.trim();
    if (!body) return toast('Write something first.','err');
    busy(e.target, true, 'Saving…');
    const { error } = await sb.from('journal_entries').insert({
      user_id: a.profile.id,
      prompt_id: prompt?.id ?? null,
      prompt_text: prompt?.body ?? null,
      title: document.getElementById('title').value.trim() || null,
      body,
    });
    busy(e.target, false);
    if (error) return toast(error.message,'err');
    sb.from('activity_log').insert({ user_id:a.profile.id, item_type:'journal', action:'complete',
      tags: prompt?.tags || [] });
    toast('Saved.','ok');
    paint(await entries());
  });

  document.getElementById('newprompt')?.addEventListener('click', async () => {
    const { data } = await sb.rpc('daily_pick', { p_kind:'journal_prompt', p_seed: Math.floor(Math.random()*9999) });
    if (data?.[0]) { prompt = data[0]; document.getElementById('pbox').textContent = prompt.body; }
  });
  document.getElementById('freewrite')?.addEventListener('click', () => {
    prompt = null; paint(list);
  });
}

paint(await entries());
}
</script>
</body>
</html>
