<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<title>Journal — Theraglee</title>
<style>
  .entry{border-left:3px solid var(--mist);padding:4px 0 4px 16px;margin-bottom:20px}
  .entry h4{margin:0 0 2px;font-size:1rem;font-weight:500}
  .entry .when{font-size:.8rem;color:var(--faint)}
  .entry p{margin:6px 0 0;color:var(--ink-2);white-space:pre-wrap}
  .prompt-box{background:var(--soft);border:1px solid var(--mist);border-radius:var(--r-sm);
    padding:14px 16px;font-family:var(--serif);font-style:italic;font-size:1.08rem;color:var(--green-deep)}
  .entry mark{background:rgba(141,198,29,.28);color:inherit;border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:220px"></div>
</div></main>

<script type="module">
import { chrome, sb, requireAuth, esc, qs, toast, busy, fmtDate } from './assets/app.js';
await chrome({ active:'journal.html' });
const a = await requireAuth();
if (a) {
const root = document.getElementById('root');
const promptId = qs('prompt');

let prompt = null;
if (promptId) {
  const { data } = await sb.from('daily_content').select('*').eq('id', promptId).maybeSingle();
  prompt = data;
}
if (!prompt) {
  const { data } = await sb.rpc('daily_pick', { p_kind: 'journal_prompt' });
  prompt = data?.[0] || null;
}
let lastPrompt = prompt;

async function entries(){
  const { data } = await sb.from('journal_entries').select('*')
    .eq('user_id', a.profile.id).order('created_at', { ascending:false }).limit(50);
  return data || [];
}

// The search words, lowercased. Characters that mean something to the
// database's pattern matching (% _ \ " , ( ) *) are treated as spaces.
function words(q){
  return q.toLowerCase().replace(/[%_\\",()*]/g, ' ').split(/\s+/).filter(Boolean).slice(0, 8);
}

// Searches every entry the member has written, not just the 50 shown by
// default. Each word has to appear in the title, the entry or its prompt.
async function search(q){
  let req = sb.from('journal_entries').select('*').eq('user_id', a.profile.id);
  for (const w of words(q)) req = req.or(['title','body','prompt_text'].map(c => `${c}.ilike."%${w}%"`).join(','));
  const { data, error } = await req.order('created_at', { ascending:false }).limit(100);
  if (error) { toast(error.message,'err'); return []; }
  return data || [];
}

// Escapes text and wraps each search word in <mark>. Matching runs on the
// raw text, so a word like "amp" never lands inside an escaped "&amp;".
function hl(text, ws){
  text = String(text);
  if (!ws.length) return esc(text);
  const re = new RegExp('(' + ws.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return text.split(re).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join('');
}

// Up to 300 characters of the entry, starting near the first match.
function snippet(body, ws){
  body = String(body);
  const lower = body.toLowerCase();
  const at = ws.map(w => lower.indexOf(w)).filter(i => i >= 0).sort((x,y) => x-y)[0] ?? 0;
  const start = at > 120 ? body.lastIndexOf(' ', at - 60) + 1 : 0;
  const cut = body.slice(start, start + 300);
  return (start ? '…' : '') + hl(cut, ws) + (start + 300 < body.length ? '…' : '');
}

function entryHtml(e, ws){
  return `
          <div class="entry">
            <h4>${hl(e.title || 'Untitled', ws)}</h4>
            <div class="when">${fmtDate(e.created_at)}</div>
            ${e.prompt_text ? `<div class="faint" style="font-style:italic;margin-top:4px">${hl(e.prompt_text, ws)}</div>` : ''}
            <p>${snippet(e.body, ws)}</p>
          </div>`;
}

function paint(list){
  root.innerHTML = `
    <div class="grid" style="grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:34px;align-items:start">
      <div>
        <h1>Journal</h1>
        <p class="muted">Private to your account. Nobody else can read it — not therapists, not us.</p>
        ${prompt ? `<div class="prompt-box" id="pbox">${esc(prompt.body)}</div>
          <div class="row" style="margin:10px 0 18px">
            <button class="btn sm ghost" id="newprompt">Give me another prompt</button>
            <button class="btn sm ghost" id="freewrite">Write freely instead</button></div>`
          : lastPrompt ? `<div class="row" style="margin:10px 0 18px">
            <button class="btn sm ghost" id="useprompt">Back to the prompt</button></div>` : ''}
        <div class="field"><label for="title">Title <span class="faint">(optional)</span></label>
          <input id="title" type="text" placeholder="A word for today"></div>
        <div class="field"><label for="body">Your entry</label>
          <textarea id="body" style="min-height:230px" placeholder="Whatever is on your mind…"></textarea></div>
        <div class="row"><button class="btn" id="save">Save entry</button>
          <span class="faint" id="status"></span></div>
      </div>
      <div>
        <h2 style="font-size:1.2rem">Earlier entries</h2>
        <div class="field" style="margin-top:14px">
          <label for="q">Search your entries</label>
          <input id="q" type="search" placeholder="Try a word like “sleep” or “mom”…" autocomplete="off">
        </div>
        <p class="faint" id="count" aria-live="polite"></p>
        <div id="list"></div>
      </div>
    </div>
    <style>@media(max-width:860px){#root .grid{grid-template-columns:1fr!important}}</style>`;

  const listEl = document.getElementById('list'), count = document.getElementById('count'), q = document.getElementById('q');
  let timer = null, seq = 0;
  async function paintList(){
    const ws = words(q.value);
    if (!ws.length) {
      count.textContent = '';
      listEl.innerHTML = list.length ? list.map(e => entryHtml(e, [])).join('')
        : '<div class="empty">Nothing yet. Your first entry will show up here.</div>';
      return;
    }
    const mine = ++seq;
    count.textContent = 'Searching…';
    const hits = await search(q.value);
    if (mine !== seq) return; // a newer search has started
    count.textContent = hits.length === 100 ? 'Showing the 100 most recent matches.'
      : `${hits.length} ${hits.length === 1 ? 'entry matches' : 'entries match'}.`;
    listEl.innerHTML = hits.length ? hits.map(e => entryHtml(e, ws)).join('')
      : `<div class="empty">No entries match “${esc(q.value.trim())}”. Try a different word, or clear the search to see your recent entries.</div>`;
  }
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(paintList, 250); });
  paintList();

  document.getElementById('save').addEventListener('click', async (e) => {
    const body = document.getElementById('body').value.trim();
    if (!body) return toast('Write something first.','err');
    busy(e.target, true, 'Saving…');
    const { error } = await sb.from('journal_entries').insert({
      user_id: a.profile.id,
      prompt_id: prompt?.id ?? null,
      prompt_text: prompt?.body ?? null,
      title: document.getElementById('title').value.trim() || null,
      body,
    });
    busy(e.target, false);
    if (error) return toast(error.message,'err');
    sb.from('activity_log').insert({ user_id:a.profile.id, item_type:'journal', action:'complete',
      tags: prompt?.tags || [] });
    toast('Saved.','ok');
    paint(await entries());
  });

  document.getElementById('newprompt')?.addEventListener('click', async () => {
    const { data } = await sb.rpc('daily_pick', { p_kind:'journal_prompt', p_seed: Math.floor(Math.random()*9999) });
    if (data?.[0]) { prompt = data[0]; lastPrompt = prompt; document.getElementById('pbox').textContent = prompt.body; }
  });
  document.getElementById('freewrite')?.addEventListener('click', () => {
    lastPrompt = prompt; prompt = null; paint(list);
  });
  document.getElementById('useprompt')?.addEventListener('click', () => {
    prompt = lastPrompt; paint(list);
  });
}

paint(await entries());
}
</script>
</body>
</html>
