<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice dashboard — Theraglee</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--hair);margin:24px 0 28px;overflow-x:auto}
  .tabs button{border:0;background:none;font:inherit;font-size:.95rem;padding:12px 16px;cursor:pointer;
    color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;position:relative}
  .tabs button.on{color:var(--green);border-bottom-color:var(--green);font-weight:500}
  .tabs .dot{display:inline-block;min-width:18px;padding:0 5px;height:18px;line-height:18px;
    border-radius:9px;background:var(--green);color:#fff;font-size:.7rem;margin-left:6px;
    text-align:center;font-weight:600}
  .stats{display:grid;gap:1px;background:var(--hair);border:1px solid var(--hair);
    border-radius:var(--r);overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .stat{background:var(--paper);padding:18px}
  .stat .n{font-size:2rem;font-weight:300;letter-spacing:-.03em;line-height:1;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .stat .l{font-size:.84rem;color:var(--muted);margin-top:6px}
  .stat .d{font-size:.76rem;margin-top:6px;font-weight:500}
  .up{color:var(--green)} .down{color:var(--warn)} .flat{color:var(--faint)}
  .chart{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:12px}
  .chart div{flex:1;min-height:2px;background:var(--mist);border-radius:3px 3px 0 0;position:relative}
  .chart div.has{background:var(--lime)}
  .msg{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r);
    padding:20px;margin-bottom:12px}
  .msg.unread{border-color:var(--lime-2);background:linear-gradient(180deg,var(--soft),var(--paper) 40%)}
  .msg .who{font-family:var(--sans);font-weight:600}
  .res{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r);padding:20px;
    display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .3s,box-shadow .3s}
  .res:hover{transform:translateY(-4px);box-shadow:var(--shadow-2)}
  .soon{opacity:.62}
  .photo-pick{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .photo-preview{flex:0 0 96px;width:96px;height:96px;border-radius:24px;background:var(--soft);
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:1.3rem;
    color:var(--green-deep);overflow:hidden}
  .photo-preview img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-pick input[type=file]{font:inherit;font-size:.92rem;max-width:100%}
  .office-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:0 0 10px}
  .office-grid:empty{display:none}
  .office-thumb{position:relative;aspect-ratio:4/3;border-radius:var(--r-sm);overflow:hidden;background:var(--soft)}
  .office-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .office-thumb button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
    border:0;padding:0;background:rgba(0,0,0,.55);color:#fff;font-size:1.05rem;line-height:26px;cursor:pointer}
  .office-thumb button:hover{background:rgba(0,0,0,.75)}
  .field input[type=file]{font:inherit;font-size:.92rem;max-width:100%}
  /* Specialties: a selected chip shows a star; a starred chip is a top-three pick. */
  #spec .chip .star{display:none;margin-left:7px;opacity:.55}
  #spec .chip.on .star{display:inline}
  #spec .chip.on.top .star{opacity:1;color:#FFD54A}
</style>
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:220px"></div>
</div></main>

<script type="module">
import { chrome, sb, requireAuth, access, clearAccess, esc, toast, busy, fmtDate,
         modal, openPortal, startCheckout, startIdentity, connectAction, callStripeFn,
         FN, qs } from './assets/app.js';
import { matchSummary } from './assets/match.js';
import { foundingOffer } from './assets/plans.js';
import { SPECIALTIES, MODALITIES, INSURANCES, AGE_RANGES, PARTICIPANTS,
         LANGUAGES, CREDENTIALS, STATES, PAYMENT_METHODS } from './assets/lists.js';
await chrome();
let a = await requireAuth({ audience: 'therapist' });
if (a) {
const root = document.getElementById('root');

// Therapist membership is separate from the member tiers, so a member account
// cannot use this dashboard. The administrator can open both.
if (a.profile.role !== 'therapist' && a.profile.role !== 'admin') {
  root.innerHTML = `<div class="card pad-lg center">
    <h2>This is a member account</h2>
    <p class="muted" style="max-width:52ch;margin-inline:auto">The practice dashboard is for
      therapist accounts, which are a separate membership with their own sign-in page. Sign out
      and create a therapist account, or head back to your own dashboard.</p>
    <div class="row" style="justify-content:center">
      <a class="btn" href="therapist-signup.html">Create a therapist account</a>
      <a class="btn ghost" href="dashboard.html">Back to my dashboard</a></div>
    <p class="faint" style="margin:16px 0 0"><a href="for-therapists.html">How therapist membership works</a></p></div>`;
} else {

let T = a.therapist || null;
let tab = location.hash.replace('#','') || (T ? 'home' : 'profile');

// Arrived from the founding-member sign-up: open the Membership tab with the
// founding option pointed out. The sign-up page passes ?plan=founding, and
// also leaves a note in localStorage for the email-confirmation route, which
// lands here without any address parameters.
let wantFounding = qs('plan') === 'founding';
try {
  if (localStorage.getItem('theraglee_plan') === 'founding') wantFounding = true;
  localStorage.removeItem('theraglee_plan');
} catch {}
if (wantFounding) { tab = 'membership'; history.replaceState({}, '', 'therapist-dashboard.html#membership'); }
let unread = 0;
let unreadReplies = 0;

// Back from Stripe (membership checkout, the ID check, or payouts setup):
// bring what we know up to date before drawing anything.
if (qs('checkout') || qs('identity') || qs('connect')) {
  if (qs('checkout') === 'success') {
    toast('Payment received — welcome aboard. It can take a moment to appear.', 'ok');
    await new Promise(r => setTimeout(r, 2500));
  }
  if (qs('identity')) await callStripeFn('stripe-identity', { action: 'status' });
  if (qs('connect') === 'return') await callStripeFn('stripe-connect', { action: 'status' });
  if (qs('connect') === 'refresh') {
    // The onboarding link expired or was reused; Stripe asks us to make a new one.
    const out = await callStripeFn('stripe-connect', { action: 'onboard' });
    if (out.url) location.href = out.url;
  }
  clearAccess(); a = await access(true); T = a.therapist || T;
  tab = 'membership';
  history.replaceState({}, '', 'therapist-dashboard.html#membership');
}

const paid = ['active','trialing'].includes(a.profile.subscription_status);
const liveListing = T?.verification === 'verified' && T?.published;

/* ------------------------------------------------------------ shell */
const TABS = [
  ['home','Home'],
  ['referrals','Referrals'], ['messages','Messages'], ['members','Member requests'],
  ['library','Resource library'], ['profile','My profile'], ['membership','Membership'],
];

function shell(body){
  const status = !T ? 'No listing yet'
    : T.verification === 'verified' ? (T.published ? 'Live in the directory' : 'Verified — not published')
    : T.verification === 'rejected' ? 'License not verified' : 'Verification pending';
  const first = (T?.first_name || (a.profile.full_name || '').split(' ')[0] || '').trim();
  return `
    <div class="spread">
      <div>
        <p class="faint" style="margin:0 0 4px">${esc(new Date().toLocaleDateString(undefined,
          { weekday:'long', month:'long', day:'numeric' }))}</p>
        <h1 style="margin:0">${first ? 'Hello, ' + esc(first) : 'Practice dashboard'}</h1>
        <p class="faint" style="margin:4px 0 0">${esc(a.profile.email||'')}${
          a.profile.role === 'admin' ? ' · administrator, viewing the practice dashboard' : ''}</p></div>
      <div class="row">
        <span class="badge ${paid?'':'gray'}">Therapist membership · ${paid ? 'Active' : 'Not started'}</span>
        <span class="badge ${T?.verification==='verified'?'':'gray'}">${status}</span>
      </div>
    </div>
    <div class="tabs">${TABS.map(([k,l])=>
      `<button data-tab="${k}" class="${tab===k?'on':''}">${l}${
        k==='messages' && unread ? `<span class="dot">${unread}</span>`
        : k==='members' && unreadReplies ? `<span class="dot">${unreadReplies}</span>` : ''}</button>`).join('')}</div>
    <div id="body">${body}</div>`;
}

function render(body){
  root.innerHTML = shell(body);
  root.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    tab = b.dataset.tab; history.replaceState({},'','#'+tab); route();
  });
}

function needsListing(){
  render(`<div class="card pad-lg center">
    <h2>Build your profile first</h2>
    <p class="muted">Once your listing exists we can verify your license and start
      counting the referrals it brings in.</p>
    <button class="btn lg" id="go">Start my profile</button></div>`);
  document.getElementById('go').onclick = () => { tab='profile'; route(); };
}

/* ------------------------------------------------------------- home */
// The therapist's own front page: where the listing stands, what Theraglee
// brought in this month, what is waiting, and everything the membership includes.
async function home(){
  if (!T) return needsListing();
  render('<div class="skeleton" style="height:200px"></div>');
  const [{ data: stats }, { data: msgs }, { data: reqs }, { data: cat }, { data: cfgRows }, { count: nReplies }] = await Promise.all([
    sb.rpc('therapist_stats', { p_days: 30 }),
    sb.from('therapist_messages').select('id,sender_name,created_at,read_at')
      .eq('therapist_id', T.id).order('created_at', { ascending:false }).limit(3),
    sb.from('member_discovery').select('id,already_contacted').limit(200),
    sb.from('therapist_resource_catalog').select('*'),
    sb.from('app_config').select('key,value').in('key', ['identity_required','connect_enabled']),
    sb.from('outreach_replies').select('id', { count:'exact', head:true })
      .eq('therapist_id', T.id).is('read_at', null),
  ]);
  const cfg = Object.fromEntries((cfgRows||[]).map(r=>[r.key,r.value]));
  const c = stats?.current || {};
  unread = stats?.unread_messages || 0;
  unreadReplies = nReplies || 0;
  const waiting = (reqs||[]).filter(r => !r.already_contacted).length;
  const libTotal = (cat||[]).reduce((s,r)=>s+r.total, 0);
  const verified = T.verification === 'verified';
  const idOk = T.identity_status === 'verified';
  const needsId = cfg.identity_required === 'true' && !idOk;

  // The one thing to do next, in order: license, membership, identity, publish.
  const nextStep = liveListing
    ? { text: 'Your profile is live in the directory.', cta: T.slug
        ? `<a class="btn sm ghost" href="therapist.html?slug=${esc(T.slug)}">View my public profile</a>` : '' }
    : T.verification === 'rejected'
    ? { text: 'We could not confirm that license as current and in good standing. Check the details and resubmit.',
        cta: '<a class="btn sm" href="#profile">Fix my license details</a>' }
    : !verified
    ? { text: 'We are checking your license with the state board. You will get an email either way.',
        cta: '<a class="btn sm ghost" href="#membership">See the check</a>' }
    : !paid
    ? { text: 'Your license is verified. Start your membership to publish the listing and open the library.',
        cta: '<a class="btn sm" href="#membership">Start membership</a>' }
    : needsId
    ? { text: 'One more step before publishing: a quick identity check through Stripe.',
        cta: '<a class="btn sm" href="#membership">Verify my identity</a>' }
    : { text: 'Everything is in place. Publish whenever you are ready.',
        cta: '<a class="btn sm" href="#profile">Publish from My profile</a>' };

  const tile = (n, label) => `<div class="stat"><div class="n">${n ?? 0}</div><div class="l">${label}</div></div>`;
  const state = (ok, yes, no) => ok ? `<span class="badge">${yes}</span>` : `<span class="badge gray">${no}</span>`;
  const benefit = (href, title, blurb, badge) => `
    <a class="tile" href="${href}">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <h3>${title}</h3>${badge}</div>
      <p class="meta" style="color:var(--muted)">${blurb}</p></a>`;

  render(`
    <div class="card pad-lg" style="margin-bottom:22px">
      <div class="spread">
        <div>
          <span class="badge ${liveListing?'':'gray'}">${liveListing ? 'Live in the directory' : 'Not live yet'}</span>
          <h2 style="margin:12px 0 6px">Your listing</h2>
          <p class="muted" style="margin:0;max-width:60ch">${nextStep.text}</p>
        </div>
        <div class="row">${nextStep.cta}<a class="btn sm ghost" href="#profile">Edit my profile</a></div>
      </div>
    </div>

    <div class="spread" style="margin-bottom:14px">
      <h2 style="margin:0">Last 30 days from Theraglee</h2>
      <a class="btn sm ghost" href="#referrals">All referral stats</a>
    </div>
    <div class="stats">
      ${tile(c.profile_views, 'Profile views')}
      ${tile(c.call_taps, 'Phone calls')}
      ${tile(c.messages, 'Messages')}
      ${tile(c.website_clicks, 'Website clicks')}
      ${tile(c.shares, 'Profile shares')}
    </div>
    ${!liveListing ? `<p class="faint" style="margin-top:10px">Referrals are counted once your
      profile is live.</p>` : ''}

    <div class="grid g2" style="margin-top:26px">
      <div class="card">
        <div class="spread"><h3 style="margin:0">Messages</h3>
          ${unread ? `<span class="badge">${unread} unread</span>` : '<span class="badge gray">Nothing new</span>'}</div>
        ${(msgs||[]).length ? `<div class="stack" style="margin-top:12px">${msgs.map(m=>`
          <div class="row" style="justify-content:space-between">
            <span style="font-weight:${m.read_at?'400':'600'}">${esc(m.sender_name)}</span>
            <span class="faint">${fmtDate(m.created_at)}</span></div>`).join('')}</div>`
          : '<p class="muted" style="margin:10px 0 0">People who write to you through your profile show up here. Your email address is never shown to them.</p>'}
        <a class="btn sm ghost" style="margin-top:14px" href="#messages">Open messages</a>
      </div>
      <div class="card">
        <div class="spread"><h3 style="margin:0">Member requests</h3>
          ${waiting ? `<span class="badge">${waiting} waiting</span>` : '<span class="badge gray">None waiting</span>'}</div>
        <p class="muted" style="margin:10px 0 0">Members who switched on <strong>Theraglee Match
          Mode</strong> want a therapist to reach out. You see a short pseudonymous profile for
          each one, and can send them a message. A member who replies gives you their real
          name.${liveListing ? '' : ' Reaching out needs a live listing.'}</p>
        ${unreadReplies ? `<p class="muted" style="margin:8px 0 0"><strong>${unreadReplies} new
          ${unreadReplies===1?'reply':'replies'}</strong> from members waiting for you.</p>` : ''}
        <a class="btn sm ghost" style="margin-top:14px" href="#members">See who is waiting</a>
      </div>
    </div>

    <h2 style="margin-top:34px">What your membership includes</h2>
    <p class="muted">One flat therapist membership. Nothing here is tiered, and nothing from the
      member plans is mixed in.</p>
    <div class="grid g3">
      ${benefit('#profile', 'A verified, searchable listing',
        'Specialties, insurances, languages, locations, fees and telehealth, found by zip and more.',
        state(verified, 'License verified', T.verification === 'rejected' ? 'Not verified' : 'Verification pending'))}
      ${benefit('#profile', 'A Theraglee phone number',
        'Callers reach you through a tracking number, so your own line stays private and every call is counted.',
        state(!!T.tracking_phone, 'Assigned', 'Assigned when you go live'))}
      ${benefit('#messages', 'Messages without your address',
        'People write to you through Theraglee. You reply from your own inbox; they never see it.',
        state(true, 'Included', ''))}
      ${benefit('#referrals', 'Referral stats',
        'Calls, messages, website clicks, shares and profile views, with the previous period alongside.',
        state(true, 'Included', ''))}
      ${benefit('#members', 'Theraglee Match Mode',
        'Reach out to members who asked to be contacted, instead of waiting to be found. They stay pseudonymous until they reply.',
        state(liveListing, 'Ready', 'Needs a live listing'))}
      ${benefit('#library', 'Clinician library',
        `${libTotal || 'Dozens of'} worksheets and CBT, ACT, DBT, couples, kids and game exercises, printable with guidance.`,
        state(paid && verified, 'Open', 'Opens with membership'))}
      ${benefit('#membership', 'Identity check',
        'A government ID and a selfie through Stripe Identity, so the person on the profile holds the license.',
        state(idOk, 'Verified', cfg.identity_required === 'true' ? 'Required to publish' : 'Optional'))}
      ${cfg.connect_enabled === 'true' ? benefit('#membership', 'Get paid through Theraglee',
        'Clients can pay for a session from your profile. Stripe pays out to your own bank account.',
        state(T.stripe_account_status === 'enabled', 'Ready for payouts', 'Set up in Membership')) : ''}
    </div>`);
}

/* -------------------------------------------------------- referrals */
async function referrals(){
  if (!T) return needsListing();
  render('<div class="skeleton" style="height:160px"></div>');
  const days = Number(sessionStorage.getItem('tg-range') || 30);
  const { data, error } = await sb.rpc('therapist_stats', { p_days: days });
  if (error || data?.error) {
    return render(`<div class="notice err">${esc(error?.message || 'No listing found.')}</div>`);
  }
  unread = data.unread_messages || 0;

  const c = data.current, p = data.previous;
  const delta = (now, before) => {
    if (!before) return now ? `<span class="d up">new</span>` : `<span class="d flat">—</span>`;
    const pct = Math.round((now - before) / before * 100);
    if (pct === 0) return `<span class="d flat">no change</span>`;
    return `<span class="d ${pct>0?'up':'down'}">${pct>0?'+':''}${pct}% vs previous</span>`;
  };
  const card = (n, label, before) =>
    `<div class="stat"><div class="n">${n}</div><div class="l">${label}</div>${delta(n, before)}</div>`;

  const series = data.series || [];
  const peak = Math.max(1, ...series.map(d => d.views + d.calls + d.messages));

  render(`
    <div class="spread" style="margin-bottom:18px">
      <h2 style="margin:0">Referrals from Theraglee</h2>
      <div class="chips" id="range">
        ${[7,30,90,365].map(d=>`<button class="chip ${d===days?'on':''}" data-d="${d}">
          ${d===365?'12 months':d+' days'}</button>`).join('')}
      </div>
    </div>

    <div class="stats">
      ${card(c.profile_views, 'Profile views', p.profile_views)}
      ${card(c.call_taps, 'Phone calls', p.call_taps)}
      ${card(c.messages, 'Messages received', p.messages)}
      ${card(c.website_clicks, 'Website clicks', p.website_clicks)}
      ${card(c.shares, 'Profile shares', p.shares)}
    </div>

    <h3 style="margin-top:34px">Day by day</h3>
    <div class="card">
      <div class="chart">${series.map(d=>{
        const total = d.views + d.calls + d.messages;
        return `<div class="${total?'has':''}" style="height:${Math.max(2,total/peak*100)}%"
          title="${d.day}: ${d.views} views, ${d.calls} calls, ${d.messages} messages"></div>`;
      }).join('')}</div>
      <div class="spread" style="margin-top:12px">
        <span class="faint">${series.length?fmtDate(series[0].day):''}</span>
        <span class="faint">views, calls and messages combined</span>
        <span class="faint">today</span>
      </div>
    </div>

    ${!liveListing ? `<div class="notice warn" style="margin-top:22px">
      Your profile is not live yet, so there is nothing to count.
      ${T.verification!=='verified' ? 'We are verifying your license.'
        : !paid ? 'Start your membership to publish it.' : 'Publish it from My profile.'}
    </div>` : `<div class="notice" style="margin-top:22px">
      <strong>Phone calls</strong> counts people who tapped your Theraglee number.
      ${c.verified_calls ? `${c.verified_calls} connected calls were confirmed by the phone network.`
        : 'Once call forwarding is switched on, connected calls and their length appear here too.'}
    </div>`}`);

  document.querySelectorAll('#range .chip').forEach(b => b.onclick = () => {
    sessionStorage.setItem('tg-range', b.dataset.d); referrals();
  });
}

/* --------------------------------------------------------- messages */
async function messages(){
  if (!T) return needsListing();
  render('<div class="skeleton" style="height:160px"></div>');
  const { data } = await sb.from('therapist_messages').select('*')
    .eq('therapist_id', T.id).order('created_at', { ascending:false }).limit(100);
  const rows = data || [];
  unread = rows.filter(m => !m.read_at).length;

  render(`
    <h2>Messages</h2>
    <p class="muted">People who contacted you through your profile. Reply straight to their
      email address — yours is never shown to them.</p>
    ${rows.length ? rows.map(m=>`
      <div class="msg ${m.read_at?'':'unread'}" data-id="${m.id}">
        <div class="spread">
          <span class="who">${esc(m.sender_name)}</span>
          <span class="faint">${fmtDate(m.created_at)}</span>
        </div>
        <p class="faint" style="margin:4px 0 0">
          <a href="mailto:${esc(m.sender_email)}">${esc(m.sender_email)}</a>
          ${m.sender_phone?` · ${esc(m.sender_phone)}`:''}
          ${m.preferred_times?` · best times: ${esc(m.preferred_times)}`:''}</p>
        <p style="margin:12px 0 0;white-space:pre-wrap;color:var(--ink-2)">${esc(m.message)}</p>
        <div class="row" style="margin-top:14px">
          <a class="btn sm" href="mailto:${esc(m.sender_email)}?subject=${encodeURIComponent('Re: your message via Theraglee')}">Reply by email</a>
          ${m.read_at ? '' : `<button class="btn sm ghost" data-read="${m.id}">Mark as read</button>`}
          ${m.delivery === 'sent'
            ? '<span class="faint">Emailed to you</span>'
            : '<span class="faint">Shown here — email delivery not switched on yet</span>'}
        </div>
      </div>`).join('')
    : '<div class="empty" style="margin-top:18px">No messages yet.</div>'}`);

  document.querySelectorAll('[data-read]').forEach(b => b.onclick = async () => {
    await sb.from('therapist_messages')
      .update({ read_at: new Date().toISOString() }).eq('id', b.dataset.read);
    messages();
  });
}

/* ---------------------------------------------------------- members */
async function members(){
  if (!T) return needsListing();
  render('<div class="skeleton" style="height:160px"></div>');
  const [{ data, error }, { data: sent }, { data: replies }] = await Promise.all([
    sb.from('member_discovery').select('*').limit(100),
    sb.from('therapist_outreach').select('id,member_id,message,created_at')
      .eq('therapist_id', T.id).order('created_at', { ascending:true }),
    sb.from('outreach_replies').select('*')
      .eq('therapist_id', T.id).order('created_at', { ascending:true }),
  ]);
  if (error) return render(`<div class="notice err">${esc(error.message)}</div>`);
  const rows = data || [];
  unreadReplies = (replies||[]).filter(r => !r.read_at).length;

  // Conversations: everything you sent and everything a member answered, by member.
  const threads = new Map();
  for (const m of sent || []) {
    const t = threads.get(m.member_id) || { items: [], name: '', unread: 0 };
    t.items.push({ from: 'you', at: m.created_at, text: m.message });
    threads.set(m.member_id, t);
  }
  for (const r of replies || []) {
    const t = threads.get(r.member_id) || { items: [], name: '', unread: 0 };
    t.items.push({ from: 'member', at: r.created_at, text: r.message, name: r.member_name, id: r.id, read: r.read_at });
    t.name = r.member_name; if (!r.read_at) t.unread++;
    threads.set(r.member_id, t);
  }
  const convos = [...threads.entries()].filter(([, t]) => t.name)
    .map(([id, t]) => { t.items.sort((x, y) => new Date(x.at) - new Date(y.at)); return [id, t]; })
    .sort((x, y) => new Date(y[1].items.at(-1).at) - new Date(x[1].items.at(-1).at));

  const line = (m) => matchSummary(m);

  render(`

      they prefer in-person, video, or either, and the first three digits of their zip code. Never a
      name, an exact location or an email address, and never anything they have written in their

            ? esc(line(rows.find(r => r.id === mid)))

          <div class="stack" style="margin-top:12px">${t.items.map(i => `
            <div style="padding:12px 14px;border-radius:var(--r-sm);background:${i.from==='you'?'var(--sand)':'var(--soft)'}">
              <div class="spread"><span class="faint">${i.from==='you' ? 'You' : esc(i.name)}</span>

              <p style="margin:6px 0 0;white-space:pre-wrap;color:var(--ink-2)">${esc(i.text)}</p></div>`).join('')}</div>
          <div class="row" style="margin-top:14px">
            <button class="btn sm" data-followup="${esc(mid)}" data-name="${esc(t.name)}" ${liveListing?'':'disabled'}>Write back</button>
            ${t.unread ? `<button class="btn sm ghost" data-readall="${esc(mid)}">Mark as read</button>` : ''}
          </div>
        </div>`).join('')}</div>` : ''}

    <h3 style="margin-top:28px">Waiting to hear from a therapist</h3>
    ${rows.length ? `<div class="grid g3" style="margin-top:14px">${rows.map(m=>`
      <div class="card">
        <div class="spread"><strong>${esc(line(m))}</strong>
          ${m.has_replied ? '<span class="badge">Replied</span>'
            : m.already_contacted ? '<span class="badge gray">Contacted</span>' : ''}</div>
        <div class="chips" style="margin:12px 0">${
          (m.issues||[]).map(i=>`<span class="badge">${esc(i)}</span>`).join('')
          || '<span class="faint">No topics listed</span>'}</div>
        <p class="faint" style="margin:0">${m.area?'In the '+esc(m.area)+' area':'Area not shared'}

      </div>`).join('')}</div>`
    : `<div class="empty" style="margin-top:20px">No members have turned on <strong>Theraglee Match Mode</strong> yet.</div>`}`);

  const send = (memberId, intro, placeholder) => {
    const back = modal(`
      <h2><strong>Theraglee Match Mode</strong></h2>
      <p class="muted" style="font-size:.92rem">${intro}</p>
      <div class="field"><label for="om">Your message</label>

  });
}

function chipGroup(id, options, selected, max){
  return `<div class="chips" id="${id}" data-max="${max||0}">${options.map(o=>{
    const on = (selected||[]).includes(o);
    return `<button type="button" class="chip ${on?'on':''}" data-v="${esc(o)}">${esc(o)}</button>`;
  }).join('')}</div>`;
}
const chipVals = id => [...document.querySelectorAll(`#${id} .chip.on`)].map(c=>c.dataset.v);

// Specialties are one chip group that does two jobs: a chip toggles the
// specialty on and off, and the star inside a selected chip marks it as one of
// the therapist's top three, so the list is not shown twice.
function specChips(options, selected, top){
  return `<div class="chips" id="spec">${options.map(o => {
    const on = (selected||[]).includes(o), isTop = on && (top||[]).includes(o);
    return `<button type="button" class="chip ${on?'on':''} ${isTop?'top':''}" data-v="${esc(o)}">${esc(o)}<span class="star" title="Make this one of your top three">★</span></button>`;
  }).join('')}</div>`;
}
function wireSpecChips(){
  const host = document.getElementById('spec');
  host.querySelectorAll('.chip').forEach(c => c.onclick = (e) => {
    if (e.target.classList.contains('star') && c.classList.contains('on')) {
      if (!c.classList.contains('top') && host.querySelectorAll('.chip.top').length >= 3)
        return toast('Choose up to three top specialties.','err');
      c.classList.toggle('top');
      return;
    }
    c.classList.toggle('on');
    if (!c.classList.contains('on')) c.classList.remove('top');
  });
}
// The write-ins for a list: whatever is saved that is not on it, up to three.
const writeIns = (sel, list) => {
  const c = (sel||[]).filter(s => !list.includes(s));
  return [c[0]||'', c[1]||'', c[2]||''];
};
function wireChips(id){
  const host = document.getElementById(id);
  const max = Number(host.dataset.max || 0);
  host.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    if (!c.classList.contains('on') && max && chipVals(id).length >= max)
      return toast(`Choose up to ${max}.`,'err');
    c.classList.toggle('on');
  });
}

// re-rendered on every visit, so a pick that was never saved is dropped.
let photoFile = null;      // the shrunk JPEG to upload
let photoRemoved = false;  // the therapist asked to take their photo down
const PHOTO_BUCKET = 'therapist-photos';
const photoPath = () => `${a.profile.id}/photo.jpg`;

// Office pictures (optional, up to OFFICE_MAX): the saved ones the therapist is
// keeping, the new ones waiting to upload, and the removed ones whose files go
// after the save. They live next to the profile photo, in <user id>/office/.
const OFFICE_MAX = 6;
let officeKeep = [];   // public URLs already on the profile, still wanted
let officeAdd = [];    // { blob, url } — shrunk JPEG and its preview
let officeDrop = [];   // public URLs removed this visit

// The bucket path inside one of our public URLs, for deleting the file.
const storagePathOf = (url) => (String(url).split(`/${PHOTO_BUCKET}/`)[1] || '').split('?')[0];

// Shrinks a chosen picture to at most 800px on its long side and re-encodes it
// as a JPEG, so a 6 MB phone photo lands in storage at roughly 100 KB with its
// EXIF (location, device) left behind. Returns null if the browser cannot
// decode the file.
async function shrinkPhoto(file, max = 800){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => {
      const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url;
    });
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    return await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.86));
  } catch { return null; }
  finally { URL.revokeObjectURL(url); }
}

      <h2>Education</h2>
      <div class="field"><label for="edu-school">School most recently graduated</label>
        <input id="edu-school" maxlength="100" value="${esc(t.education_school||'')}" placeholder="e.g. CSU Northridge">
        <div class="help">100 characters max.</div></div>
      <div class="grid g2">
        <div class="field"><label for="edu-degree">Degree/Diploma</label>
          <input id="edu-degree" maxlength="100" value="${esc(t.education_degree||'')}" placeholder="e.g. Master of Science"></div>
        <div class="field"><label for="edu-year">Year graduated (YYYY)</label>
          <input id="edu-year" inputmode="numeric" maxlength="4" value="${esc(t.education_year||'')}" placeholder="e.g. 2007"></div>
      </div>

      <hr class="hr">
      <h2>Payment</h2>
      <p class="muted" style="font-size:.92rem">The payment methods you use in your practice and
        want shown on your Theraglee listing, so people know how they can pay you.</p>
      <div class="field"><label>I accept the following payment methods</label>
        ${chipGroup('pay', PAYMENT_METHODS, t.payment_methods)}</div>

      <hr class="hr">
      <h2>Locations</h2>
      <div id="locs">${locs.map(locRow).join('')}</div>
      <button type="button" class="btn ghost sm" id="addloc">Add another location</button>

      <hr class="hr">
      <h2>How people reach you</h2>
      <div class="notice" style="margin-bottom:18px">
        Your own number and inbox stay private. Theraglee shows a tracking number on your
        profile and routes messages to the address below, which is how your referral counts
        get measured.
        ${t.proxy_phone ? `<br><br><strong>Your Theraglee number:</strong> ${esc(t.proxy_phone)}`
          : '<br><br>Your tracking number is issued once your license is verified.'}
      </div>
      <div class="grid g2">
        <div class="field"><label for="cemail">Where should messages go? *</label>
          <input id="cemail" type="email" value="${esc(t.contact_email||'')}" placeholder="you@practice.com">
          <div class="help">Never shown to visitors.</div></div>
        <div class="field"><label for="cphone">Your real phone</label>
          <input id="cphone" type="tel" value="${esc(t.contact_phone||'')}">
          <div class="help">Never shown. Used for call forwarding.</div></div>
      </div>
      <div class="field"><label for="web">Website</label>
        <input id="web" type="url" value="${esc(t.website||'')}" placeholder="https://…"></div>

      <div class="row" style="margin-top:24px">
        <button class="btn lg" id="save" type="submit">${t.id ? 'Save changes' : 'Create my profile'}</button>
        ${t.id && t.verification !== 'verified'
          ? `<button type="button" class="btn ghost" id="verify">Check my license now</button>` : ''}
        ${t.id && t.verification === 'verified'
          ? `<button type="button" class="btn ghost" id="pub">${t.published?'Unpublish':'Publish to directory'}</button>` : ''}
        ${t.published ? `<a class="btn ghost" href="therapist.html?slug=${esc(t.slug)}">View public profile</a>` : ''}
      </div>
    </form>`);

  ['states','mods','ins','ages','parts','langs','pay'].forEach(wireChips);
  wireSpecChips();
  document.getElementById('addloc').onclick = () =>
    document.getElementById('locs').insertAdjacentHTML('beforeend', locRow({}));
  document.getElementById('pform').addEventListener('submit', save);
  const pick = document.getElementById('photo');
  pick.addEventListener('change', async () => {
    const file = pick.files?.[0];
    if (!file) return;
    if (!['image/jpeg','image/png','image/webp'].includes(file.type)) {
      pick.value = ''; return toast('Choose a JPG or PNG.','err');
    }
    if (file.size > 20 * 1024 * 1024) { pick.value = ''; return toast('That photo is over 20 MB.','err'); }
    const blob = await shrinkPhoto(file);
    if (!blob) { pick.value = ''; return toast('That file could not be read as a picture. Try a JPG or PNG.','err'); }
    photoFile = blob; photoRemoved = false;
    document.getElementById('photo-preview').innerHTML = `<img src="${URL.createObjectURL(blob)}" alt="">`;
  });
  document.getElementById('photo-remove')?.addEventListener('click', (e) => {
    photoRemoved = true; photoFile = null; pick.value = '';
    document.getElementById('photo-preview').textContent = initials || '—';
    e.target.remove();
  });
  paintOffice();
  const officePick = document.getElementById('office');
  officePick.addEventListener('change', async () => {
    const files = [...(officePick.files || [])];
    officePick.value = '';
    const room = OFFICE_MAX - officeKeep.length - officeAdd.length;
    if (files.length > room) toast(`Only ${room} more picture${room===1?'':'s'} fit; the first ${room} ${room===1?'was':'were'} kept.`, 'err');
    for (const file of files.slice(0, Math.max(0, room))) {
      if (!['image/jpeg','image/png','image/webp'].includes(file.type)) { toast(`${file.name} is not a JPG or PNG.`,'err'); continue; }
      if (file.size > 20 * 1024 * 1024) { toast(`${file.name} is over 20 MB.`,'err'); continue; }
      const blob = await shrinkPhoto(file, 1400);
      if (!blob) { toast(`${file.name} could not be read as a picture.`,'err'); continue; }
      officeAdd.push({ blob, url: URL.createObjectURL(blob) });
    }
    paintOffice();
  });
  document.getElementById('verify')?.addEventListener('click', runVerification);
  document.getElementById('pub')?.addEventListener('click', togglePublish);
}

// Draws the office thumbnails (saved ones first, then the new picks), each with
// a remove button, and closes the picker once the limit is reached.
function paintOffice(){
  const grid = document.getElementById('office-grid');
  const tiles = [
    ...officeKeep.map((src, i) => ({ src, kind: 'keep', i })),
    ...officeAdd.map((p, i)   => ({ src: p.url, kind: 'add', i })),
  ];
  grid.innerHTML = tiles.map(x => `<div class="office-thumb"><img src="${esc(x.src)}" alt="">
    <button type="button" data-kind="${x.kind}" data-i="${x.i}" title="Remove this picture">×</button></div>`).join('');
  grid.querySelectorAll('button').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i);
    if (b.dataset.kind === 'keep') officeDrop.push(...officeKeep.splice(i, 1));
    else { URL.revokeObjectURL(officeAdd[i].url); officeAdd.splice(i, 1); }
    paintOffice();
  });
  document.getElementById('office').disabled = tiles.length >= OFFICE_MAX;
}

async function save(e){
  e.preventDefault();
  const V = id => document.getElementById(id).value.trim();
  if (!V('fn') || !V('ln')) return toast('First and last name are required.','err');
  if (!V('lic')) return toast('License number is required.','err');
  if (!chipVals('states').length) return toast('Select at least one state of licensure.','err');
  if (!V('cemail')) return toast('Add the email where messages should go.','err');
  const gradYear = V('edu-year');
  if (gradYear && !(/^\d{4}$/.test(gradYear) && Number(gradYear) >= 1900 && Number(gradYear) <= new Date().getFullYear()))
    return toast('Enter the year you graduated as four digits, like 2007.','err');
  // Specialties: the chips plus the write-ins, and the starred chips as the top three.
  const written = ['spec-c1','spec-c2','spec-c3'].map(V).filter(Boolean);
  const allSpecs = [...new Set([...chipVals('spec'), ...written])];
  const topSpecs = [...document.querySelectorAll('#spec .chip.top')].map(c => c.dataset.v);
  // Treatment modalities: the chips plus the write-ins.
  const allMods = [...new Set([...chipVals('mods'), ...['mod-c1','mod-c2','mod-c3'].map(V).filter(Boolean)])];
  // Insurance: the chips plus the write-ins.
  const allIns = [...new Set([...chipVals('ins'), ...['ins-c1','ins-c2','ins-c3'].map(V).filter(Boolean)])];
  // Languages: the chips plus the write-ins.
  const allLangs = [...new Set([...chipVals('langs'), ...['lang-c1','lang-c2','lang-c3'].map(V).filter(Boolean)])];

  const locations = [...document.querySelectorAll('[data-loc]')].map(r => ({
    address: r.querySelector('.l-address').value.trim(),
    city:    r.querySelector('.l-city').value.trim(),
    state:   r.querySelector('.l-state').value,
    zip:     r.querySelector('.l-zip').value.trim(),
  })).filter(l => l.city || l.zip || l.address);

  const payload = {
    user_id: a.profile.id,
    first_name: V('fn'), last_name: V('ln'),
    credentials: V('cred') || null, gender: V('gender') || null,
    bio: V('bio') || null, photo_url: T?.photo_url || null,
    license_number: V('lic'), license_type: V('ltype') || null,
    license_states: chipVals('states'),
    specialties: allSpecs, top_specialties: topSpecs,
    treatment_modalities: allMods, insurances: allIns,
    payment_methods: chipVals('pay'),
    age_ranges: chipVals('ages'), participants: chipVals('parts'), languages: allLangs,
    age_range_1: V('age-r1') || null, age_range_2: V('age-r2') || null,
    delivery: V('delivery'), fees: V('fees') || null,
    education_school: V('edu-school') || null,
    education_degree: V('edu-degree') || null,
    education_year: gradYear ? Number(gradYear) : null,
    // The one-line form the public profile and Quick look show, kept in step.
    education: [V('edu-degree'), V('edu-school'), gradYear].filter(Boolean).join(', ') || null,
    locations,
    contact_email: V('cemail'), contact_phone: V('cphone') || null,
    website: V('web') || null,
  };

  const btn = document.getElementById('save');
  busy(btn, true, 'Saving…');

  // The picture goes to storage first, so the row below can carry its address.
  // Same path every time, so a new upload replaces the old file; the ?v= makes
  // browsers fetch the new one instead of the copy they cached.
  if (photoFile) {
    const { error: upErr } = await sb.storage.from(PHOTO_BUCKET)
      .upload(photoPath(), photoFile, { upsert: true, contentType: 'image/jpeg', cacheControl: '3600' });
    if (upErr) { busy(btn, false); return toast(`The photo did not upload: ${upErr.message}`,'err'); }
    payload.photo_url = sb.storage.from(PHOTO_BUCKET).getPublicUrl(photoPath()).data.publicUrl
      + '?v=' + Date.now();
  } else if (photoRemoved) {
    payload.photo_url = null;
    await sb.storage.from(PHOTO_BUCKET).remove([photoPath()]);   // best effort
  }

  // Office pictures: upload the new ones, keep the ones still on the list, and
  // delete the files behind the ones removed. Names are unique, so no ?v= needed.
  if (officeAdd.length || officeDrop.length) {
    const added = [];
    for (const [i, p] of officeAdd.entries()) {
      const path = `${officeDir()}/${Date.now()}-${i}.jpg`;
      const { error: upErr } = await sb.storage.from(PHOTO_BUCKET)
        .upload(path, p.blob, { contentType: 'image/jpeg', cacheControl: '3600' });
      if (upErr) { busy(btn, false); return toast(`An office picture did not upload: ${upErr.message}`,'err'); }
      added.push(sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl);
    }
    payload.practice_photos = [...officeKeep, ...added];
    const gone = officeDrop.map(storagePathOf).filter(Boolean);
    if (gone.length) await sb.storage.from(PHOTO_BUCKET).remove(gone);   // best effort
  }

  const { data, error } = T?.id
    ? await sb.from('therapist_profiles').update(payload).eq('id', T.id).select().single()
    : await sb.from('therapist_profiles').insert(payload).select().single();
  busy(btn, false);
  if (error) return toast(error.message,'err');
  const isNew = !T?.id;
  T = data; clearAccess();
  // Creating a profile, or changing its license details, queues the license
  // check in the database; the result arrives by email.
  toast(isNew ? 'Saved. We are checking your license with the state board and will email you either way.' : 'Saved.', 'ok');
  route();
}

async function runVerification(e){
  const btn = e?.target;
  busy(btn, true, 'Checking…');
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(`${FN}/verify-license`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', Authorization: `Bearer ${session?.access_token??''}` },
      body: JSON.stringify({ therapist_id: T.id }),
    });
    const out = await res.json();
    busy(btn, false);
    if (out.error) return toast(out.message || 'Could not run the check.','err');
    toast(out.message, out.status === 'verified' ? 'ok' : '');
    clearAccess(); a = await access(true); T = a.therapist || T;
    route();
  } catch { busy(btn, false); toast('Could not reach the verification service.','err'); }
}

async function togglePublish(e){
  busy(e.target, true, '…');
  const { data, error } = await sb.from('therapist_profiles')
    .update({ published: !T.published }).eq('id', T.id).select().single();
  busy(e.target, false);
  if (error) return toast(error.message,'err');
  const wanted = !T.published;
  T = data;
  if (wanted && !T.published) {
    toast(!paid ? 'Publishing needs an active membership.'
        : T.verification !== 'verified' ? 'Publishing needs a verified license.'
        : 'Publishing needs a passed identity check — see the Membership tab.', 'err');
  } else {
    toast(T.published ? 'You are live in the directory.' : 'Unpublished.','ok');
  }
  route();
}

/* ------------------------------------------------------- membership */
async function membership(){
  render('<div class="skeleton" style="height:140px"></div>');
  const [{ data: checks }, { data: cfgRows }] = await Promise.all([
    T ? sb.from('license_verifications').select('*')
          .eq('therapist_id', T.id).order('checked_at', { ascending:false }).limit(5)
      : Promise.resolve({ data: [] }),
    sb.from('app_config').select('key,value')
      .in('key', ['identity_required','connect_enabled','platform_fee_percent',
                  'display_therapist_monthly','display_therapist_yearly','founding_enabled',
                  'price_therapist_founding','display_therapist_founding','founding_spots',
                  'founding_deadline']),
  ]);
  const cfg = Object.fromEntries((cfgRows||[]).map(r=>[r.key,r.value]));
  const p = a.profile;
  // The founding-member rate shows only while the admin has the offer open
  // (or to the admin, so it can be tested before the switch is on).
  const offer = foundingOffer(cfg);
  const founding = (offer.open || (p.role === 'admin' && offer.priceId)) && offer.rate;

  const idStatus = T?.identity_status || 'unverified';
  const idLabel = { unverified:'Not started', pending:'Being checked', verified:'Verified',
                    requires_input:'Needs another try', canceled:'Canceled' }[idStatus] || idStatus;
  const acct = T?.stripe_account_status || 'none';
  const acctLabel = { none:'Not set up', onboarding:'Setup not finished',
                      enabled:'Ready for payouts', restricted:'Needs attention' }[acct] || acct;
  const connectOn = cfg.connect_enabled === 'true';
  const feeDollars = T?.session_fee_cents ? String(Math.round(T.session_fee_cents / 100)) : '';

  // One-time pointer for an account that chose the founding rate at sign-up.
  const foundingHello = wantFounding && !paid
    ? (founding
        ? `<div class="notice" style="margin-top:16px"><strong>Welcome. You chose the founding member
             rate.</strong> Click <strong>Founding member · $${esc(offer.rate)}/month</strong> below to start it${
             offer.spots || offer.deadlineText ? ' while it lasts' : ''}. Your listing publishes once your
             license is verified.</div>`
        : `<div class="notice warn" style="margin-top:16px"><strong>The founding member offer is no longer
             available.</strong> The regular membership is below.</div>`)
    : '';
  wantFounding = false;

  render(`
    <h2>Therapist membership</h2>
    ${foundingHello}
    <div class="card" style="margin-top:16px">
      <div class="spread">
        <div><strong>Status</strong><br>
          <span class="muted">${paid ? 'Active' : (p.subscription_status || 'Not subscribed')}</span></div>
        ${p.current_period_end ? `<div><strong>${p.cancel_at_period_end?'Ends':'Renews'}</strong><br>
          <span class="muted">${fmtDate(p.current_period_end)}</span></div>` : ''}
        <div class="row">
          ${paid ? `<button class="btn ghost" id="portal">Manage membership</button>`
                 : `${founding ? `<button class="btn" id="sub-founding">Founding member · $${esc(offer.rate)}/month</button>` : ''}
                    <button class="btn ${founding ? 'ghost' : ''}" id="sub">${founding ? 'Regular monthly' : 'Start monthly'}${
                      cfg.display_therapist_monthly ? ' · $' + esc(cfg.display_therapist_monthly) + '/month' : ''}</button>
                    <button class="btn ghost" id="sub-yearly">Yearly${
                      cfg.display_therapist_yearly ? ' · $' + esc(cfg.display_therapist_yearly) + '/year' : ''}</button>`}
        </div>
      </div>
      ${!paid && founding ? `<p class="muted" style="margin:14px 0 0;font-size:.93rem">
        <strong>Founding member offer${offer.open ? '' : ' (off — visible to admins only)'}:</strong>
        $${esc(offer.rate)} a month, locked in for as long as your membership stays active${
        offer.spots ? `, for the first ${offer.spots} therapists` : ''}${
        offer.deadlineText ? ` who join by ${esc(offer.deadlineText)}` : ''}.
        Switching to the yearly plan later gives up the locked-in rate.</p>` : ''}
      ${paid ? '' : `<p class="faint" style="margin:14px 0 0">One flat membership for licensed
        professionals, separate from the member plans. It publishes your listing once your license
        is verified, and opens the clinician library and Match Mode. Cancel any time.
        <a href="for-therapists.html#membership">Everything it includes</a>.</p>`}
    </div>

    ${T ? `
    <h3 style="margin-top:32px">Identity check</h3>
    <div class="card">
      <div class="spread">
        <div><strong>${esc(idLabel)}</strong><br>
          <span class="muted">${
            idStatus==='verified'
              ? `Confirmed${T.identity_verified_at ? ' on ' + fmtDate(T.identity_verified_at) : ''} with a government ID and a selfie, through Stripe Identity.`
            : idStatus==='pending'
              ? 'Stripe is checking your document. This usually takes a few minutes.'
            : idStatus==='requires_input'
              ? esc(T.identity_last_error || 'The last attempt could not be confirmed. You can try again.')
            : 'A quick photo of your government ID and a selfie, handled by Stripe. Theraglee never sees the document itself.'}</span></div>
        ${idStatus!=='verified' && idStatus!=='pending'
          ? `<button class="btn ghost" id="idv">${idStatus==='requires_input'?'Try again':'Verify my identity'}</button>` : ''}
      </div>
    </div>
    ${cfg.identity_required==='true'
      ? `<p class="faint" style="margin-top:10px">Listings publish only after this check passes.</p>` : ''}

    ${connectOn ? `
    <h3 style="margin-top:32px">Get paid through Theraglee</h3>
    <div class="card">
      <div class="spread">
        <div><strong>${esc(acctLabel)}</strong><br>
          <span class="muted">${
            acct==='enabled'    ? 'Clients can pay you for sessions from your profile. Payouts go to your own bank account.'
          : acct==='restricted' ? 'Stripe needs more information before payouts can continue.'
          : acct==='onboarding' ? 'Pick up where you left off to finish setting up payouts.'
          : T.verification==='verified'
              ? `Take session payments from your profile. Theraglee keeps ${esc(cfg.platform_fee_percent||'10')}% and Stripe pays the rest to your bank.`
              : 'Opens once your license is verified.'}</span></div>
        <div class="row">
          ${acct==='enabled' || acct==='restricted'
            ? `<button class="btn ghost" id="payouts">Payouts dashboard</button>` : ''}
          ${acct==='restricted'
            ? `<button class="btn" id="connect">Update details</button>`
          : acct!=='enabled' && T.verification==='verified'
            ? `<button class="btn" id="connect">${acct==='none'?'Set up payouts':'Continue setup'}</button>` : ''}
        </div>
      </div>
      ${acct==='enabled' ? `
      <form id="feeform" class="row" style="margin-top:18px;align-items:flex-end;gap:14px;flex-wrap:wrap">
        <div class="field" style="margin:0"><label for="fee">Session price (USD)</label>
          <input id="fee" type="number" min="5" max="1000" step="1" value="${esc(feeDollars)}"
                 style="width:140px" placeholder="120"></div>
        <label style="display:flex;gap:8px;align-items:center;margin:0 0 10px">
          <input type="checkbox" id="acc" ${T.accepts_payments?'checked':''}>
          Show “Pay for a session” on my profile</label>
        <button class="btn ghost" type="submit" style="margin-bottom:4px">Save</button>
      </form>` : ''}
    </div>` : ''}
    ` : ''}

    <h3 style="margin-top:32px">License verification</h3>
    ${(checks||[]).length ? `<div class="scroll-x"><table class="data">
      <thead><tr><th>Checked</th><th>Result</th><th>How</th><th>Board</th><th>Expires</th></tr></thead>
      <tbody>${checks.map(c=>`<tr>
        <td class="faint">${fmtDate(c.checked_at)}</td>
        <td><span class="badge ${c.status==='verified'?'':'gray'}">${esc(c.status)}</span></td>
        <td>${c.method==='vendor'?'Automatic':'Reviewed by us'}</td>
        <td>${esc(c.board_name||'—')}</td>
        <td>${c.expires_on?fmtDate(c.expires_on):'—'}</td></tr>`).join('')}</tbody>
    </table></div>` : '<div class="empty">No checks recorded yet.</div>'}
    ${T?.license_expires_on ? `<p class="faint" style="margin-top:12px">
      License on file expires ${fmtDate(T.license_expires_on)}. We re-check before then.</p>` : ''}

    <div class="notice" style="margin-top:24px">
      A listing appears in the directory only while the license is verified and current
      <em>and</em> the membership is active${cfg.identity_required==='true'
        ? ' <em>and</em> the identity check has passed' : ''}. If any of those lapses, the
      profile comes down automatically.
    </div>`);

  document.getElementById('portal')?.addEventListener('click', e => openPortal(e.target));
  document.getElementById('sub-founding')?.addEventListener('click', e => startCheckout('therapist','founding',e.target));
  document.getElementById('sub')?.addEventListener('click', e => startCheckout('therapist','monthly',e.target));
  document.getElementById('sub-yearly')?.addEventListener('click', e => startCheckout('therapist','yearly',e.target));
  document.getElementById('idv')?.addEventListener('click', e => startIdentity(e.target));
  document.getElementById('connect')?.addEventListener('click', e => connectAction('onboard', e.target));
  document.getElementById('payouts')?.addEventListener('click', e => connectAction('dashboard', e.target));
  document.getElementById('feeform')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const dollars = Number(document.getElementById('fee').value);
    const accepts = document.getElementById('acc').checked;
    if (accepts && !(dollars >= 5 && dollars <= 1000)) {
      return toast('Enter a session price between $5 and $1,000.', 'err');
    }
    const btn = e.target.querySelector('button[type=submit]');
    busy(btn, true, 'Saving…');
    const { data, error } = await sb.from('therapist_profiles')
      .update({ session_fee_cents: dollars ? Math.round(dollars * 100) : null, accepts_payments: accepts })
      .eq('id', T.id).select().single();
    busy(btn, false);
    if (error) return toast(error.message, 'err');
    T = data; toast('Saved.', 'ok'); membership();
  });
}

/* ------------------------------------------------------------ route */
function route(){
  ({ home, referrals, messages, members, library, profile, membership }[tab] || home)();
}
// The header links and the buttons on the Home tab point at #tabs of this page.
addEventListener('hashchange', () => {
  const h = location.hash.replace('#','');
  if (h && h !== tab) { tab = h; route(); }
});
route();
}
}
