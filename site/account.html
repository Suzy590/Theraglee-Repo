<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your account — Theraglee</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin:24px 0 28px;overflow-x:auto}
  .tabs button{border:0;background:none;font:inherit;font-size:.95rem;padding:12px 18px;cursor:pointer;
    color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--green);border-bottom-color:var(--green);font-weight:500}
  .switch{display:flex;gap:14px;align-items:flex-start;padding:18px;border:1px solid var(--hair);
    border-radius:var(--r-sm);background:var(--paper);margin-bottom:12px}
  .switch input{width:20px;height:20px;accent-color:var(--green);margin-top:2px;flex:0 0 auto}
</style>
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:220px"></div>
</div></main>

<script type="module">
import { chrome, sb, requireAuth, access, clearAccess, esc, toast, busy, qs,
         fmtDate, tierName, openPortal, startCheckout, modal,
         contentCounts, counted } from './assets/app.js';
import { MEMBER_ISSUES } from './assets/lists.js';
import { SETS as TRIVIA } from './assets/trivia-sets.js';
import { matchDetailsModal, matchSummary, matchComplete, MATCH_BLURB } from './assets/match.js';
import { loadPrices, tierCards, PLANS_INTRO, PLANS_NOTE } from './assets/plans.js';
await chrome({ active:'account.html' });
let a = await requireAuth();
const c = await contentCounts();
const prices = await loadPrices(sb);   // display prices for the tier cards
if (a) {
const root = document.getElementById('root');
// A therapist account has no member tier: it gets its own, shorter account page.
const isTherapist = a.profile.role === 'therapist';
const TABS = isTherapist
  ? [['membership','Membership'],['security','Sign-in & data']]
  : [['membership','Membership'],['profile','Profile'],['privacy','Privacy'],
     ['inbox','Inbox'],['history','Your history']];
let tab = location.hash.replace('#','') || 'membership';
if (!TABS.some(([k]) => k === tab)) tab = 'membership';

if (qs('checkout') === 'success') {
  toast('Payment received — welcome aboard. It can take a moment to appear.', 'ok');
  await new Promise(r => setTimeout(r, 2500));
  clearAccess(); a = await access(true);
  history.replaceState({}, '', 'account.html');
}

function shell(body){
  return `
    <div class="spread">
      <div><h1 style="margin:0">Your account</h1>
        <p class="faint" style="margin:4px 0 0">${esc(a.profile.email||'')}</p></div>
      <span class="badge">${isTherapist ? 'Therapist' : tierName(a.level)} membership</span>
    </div>
    <div class="tabs">
      ${TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}
    </div>
    <div id="body">${body}</div>`;
}

function membership(){
  const p = a.profile;
  const live = ['active','trialing'].includes(p.subscription_status);
  return `
    <div class="card pad-lg">
      <div class="spread">
        <div>
          <h2 style="margin:0">${tierName(a.level)}</h2>
          <p class="muted" style="margin:6px 0 0">
            ${a.level === 1 ? 'Free forever. No card on file.'
              : live ? (p.cancel_at_period_end
                  ? `Ends on ${fmtDate(p.current_period_end)} — you keep access until then.`
                  : `Renews on ${fmtDate(p.current_period_end)}.`)
              : p.subscription_status === 'past_due' ? 'A payment did not go through.'
              : 'No paid membership on this account.'}
          </p>
        </div>
        <div class="row">
          ${live ? `<button class="btn ghost" id="portal">Manage billing</button>` : ''}
          ${a.level < 3 ? `<a class="btn" href="pricing.html">${a.level<2?'Upgrade':'Go Premium'}</a>` : ''}
        </div>
      </div>
    </div>

    ${a.level < 3 ? `
    <h2 style="margin-top:34px">${esc(PLANS_INTRO.title)}</h2>
    <p class="muted">${esc(PLANS_INTRO.lede)}</p>
    ${tierCards({ prices, level: a.level })}
    <p class="tiers-note">${esc(PLANS_NOTE)}</p>` : ''}

    <h2 style="margin-top:34px">What you have access to</h2>
    <div class="grid g3">
      ${[['Progress dashboard',1],['Favorites in your dashboard',1],['Journal & prompts',1],
         ['Articles sent to your inbox',1],['7-day challenges',1],['Checklists with progress',1],
         ['Therapist reach-out switch',1],['Daily personalized content',1],
         [counted(c.quiz,'quizzes','Quizzes'),2],[counted(c.worksheet,'worksheets','Worksheets'),2],['365-day custom challenges',2],
         ['Downloadable desktop pet',2],[`${TRIVIA.length} mental health trivia quizzes`,2],
         ['Goal & mood tracking',3],
         ['Mandalas to print or color',3],['Resource map & playlists',3]]
        .map(([l,n])=>`<div class="card" style="padding:16px">
          <div class="row" style="justify-content:space-between">
            <span style="font-size:.94rem">${esc(l)}</span>
            ${a.level>=n ? '<span class="badge">Included</span>'
                         : `<span class="badge lock">${tierName(n)}</span>`}
          </div></div>`).join('')}
    </div>`;
}

function therapistMembership(){
  const p = a.profile;
  const live = ['active','trialing'].includes(p.subscription_status);
  return `
    <div class="card pad-lg">
      <div class="spread">
        <div>
          <h2 style="margin:0">Therapist membership</h2>
          <p class="muted" style="margin:6px 0 0">
            ${live ? (p.cancel_at_period_end
                  ? `Ends on ${fmtDate(p.current_period_end)} — your listing stays up until then.`
                  : `Active. Renews on ${fmtDate(p.current_period_end)}.`)
              : p.subscription_status === 'past_due' ? 'A payment did not go through. Update your card to keep the listing up.'
              : 'Not started. Start it from your practice dashboard to publish your listing and open the clinician library.'}
          </p>
        </div>
        <div class="row">
          ${live ? `<button class="btn ghost" id="portal">Manage billing</button>` : ''}
          <a class="btn" href="therapist-dashboard.html#membership">Open practice dashboard</a>
        </div>
      </div>
    </div>

    <h2 style="margin-top:34px">What your membership includes</h2>
    <p class="muted">One flat membership for licensed professionals, separate from the member plans.</p>
    <div class="grid g3">
      ${['A verified, searchable listing','A Theraglee phone number that keeps yours private',
         'Messages routed without your email address','Referral stats: calls, messages, clicks, shares, views',
         'Theraglee Match Mode: reach out to members who opted in','The clinician library',
         'Identity check through Stripe','Session payments to your own bank account']
        .map(l=>`<div class="card" style="padding:16px">
          <div class="row" style="justify-content:space-between">
            <span style="font-size:.94rem">${esc(l)}</span>
            ${live ? '<span class="badge">Included</span>' : '<span class="badge lock">With membership</span>'}
          </div></div>`).join('')}
    </div>`;
}

function security(){
  return `
    <div style="max-width:560px">
      <h2>Password</h2>
      <p class="muted">We email you a link; the link signs you in and lets you set a new one.</p>
      <button class="btn ghost" id="pw">Send me a reset link</button>

      <hr class="hr">
      <h2>Your data</h2>
      <p class="muted">Your listing, messages and referral history live on your
        <a href="therapist-dashboard.html">practice dashboard</a>. Closing the account takes the
        listing down and removes them.</p>
      <button class="btn danger" id="delete">Close my account</button>
    </div>`;
}

function profile(){
  const p = a.profile;
  return `
    <form id="pf" style="max-width:560px">
      <div class="field"><label for="name">What should we call you?</label>
        <input id="name" value="${esc(p.full_name||'')}" placeholder="A first name or nickname is fine">
        <div class="help">Only for greeting you on your dashboard. Therapists never see it. You give
          a therapist your real name only when you reply to one from your inbox.</div></div>
      <div class="field"><label for="zip">Zip code</label>
        <input id="zip" value="${esc(p.zip||'')}" inputmode="numeric">
        <div class="help">Used to find nearby therapists and resources. Never shown publicly. If you
          switch on <strong>Theraglee Match Mode</strong> under Privacy, therapists see the first
          three digits only.</div></div>
      <div class="field"><label>What are you working on?</label>
        <div class="chips" id="issues">${MEMBER_ISSUES.map(i=>
          `<button type="button" class="chip ${(p.issues||[]).includes(i)?'on':''}" data-v="${esc(i)}">${esc(i)}</button>`).join('')}</div>
        <div class="help">This shapes the daily content you see. If you switch on <strong>Theraglee
          Match Mode</strong> under Privacy, these topics are also what therapists see.</div></div>

      <hr class="hr">
      <h3>Daily email</h3>
      <label class="switch"><input type="checkbox" id="demail" ${p.daily_email?'checked':''}>
        <span><strong>Send me a morning email</strong><br>
        <span class="muted">An article you have not read yet, plus the picks below. One short message
        a day, with an unsubscribe link in every one.</span></span></label>
      <div class="field"><label>What to include</label>
        <div class="chips" id="kinds">${[['article','Article'],['affirmation','Affirmation'],['quote','Quote'],
          ['tip','Tip'],['fun_fact','Fun fact'],['journal_prompt','Journal prompt']].map(([k,l])=>
          `<button type="button" class="chip ${(p.daily_email_kinds||[]).includes(k)?'on':''}" data-v="${k}">${l}</button>`).join('')}</div></div>

      <button class="btn" id="savep" type="submit">Save changes</button>
    </form>

    <hr class="hr">
    <h3>Password</h3>
    <button class="btn ghost" id="pw">Send me a reset link</button>`;
}

function privacy(){
  const p = a.profile;
  return `
    <div style="max-width:640px">
      <h2>Who can see you</h2>
      <label class="switch">
        <input type="checkbox" id="vis" ${p.visible_to_therapists?'checked':''}>
        <span><strong>Theraglee Match Mode</strong><br>
        <span class="muted">${MATCH_BLURB} Switch it off and you disappear from their view
        entirely.</span></span></label>
      ${p.visible_to_therapists ? `<div class="notice" style="margin-bottom:12px">
          <strong>Therapists read:</strong> ${esc(matchSummary(p))}
          <div><button type="button" class="btn sm ghost" id="vis-edit" style="margin-top:10px">Change what they see</button></div></div>` : ''}

      <div class="notice" style="margin-top:20px">
        Your journal entries, quiz results, worksheets and mood logs are private to your account.
        No therapist, and no other member, can read them.
      </div>

      <h2 style="margin-top:34px">Questions</h2>
      <div class="stack">
        <div class="card"><h3>What is <strong>Theraglee Match Mode</strong>?</h3>
          <p class="muted" style="margin:0">The toggle switch above. It lets Theraglee therapists
            know you are interested in them reaching out to you to set up an appointment for
            therapy. You don't have to contact them — they contact you. When you turn the switch ON,
            we ask you for a few details, and that is all Theraglee therapists in your area can see:
            a pseudonymous profile with your age range, the broad topics you want to work on (like
            anxiety or burnout), whether you prefer in-person, video, or either, and the first three
            digits of your zip code so they know you're nearby. Something like "35–44 · seeks help
            with anxiety · seeking video sessions · in the 902xx area". Not your name, and not your
            exact location. Theraglee therapists contact you by sending a message to your Theraglee
            inbox, and you decide whether to answer. If you do reply, you'll be prompted to share
            your real name, and it goes to that one therapist only. They never see your email
            address, your journal, your quiz results, your worksheet results, or anything else in
            your private dashboard. The toggle switch is OFF by default, one tap hides your profile
            again whenever you like, and you can block any therapist with one tap from your
            Inbox.</p></div>
        <div class="card"><h3>Why do I give my real name when I reply?</h3>
          <p class="muted" style="margin:0">Browsing and being found stays pseudonymous. Booking
            therapy does not: a therapist needs to know who they are arranging an appointment
            with. So the moment you choose to answer a therapist, your reply carries your real
            name. It goes to that therapist only, and only because you chose to write back.</p></div>
      </div>

      <hr class="hr">
      <h2>Your data</h2>
      <p class="muted">Download everything this account holds, or close it for good.</p>
      <div class="row">
        <button class="btn ghost" id="export">Download my data</button>
        <button class="btn danger" id="delete">Delete my account</button>
      </div>
    </div>`;
}

async function inbox(){
  const host = document.getElementById('body');
  const [{ data: sent }, { data: replies }, { data: blocks }] = await Promise.all([
    sb.from('therapist_outreach')
      .select('*, therapist_profiles(first_name,last_name,credentials,slug)')
      .eq('member_id', a.profile.id).order('created_at', { ascending:true }),
    sb.from('outreach_replies').select('*')
      .eq('member_id', a.profile.id).order('created_at', { ascending:true }),
    sb.from('member_blocks').select('therapist_id').eq('member_id', a.profile.id),
  ]);
  const blocked = new Set((blocks || []).map(b => b.therapist_id));

  // One thread per therapist: their messages and your replies, oldest first.
  const threads = new Map();
  for (const m of sent || []) {
    const t = threads.get(m.therapist_id) || { therapist: m.therapist_profiles || {}, items: [], last: m };
    t.items.push({ from: 'therapist', at: m.created_at, text: m.message, id: m.id });
    t.last = m; threads.set(m.therapist_id, t);
  }
  for (const r of replies || []) {
    const t = threads.get(r.therapist_id);
    if (t) t.items.push({ from: 'you', at: r.created_at, text: r.message, name: r.member_name });
  }
  const list = [...threads.entries()].map(([id, t]) => {
    t.items.sort((x, y) => new Date(x.at) - new Date(y.at));
    return [id, t];
  }).sort((x, y) => new Date(y[1].items.at(-1).at) - new Date(x[1].items.at(-1).at));
  const lastName = (replies || []).at(-1)?.member_name || '';

  host.innerHTML = `
    <h2>Messages from therapists</h2>
    <p class="muted">Only therapists you allowed to reach you by turning on <strong>Theraglee Match
      Mode</strong>, under Privacy. They see your pseudonymous profile, not your name. If you
      reply, your reply carries your real name to that one therapist, so they know who they will
      be booking with. Block any therapist with one tap and they can no longer see or message
      you.</p>
    ${list.length ? list.map(([tid, t]) => {
      const th = t.therapist;
      const replied = t.items.some(i => i.from === 'you');
      const isBlocked = blocked.has(tid);
      return `<div class="card" style="margin-top:14px" data-thread="${esc(tid)}">
        <div class="spread">
          <strong>${esc(th.first_name||'')} ${esc(th.last_name||'')}${th.credentials?', '+esc(th.credentials):''}</strong>
          ${isBlocked ? '<span class="badge lock">Blocked</span>'
            : replied ? '<span class="badge">You replied</span>' : '<span class="badge gray">Waiting for you</span>'}</div>
        <div class="stack" style="margin-top:12px">${t.items.map(i => `
          <div style="padding:12px 14px;border-radius:var(--r-sm);background:${i.from==='you'?'var(--soft)':'var(--sand)'}">
            <div class="spread"><span class="faint">${i.from==='you' ? 'You, as ' + esc(i.name) : 'Therapist'}</span>
              <span class="faint">${fmtDate(i.at)}</span></div>
            <p class="muted" style="margin:6px 0 0;white-space:pre-wrap">${esc(i.text)}</p></div>`).join('')}</div>
        <div class="row" style="margin-top:12px">
          ${th.slug?`<a class="btn sm ghost" href="therapist.html?slug=${esc(th.slug)}">View their profile</a>`:''}
          ${isBlocked
            ? `<button class="btn sm ghost" data-unblock="${esc(tid)}">Unblock</button>`
            : `<button class="btn sm" data-reply="${esc(tid)}">${replied ? 'Reply again' : 'Reply with my name'}</button>
               <button class="btn sm ghost" data-block="${esc(tid)}">Block this therapist</button>`}
        </div>
        <form class="reply" data-form="${esc(tid)}" hidden style="margin-top:16px">
          <div class="notice" style="margin-bottom:12px">Your reply goes to this therapist with your
            <strong>real name</strong>, so they know who they are arranging an appointment with. They
            get an email that you wrote back. Nothing else about you changes: they still cannot see
            your email address or anything you have written.</div>
          <div class="field"><label for="rn-${esc(tid)}">Your real name *</label>
            <input id="rn-${esc(tid)}" type="text" autocomplete="name" placeholder="First and last name"
                   value="${esc(lastName)}" required></div>
          <div class="field"><label for="rm-${esc(tid)}">Your message *</label>
            <textarea id="rm-${esc(tid)}" placeholder="Hello — yes, I would like to hear more about…" required></textarea></div>
          <div class="row" style="justify-content:flex-end">
            <button type="button" class="btn ghost" data-cancel="${esc(tid)}">Cancel</button>
            <button type="submit" class="btn">Send my reply</button></div>
        </form>
      </div>`;
    }).join('') : '<div class="empty" style="margin-top:18px">No messages.</div>'}`;

  host.querySelectorAll('[data-reply]').forEach(b => b.onclick = () => {
    const f = host.querySelector(`[data-form="${b.dataset.reply}"]`);
    f.hidden = false; b.hidden = true; f.querySelector('input').focus();
  });
  // One tap blocks: the therapist stops seeing this member and can no longer write to them.
  host.querySelectorAll('[data-block]').forEach(b => b.onclick = async () => {
    busy(b, true, 'Blocking…');
    const { error } = await sb.from('member_blocks')
      .insert({ member_id: a.profile.id, therapist_id: b.dataset.block });
    busy(b, false);
    if (error) return toast(error.message, 'err');
    toast('Blocked. This therapist can no longer see or message you.', 'ok'); inbox();
  });
  host.querySelectorAll('[data-unblock]').forEach(b => b.onclick = async () => {
    busy(b, true, 'Unblocking…');
    const { error } = await sb.from('member_blocks').delete()
      .eq('member_id', a.profile.id).eq('therapist_id', b.dataset.unblock);
    busy(b, false);
    if (error) return toast(error.message, 'err');
    toast('Unblocked.', 'ok'); inbox();
  });
  host.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
    host.querySelector(`[data-form="${b.dataset.cancel}"]`).hidden = true;
    host.querySelector(`[data-reply="${b.dataset.cancel}"]`).hidden = false;
  });
  host.querySelectorAll('form.reply').forEach(f => f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const tid = f.dataset.form, t = threads.get(tid);
    const name = f.querySelector('input').value.trim();
    const msg  = f.querySelector('textarea').value.trim();
    if (name.length < 2 || !name.includes(' ')) return toast('Please give your real first and last name.','err');
    if (msg.length < 2) return toast('Please write a message.','err');
    const btn = f.querySelector('[type=submit]');
    busy(btn, true, 'Sending…');
    const { error } = await sb.from('outreach_replies').insert({
      outreach_id: t.last.id, therapist_id: tid, member_id: a.profile.id,
      member_name: name, message: msg });
    busy(btn, false);
    if (error) return toast(error.message,'err');
    toast('Reply sent with your name.','ok'); inbox();
  }));
}

async function historyTab(){
  const host = document.getElementById('body');
  const [{ data: quizzes }, { count: nJ }, { data: sheets }] = await Promise.all([
    sb.from('quiz_attempts').select('*, quizzes(title,slug)')
      .eq('user_id', a.profile.id).order('created_at',{ascending:false}).limit(30),
    sb.from('journal_entries').select('id',{count:'exact',head:true}).eq('user_id', a.profile.id),
    sb.from('worksheet_responses').select('*, worksheets(title,slug)')
      .eq('user_id', a.profile.id).order('updated_at',{ascending:false}).limit(30),
  ]);
  host.innerHTML = `
    <h2>Quiz results</h2>
    ${(quizzes||[]).length ? `<div class="scroll-x"><table class="data">
      <thead><tr><th>Quiz</th><th>Score</th><th>Result</th><th>When</th></tr></thead>
      <tbody>${quizzes.map(q=>`<tr>
        <td><a href="quiz.html?slug=${esc(q.quizzes?.slug||'')}">${esc(q.quizzes?.title||'Quiz')}</a></td>
        <td>${q.score}</td><td>${esc(q.band_label||'—')}</td>
        <td class="faint">${fmtDate(q.created_at)}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty">No quizzes taken yet.</div>'}

    <h2 style="margin-top:34px">Worksheets in progress</h2>
    ${(sheets||[]).length ? `<div class="grid g3">${sheets.map(s=>`
      <a class="tile" href="worksheet.html?slug=${esc(s.worksheets?.slug||'')}">
        <h3>${esc(s.worksheets?.title||'Worksheet')}</h3>
        <span class="meta">Last edited ${fmtDate(s.updated_at)}</span></a>`).join('')}</div>`
      : '<div class="empty">Nothing saved yet.</div>'}

    <h2 style="margin-top:34px">Journal</h2>
    <p class="muted">${nJ||0} entr${nJ===1?'y':'ies'} — <a href="journal.html">open your journal</a>.</p>`;
}

function chipVals(id){ return [...document.querySelectorAll(`#${id} .chip.on`)].map(c=>c.dataset.v); }
function wireChips(id){ document.querySelectorAll(`#${id} .chip`).forEach(c =>
  c.addEventListener('click', ()=>c.classList.toggle('on'))); }

// The "close my account" dialog, shared by the member Privacy tab and the therapist Sign-in & data tab.
function wireDelete(){
  document.getElementById('delete')?.addEventListener('click', () => {
    const back = modal(`<h2>Delete your account?</h2>
      <p class="muted">${isTherapist
        ? 'This takes your listing down and removes your messages and referral history permanently. It cannot be undone.'
        : 'This removes your journal, quiz results, worksheets, challenges and tracking permanently. It cannot be undone.'}</p>
      <p class="muted">Type <strong>DELETE</strong> to confirm.</p>
      <input id="confirm" placeholder="DELETE">
      <div class="row" style="justify-content:flex-end;margin-top:18px">
        <button class="btn ghost" id="no">Keep my account</button>
        <button class="btn danger" id="yes">Delete permanently</button></div>`);
    back.querySelector('#no').onclick = () => back.remove();
    back.querySelector('#yes').onclick = async () => {
      if (back.querySelector('#confirm').value !== 'DELETE') return toast('Type DELETE to confirm.','err');
      toast('Account deletion needs to be finished by an administrator — we have logged your request.','err');
      back.remove();
    };
  });
}

async function render(){
  const map = isTherapist ? { membership: therapistMembership, security } : { membership, profile, privacy };
  root.innerHTML = shell(map[tab] ? map[tab]() : '<div class="skeleton" style="height:120px"></div>');
  root.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.tab; history.replaceState({},'', '#'+tab); render();
  }));

  if (tab === 'membership') document.getElementById('portal')?.addEventListener('click', e => openPortal(e.target));

  if (tab === 'security') {
    document.getElementById('pw').addEventListener('click', async () => {
      const { error } = await sb.auth.resetPasswordForEmail(a.profile.email,
        { redirectTo: location.origin + '/therapist-dashboard.html' });
      error ? toast(error.message,'err') : toast('Reset link sent to your email.','ok');
    });
    wireDelete();
  }

  if (tab === 'profile') {
    wireChips('issues'); wireChips('kinds');
    document.getElementById('pf').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('savep');
      busy(btn, true, 'Saving…');
      const { error } = await sb.from('profiles').update({
        full_name: document.getElementById('name').value.trim() || null,
        zip: document.getElementById('zip').value.trim() || null,
        issues: chipVals('issues'),
        daily_email: document.getElementById('demail').checked,
        daily_email_kinds: chipVals('kinds'),
        onboarded: true,
      }).eq('id', a.profile.id);
      busy(btn, false);
      if (error) return toast(error.message,'err');
      clearAccess(); a = await access(true);
      toast('Saved.','ok');
    });
    document.getElementById('pw').addEventListener('click', async () => {
      const { error } = await sb.auth.resetPasswordForEmail(a.profile.email,
        { redirectTo: location.origin + '/account.html' });
      error ? toast(error.message,'err') : toast('Reset link sent to your email.','ok');
    });
  }

  if (tab === 'privacy') {
    document.getElementById('vis')?.addEventListener('change', async (e) => {
      if (e.target.checked) {
        // Switching on asks for the details therapists will see, then saves both at once.
        e.target.checked = false;
        const saved = await matchDetailsModal(a.profile, { editing: matchComplete(a.profile) });
        if (!saved) return;
        clearAccess(); a = await access(true); render();
        return toast('Match Mode is on. Therapists can now reach out.','ok');
      }
      const { error } = await sb.from('profiles')
        .update({ visible_to_therapists: false }).eq('id', a.profile.id);
      if (error) { e.target.checked = true; return toast(error.message,'err'); }
      clearAccess(); a = await access(true); render();
      toast('Match Mode is off. You are hidden from therapists.','ok');
    });
    document.getElementById('vis-edit')?.addEventListener('click', async () => {
      if (await matchDetailsModal(a.profile, { editing: true })) {
        clearAccess(); a = await access(true); render(); toast('Saved.','ok');
      }
    });
    document.getElementById('export').addEventListener('click', async (e) => {
      busy(e.target, true, 'Gathering…');
      const uid = a.profile.id;
      const [j,q,w,c,m,g] = await Promise.all([
        sb.from('journal_entries').select('*').eq('user_id',uid),
        sb.from('quiz_attempts').select('*').eq('user_id',uid),
        sb.from('worksheet_responses').select('*').eq('user_id',uid),
        sb.from('user_challenges').select('*').eq('user_id',uid),
        sb.from('mood_logs').select('*').eq('user_id',uid),
        sb.from('goals').select('*').eq('user_id',uid),
      ]);
      const blob = new Blob([JSON.stringify({
        exported_at: new Date().toISOString(), profile: a.profile,
        journal: j.data, quiz_attempts: q.data, worksheets: w.data,
        challenges: c.data, mood_logs: m.data, goals: g.data,
      }, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = 'theraglee-my-data.json'; link.click();
      URL.revokeObjectURL(url);
      busy(e.target, false);
    });
    wireDelete();
  }

  if (tab === 'inbox')   inbox();
  if (tab === 'history') historyTab();
}

render();
}
</script>
</body>
</html>
