<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Therapist sign in — Theraglee</title>
<meta name="description" content="Sign in to your Theraglee practice dashboard.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main class="section">
  <div class="wrap" style="max-width:470px">
    <div class="center" style="margin-bottom:26px">
      <span class="badge">For licensed professionals</span>
      <h1 style="font-size:2rem;margin-top:14px">Welcome back</h1>
      <p class="muted">Sign in to your practice dashboard.</p>
    </div>

    <div class="card pad-lg">
      <div id="alert"></div>
      <div id="auth"><div class="skeleton" style="height:220px"></div></div>
    </div>

    <p class="center muted" style="margin-top:22px">
      New to Theraglee? <a href="therapist-signup.html">Create a therapist account</a>
    </p>
    <p class="center faint" style="margin-top:8px">
      Referrals, messages, member requests, the clinician library and your membership all live here.
    </p>
    <p class="center faint" style="margin-top:20px">
      Looking for support rather than listing a practice? <a href="login.html">Member sign in</a>
    </p>
  </div>
</main>

<script type="module">
import { chrome } from './assets/app.js';
import { authPage } from './assets/auth.js';
await chrome();
await authPage({ audience: 'therapist', mode: 'signin' });
</script>
</body>
</html>
