<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Therapist — Theraglee</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<style>
  /* The profile has the whole page to itself (chrome() is told to leave the
     feature showcase off), so everything is drawn a size up: a bigger photo,
     a taller name, roomier text and a wider contact column. */
  .hdr{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
  .photo{flex:0 0 220px;height:220px;border-radius:28px;background:var(--soft);object-fit:cover;
    display:grid;place-items:center;font-size:3.4rem;color:var(--green);font-weight:400}
  .hdr h1{margin:0;font-size:2.8rem;line-height:1.1;letter-spacing:-.02em}
  .hdr .faint{font-size:1.05rem}
  .about{font-size:1.12rem;line-height:1.7;white-space:pre-wrap}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:12px 26px;font-size:1.02rem}
  .kv dt{color:var(--faint)}
  .kv dd{margin:0;color:var(--ink-2)}
  .verified{display:inline-flex;align-items:center;gap:6px;color:var(--green);
    font-size:.95rem;font-weight:500}
  .contact-box{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r);
    padding:26px;box-shadow:var(--shadow-1);position:sticky;top:96px}
  .phone{font-size:1.4rem;font-weight:500;letter-spacing:-.02em;color:var(--ink);
    display:block;margin:6px 0 2px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:48px;align-items:start}
  @media(max-width:880px){
    .layout{grid-template-columns:1fr}.contact-box{position:static}
    .photo{flex-basis:160px;height:160px;font-size:2.6rem}
    .hdr h1{font-size:2.1rem}
  }
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .office{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .office a{display:block;aspect-ratio:4/3;border-radius:var(--r-sm);overflow:hidden;background:var(--soft)}
  .office img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .office a:hover img{transform:scale(1.03)}
</style>
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:260px"></div>
</div></main>

<script type="module">
import { chrome, sb, esc, qs, access, toast, busy, modal, FN, startSessionPayment } from './assets/app.js';
// The profile stands alone, without the feature showcase beside it, so it has
// the full width of the page.
const a = await chrome({ active:'therapists.html', showcase: false });
const root = document.getElementById('root');
const slug = qs('slug');

const { data: t } = await sb.from('therapist_directory').select('*').eq('slug', slug).maybeSingle();

if (!t) {
  root.innerHTML = `<div class="empty">That profile is not available.
    <a href="therapists.html">Back to the directory</a></div>`;
} else {
  document.title = `${t.first_name} ${t.last_name} — Theraglee`;
  // A supabase-js query only runs once something awaits it (or calls .then),
  // so the insert is settled here rather than returned as a bare builder: a
  // bare builder is never sent, and the Referrals tab stays at zero. Nothing
  // on the page depends on the result, so failures are swallowed.
  const log = (kind) => sb.from('therapist_events').insert(
    { therapist_id: t.id, event_type: kind, actor_id: a.authenticated ? a.profile.id : null })
    .then(() => {}, () => {});
  log('profile_view');

  const initials = ((t.first_name?.[0]||'') + (t.last_name?.[0]||'')).toUpperCase();
  const top = t.top_specialties || [];
  const list = (arr) => (arr||[]).length ? arr.map(esc).join(', ') : '—';
  // The optional specific ages seen, shown under the Ages seen terms.
  const ageRanges = [t.age_range_1, t.age_range_2].filter(Boolean);
  const locs = (t.locations||[]).map(l => [l.address, l.city, l.state, l.zip].filter(Boolean).join(', '));

  root.innerHTML = `
    <a class="faint" href="therapists.html">← All therapists</a>
    <div class="layout" style="margin-top:20px">
      <div>
        <div class="hdr">
          ${t.photo_url ? `<img class="photo" src="${esc(t.photo_url)}" alt="">`
                        : `<div class="photo">${initials}</div>`}
          <div style="flex:1;min-width:240px">
            <h1>${esc(t.first_name)} ${esc(t.last_name)}${t.credentials?`, ${esc(t.credentials)}`:''}</h1>
            <p class="verified" style="margin:10px 0 10px">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5"/></svg>
              License verified with the state board</p>
            <p class="faint" style="margin:0 0 14px">
              ${t.delivery==='telehealth'?'Telehealth':t.delivery==='both'?'In person &amp; telehealth':'In person'}
              ${(t.license_states||[]).length?' · Licensed in '+t.license_states.join(', '):''}</p>
            <div class="chips">${(t.top_specialties||[]).map(s=>`<span class="badge">★ ${esc(s)}</span>`).join('')}</div>
          </div>
        </div>

        ${t.bio?`<h2 style="margin-top:40px">About</h2>
          <p class="muted about">${esc(t.bio)}</p>`:''}

        ${(t.specialties||[]).length || (t.top_specialties||[]).length ? `<h2 style="margin-top:36px">Specialties</h2>
          <div class="chips">
            ${top.map(s => `<span class="badge">★ ${esc(s)}</span>`).join('')}
            ${(t.specialties||[]).filter(s => !top.includes(s)).map(s => `<span class="badge gray">${esc(s)}</span>`).join('')}
          </div>
          ${top.length ? `<p class="faint" style="margin:10px 0 0;font-size:.85rem">★ The areas ${esc(t.first_name)} focuses on most.</p>` : ''}` : ''}

        ${(t.practice_photos||[]).length ? `<h2 style="margin-top:36px">The office</h2>
          <div class="office">${t.practice_photos.map(u =>
            `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Office photo" loading="lazy"></a>`).join('')}</div>` : ''}

        <h2 style="margin-top:32px">Practice details</h2>
        <dl class="kv">
          <dt>Treatment Modalities</dt><dd>${list(t.treatment_modalities)}</dd>
          <dt>Insurance</dt><dd>${list(t.insurances)}</dd>
          <dt>Fees</dt><dd>${esc(t.fees||'—')}</dd>
          <dt>Payment</dt><dd>${list(t.payment_methods)}</dd>
          <dt>Sees</dt><dd>${list(t.participants)}</dd>
          <dt>Ages seen</dt><dd>${list(t.age_ranges)}</dd>
          ${ageRanges.length ? `<dt>Age ranges</dt><dd>${ageRanges.map(esc).join(', ')}</dd>` : ''}
          <dt>Languages</dt><dd>${list(t.languages)}</dd>
          ${t.education_school || t.education_degree || t.education_year ? `
          <dt>School</dt><dd>${esc(t.education_school||'—')}</dd>
          <dt>Degree/Diploma</dt><dd>${esc(t.education_degree||'—')}</dd>
          <dt>Year graduated</dt><dd>${esc(t.education_year||'—')}</dd>`
          : `<dt>Education</dt><dd>${esc(t.education||'—')}</dd>`}
          ${locs.length?`<dt>Office location(s)</dt><dd>${locs.map(esc).join('<br>')}</dd>`:''}
        </dl>
      </div>

      <aside class="contact-box">
        <span class="label faint" style="font-size:.72rem;text-transform:uppercase;letter-spacing:.1em">
          Contact</span>
        ${t.tracking_phone ? `
          <a class="phone" href="tel:${esc(t.tracking_phone.replace(/[^0-9+]/g,''))}" id="call">
            ${esc(t.tracking_phone)}</a>
          <p class="faint" style="margin:0 0 14px">Connects you straight through</p>` : ''}
        <div class="stack">
          ${t.accepts_messages ? `<button class="btn block" id="email">Send a message</button>` : ''}
          ${t.accepts_payments && t.session_fee_cents
            ? `<button class="btn ghost block" id="pay">Pay for a session · $${(t.session_fee_cents/100).toFixed(0)}</button>` : ''}
          ${t.website ? `<button class="btn ghost block" id="site">Visit website</button>` : ''}
          <button class="btn ghost block" id="share">Share this profile</button>
        </div>
        ${t.accepts_payments && t.session_fee_cents ? `
        <p class="faint" style="margin:12px 0 0;font-size:.8rem">
          Payment goes to ${esc(t.first_name)} through Stripe. Book the time with them directly.</p>` : ''}
        <p class="faint" style="margin:16px 0 0;font-size:.8rem">
          Messages go through Theraglee: you write from here, and their reply comes to your
          Theraglee inbox. Neither of you sees the other's email address or direct line until
          you choose to share them.</p>
      </aside>
    </div>`;

  document.getElementById('call')?.addEventListener('click', () => log('call'));
  document.getElementById('pay')?.addEventListener('click', (e) => {
    log('payment_started');
    startSessionPayment(t.id, e.target);
  });
  if (qs('payment') === 'success') {
    toast(`Payment sent to ${t.first_name}. They will be in touch to arrange the session.`, 'ok');
    history.replaceState({}, '', `therapist.html?slug=${encodeURIComponent(slug)}`);
  } else if (qs('payment') === 'canceled') {
    toast('Payment canceled — nothing was charged.');
    history.replaceState({}, '', `therapist.html?slug=${encodeURIComponent(slug)}`);
  }
  document.getElementById('site')?.addEventListener('click', () => {
    log('website_click');
    const u = /^https?:/i.test(t.website) ? t.website : 'https://' + t.website;
    window.open(u, '_blank', 'noopener');
  });
  document.getElementById('share')?.addEventListener('click', async () => {
    log('share');
    const url = location.href;
    if (navigator.share) { try { await navigator.share({ title: document.title, url }); return; } catch {} }
    await navigator.clipboard.writeText(url); toast('Link copied.','ok');
  });

  // "Send a message": the message goes to the therapist's Theraglee inbox and
  // their reply comes back to the member's, so the sender has to be signed
  // in. A visitor without an account is shown the way in and brought back here.
  document.getElementById('email')?.addEventListener('click', () => {
    if (!a.authenticated) {
      const here = encodeURIComponent(`therapist.html?slug=${slug}`);
      const back = modal(`
        <h2 style="margin-bottom:4px">Message ${esc(t.first_name)}</h2>
        <p class="muted" style="font-size:.92rem">Messages on Theraglee stay on Theraglee: you
          write from here, and ${esc(t.first_name)}'s reply comes to your Theraglee inbox, not
          your email. Sign in, or create a free account, and you will be brought straight back
          to this page.</p>
        <div class="row" style="margin-top:18px;justify-content:flex-end">
          <button type="button" class="btn ghost" id="cancel">Not now</button>
          <a class="btn ghost" href="signup.html?next=${here}">Create a free account</a>
          <a class="btn" href="login.html?next=${here}">Sign in</a>
        </div>`);
      back.querySelector('#cancel').onclick = () => back.remove();
      return;
    }
    const me = a.profile || {};
    const back = modal(`
      <h2 style="margin-bottom:4px">Message ${esc(t.first_name)}</h2>
      <p class="muted" style="font-size:.92rem">${esc(t.first_name)} reads this in their Theraglee
        inbox and replies to yours: the <strong>Messages</strong> tab on your dashboard. Neither of
        you sees the other's email address.</p>
      <form id="cform" style="margin-top:18px">
        <input class="hp" type="text" id="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="field"><label for="cn">Your name *</label>
          <input id="cn" required autocomplete="name" value="${esc(me.full_name||'')}">
          <div class="help">The name ${esc(t.first_name)} will know you by.</div></div>
        <div class="field"><label for="cp">Phone <span class="faint">(optional)</span></label>
          <input id="cp" type="tel" autocomplete="tel">
          <div class="help">Only if you would like them to be able to call you.</div></div>
        <div class="field"><label for="ct">Best times to reach you <span class="faint">(optional)</span></label>
          <input id="ct" placeholder="e.g. weekday evenings"></div>
        <div class="field"><label for="cm">Your message *</label>
          <textarea id="cm" required placeholder="What are you looking for help with? Anything you'd like them to know?"></textarea></div>
        <div class="row" style="justify-content:flex-end">
          <button type="button" class="btn ghost" id="cancel">Cancel</button>
          <button type="submit" class="btn" id="send">Send message</button>
        </div>
      </form>`);

    back.querySelector('#cancel').onclick = () => back.remove();
    back.querySelector('#cform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = back.querySelector('#send');
      const V = id => back.querySelector('#'+id).value.trim();
      if (V('cn').length < 2) return toast('Please enter your name.','err');
      if (V('cm').length < 10) return toast('Please write a little more.','err');
      busy(btn, true, 'Sending…');
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session?.access_token) {
          busy(btn, false);
          return toast('Your sign-in has expired. Please sign in again.','err');
        }
        const res = await fetch(`${FN}/contact-therapist`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({
            therapist_slug: slug, sender_name: V('cn'),
            sender_phone: V('cp'), preferred_times: V('ct'), message: V('cm'),
            company: V('company'),
          }),
        });
        const out = await res.json();
        busy(btn, false);
        if (!res.ok || out.error) return toast(out.message || 'Could not send that.','err');
        back.querySelector('.modal').innerHTML = `
          <div class="center">
            <span class="badge">Message sent</span>
            <h2 style="margin-top:14px">On its way to ${esc(t.first_name)}</h2>
            <p class="muted">${esc(out.message||'')}</p>
            <div class="row" style="justify-content:center">
              <a class="btn ghost" href="dashboard.html#messages">Open my messages</a>
              <button class="btn" id="done">Close</button>
            </div>
          </div>`;
        back.querySelector('#done').onclick = () => back.remove();
      } catch {
        busy(btn, false);
        toast('Could not reach the messaging service.','err');
      }
    });
  });
}
</script>
</body>
</html>
