<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discover — Theraglee</title>
<meta name="description" content="100 free interactive tools for noticing more about your own mental health: anxiety, worry, racing thoughts, low mood, relationships, sleep and more. No account needed.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/discover.css">
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:220px"></div>
</div></main>

<script type="module">
import { chrome, esc, qs, logActivity, toast } from './assets/app.js';
import { library, isFavorite, isLater, favButton, laterButton, statusBadge,
         bindLibrary, setProgress, signupHref, progressOf as memberProgress } from './assets/library.js';
import { TOOLS, TOPICS } from './assets/discover-tools.js';
import { mount, loadState, saveState, clearState, progressOf, KIND_LABEL } from './assets/discover.js';

const a = await chrome({ active: 'explore.html' });
const root = document.getElementById('root');
const slug = qs('slug');
const lib = await library();

/* Local (browser-only) status for anyone, member or not. Members also get the
   database-backed status via library.js, which is what the dashboard shows. */
function localStatus(tool) {
  const s = loadState(tool.slug);
  if (s.finished) return 'completed';
  const p = progressOf(tool, s);
  return p.answered > 0 ? 'started' : 'not_started';
}
const localBadge = (st) => st === 'completed' ? '<span class="badge done">Completed</span>'
  : st === 'started' ? '<span class="badge gray">In progress</span>' : '';

/* Already on the member's dashboard: started or completed there. */
const onDashboard = (tool) => {
  const p = lib.authenticated ? memberProgress(lib, 'discover', tool.id) : null;
  return !!p && p.status !== 'not_started';
};
const dashboardButton = (on) => `<button type="button" class="btn ghost sm later-btn${on ? ' on' : ''}"
  data-dash="1" aria-pressed="${on ? 'true' : 'false'}" ${on ? 'disabled' : ''}>${on ? 'On your dashboard' : 'Save to my dashboard'}</button>`;

if (!slug) {
  paintIndex();
} else {
  const tool = TOOLS.find(t => t.slug === slug);
  if (!tool) {
    document.title = 'Not found — Theraglee';
    root.innerHTML = '<div class="empty">That tool could not be found. <a href="discover.html">See all 100 tools</a></div>';
  } else {
    paintTool(tool);
  }
}

/* ------------------------------------------------------------------ index */
function paintIndex() {
  document.title = 'Discover — 100 free tools — Theraglee';
  let topic = qs('topic', ''), term = '';
  root.classList.remove('narrow');
  root.innerHTML = `
    <div class="d-hero">
      <span class="badge live">Free for everyone · no account needed</span>
      <h1 style="margin-top:14px">Discover more about <em class="script">how you work</em></h1>
      <p class="muted" style="max-width:60ch">One hundred short, interactive tools for noticing your own patterns:
        anxiety, worry, racing thoughts, low mood, relationships, sleep, and more. Each one takes a few
        minutes. None of them diagnoses or treats anything; they help you see what is already there.</p>
      <p class="faint" style="max-width:60ch">${a.authenticated
        ? 'Your favorites, saved-for-later list and completed tools show up on your dashboard.'
        : 'Your answers are kept in this browser only. <a href="login.html?mode=signup">Join free</a> to favorite tools, save them for later, and see what you have completed on your dashboard.'}</p>
    </div>
    <div class="card" style="margin:26px 0">
      <div class="field" style="margin-bottom:14px">
        <label for="q">Search</label>
        <input id="q" type="text" placeholder="Try “sleep”, “boundaries”, “anger”…">
      </div>
      <div class="chips" id="topics">
        <button class="chip ${topic ? '' : 'on'}" data-t="">All topics</button>
        ${TOPICS.map(t => `<button class="chip ${topic === t ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}
      </div>
    </div>
    <p class="faint" id="count"></p>
    <div class="grid g3" id="results"></div>
    <div class="notice warn" style="margin-top:34px">These tools are for self-reflection. They cannot identify any condition,
      and they are not a substitute for care from a licensed professional. If you are in crisis, call or text
      <a href="tel:988">988</a>.</div>`;

  function render() {
    const t = term.trim().toLowerCase();
    const list = TOOLS.filter(r => (!topic || r.topic === topic) &&
      (!t || (r.title + ' ' + r.description + ' ' + r.topic + ' ' + r.tags.join(' ') + ' ' + KIND_LABEL[r.kind]).toLowerCase().includes(t)));
    document.getElementById('count').textContent =
      `${list.length} tool${list.length === 1 ? '' : 's'}${topic ? ` about ${topic.toLowerCase()}` : ''}`;
    document.getElementById('results').innerHTML = list.length ? list.map(r => {
      const p = lib.authenticated ? memberProgress(lib, 'discover', r.id) : null;
      const badge = p ? statusBadge(p) : localBadge(localStatus(r));
      return `<a class="tile" href="discover.html?slug=${encodeURIComponent(r.slug)}">
        ${favButton('discover', r.id, isFavorite(lib, 'discover', r.id), { size: 20, label: false })}
        <h3>${esc(r.title)}</h3>
        <p class="meta" style="color:var(--muted)">${esc(r.description.slice(0, 120))}${r.description.length > 120 ? '…' : ''}</p>
        <span class="meta">${esc(KIND_LABEL[r.kind])} · ${esc(r.topic)} · ${r.minutes} min</span>
        <div class="row" style="gap:7px;margin-top:2px">${badge}${lib.authenticated && isLater(lib, 'discover', r.id) ? '<span class="badge gray">Saved for later</span>' : ''}</div>
      </a>`;
    }).join('') : '<div class="empty" style="grid-column:1/-1">Nothing matches that yet. Try a different word.</div>';
  }
  document.getElementById('q').addEventListener('input', e => { term = e.target.value; render(); });
  document.querySelectorAll('#topics .chip').forEach(c => c.addEventListener('click', () => {
    document.querySelectorAll('#topics .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on'); topic = c.dataset.t;
    history.replaceState(null, '', topic ? `discover.html?topic=${encodeURIComponent(topic)}` : 'discover.html');
    render();
  }));
  bindLibrary(document.getElementById('results'), () => render());
  render();
}

/* ------------------------------------------------------------------- tool */
function paintTool(tool) {
  document.title = tool.title + ' — Theraglee';
  root.classList.add('narrow');
  logActivity('discover', tool.id, 'view', tool.tags || []);

  const related = TOOLS.filter(t => t.topic === tool.topic && t.slug !== tool.slug).slice(0, 3);
  root.innerHTML = `
    <a class="faint no-print" href="discover.html?topic=${encodeURIComponent(tool.topic)}">← ${esc(tool.topic)} tools</a>
    <div class="row" style="gap:8px;margin-top:14px">
      <span class="badge">${esc(KIND_LABEL[tool.kind])}</span>
      <span class="badge gray">${tool.minutes} min</span>
      <span class="badge gray">Free for everyone</span>
    </div>
    <h1 style="margin-top:12px">${esc(tool.title)}</h1>
    <p class="muted">${esc(tool.description)}</p>
    <div class="row no-print" id="libbar" style="margin-top:14px">
      ${favButton('discover', tool.id, isFavorite(lib, 'discover', tool.id))}
      ${laterButton('discover', tool.id, isLater(lib, 'discover', tool.id))}
      ${dashboardButton(onDashboard(tool))}
      <span id="statuspill">${lib.authenticated ? statusBadge(memberProgress(lib, 'discover', tool.id)) : ''}</span>
    </div>
    ${lib.authenticated ? '' : `<div class="notice no-print" style="margin-top:14px">Your answers stay in this browser. Favorite this tool, save it for later, or save it to a dashboard by <a href="${signupHref('save')}">creating a free account</a>. No card, no cost.</div>`}
    <div class="notice warn no-print" style="margin:16px 0 22px">A self-reflection tool, not a diagnosis. It cannot identify any condition.
      If anything here worries you, please talk with a licensed professional.</div>
    <div id="tool"></div>
    ${related.length ? `<div class="no-print" style="margin-top:44px"><h2 style="font-size:1.3rem">More about ${esc(tool.topic.toLowerCase())}</h2>
      <div class="grid g3">${related.map(r => `<a class="tile" href="discover.html?slug=${encodeURIComponent(r.slug)}">
        <h3>${esc(r.title)}</h3><span class="meta">${esc(KIND_LABEL[r.kind])} · ${r.minutes} min</span></a>`).join('')}</div></div>` : ''}`;

  bindLibrary(root);

  /* "Save to my dashboard": for a member, record the tool as picked up so it
     sits under "Picked up but not finished" on the dashboard until they finish
     it. For a visitor, the button (like favorite and save for later) goes to
     the free sign-up page and comes back here afterwards. */
  root.querySelector('[data-dash]').addEventListener('click', async (e) => {
    e.preventDefault();
    if (!lib.authenticated) { location.href = signupHref('save'); return; }
    const btn = e.currentTarget;
    btn.disabled = true;
    const p = progressOf(tool, loadState(tool.slug));
    const answered = Math.min(Math.max(1, p.answered), Math.max(1, p.total - 1));
    const row = await setProgress('discover', tool.id, answered, p.total);
    btn.disabled = false;
    if (!row) return;
    btn.outerHTML = dashboardButton(true);
    const pill = document.getElementById('statuspill');
    if (pill) pill.innerHTML = statusBadge(row);
    toast('Saved to your dashboard.', 'ok');
  });

  /* Persist: always to this browser; for members, also to item_progress so the
     dashboard can show Started / Completed alongside quizzes and worksheets. */
  let timer;
  const persist = (state, immediate = false) => {
    saveState(tool.slug, state);
    if (!lib.authenticated) return;
    clearTimeout(timer);
    const push = async () => {
      const p = progressOf(tool, state);
      const answered = state.finished ? p.total : Math.min(p.answered, Math.max(0, p.total - 1));
      const row = await setProgress('discover', tool.id, answered, p.total);
      const pill = document.getElementById('statuspill');
      if (pill && row) pill.innerHTML = statusBadge(row);
    };
    immediate ? push() : (timer = setTimeout(push, 1200));
  };

  const state = loadState(tool.slug);
  mount(document.getElementById('tool'), tool, {
    state,
    onChange: (s) => { if (!Object.keys(s).length) clearState(tool.slug); persist(s); },
    onFinish: (s) => {
      persist(s, true);
      logActivity('discover', tool.id, 'complete', tool.tags || []);
      document.getElementById('tool').scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
  });
}
</script>
</body>
</html>
