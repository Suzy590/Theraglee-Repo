<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Theraglee</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--hair);margin:24px 0 28px;overflow-x:auto}
  .tabs button{border:0;background:none;font:inherit;font-size:.95rem;padding:12px 16px;cursor:pointer;
    color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--green);border-bottom-color:var(--green);font-weight:500}
  .mfilter{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
  .mfilter input,.mfilter select{width:auto;flex:1 1 180px}
  .kvrow{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:center;margin-bottom:10px}
  code{background:var(--sand);padding:2px 6px;border-radius:5px;font-size:.86rem;
    font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<main class="section"><div class="wrap" id="root">
  <div class="skeleton" style="height:200px"></div>
</div></main>

<script type="module">
import { chrome, sb, requireAuth, esc, toast, busy, fmtDate, modal, callStripeFn } from './assets/app.js';
await chrome();
const a = await requireAuth();
if (a) {
const root = document.getElementById('root');

if (a.profile.role !== 'admin') {
  root.innerHTML = `<div class="card pad-lg center"><h2>Not available</h2>
    <p class="muted">This screen is for site administrators.</p>
    <a class="btn ghost" href="dashboard.html">Back to your dashboard</a></div>`;
} else {
let tab = location.hash.replace('#','') || 'members';

const TABS = [['members','Memberships'],['verify','License verification'],['numbers','Tracking numbers'],
              ['codes','Discount codes'],['billing','Stripe setup'],['content','Content']];

function render(body){
  root.innerHTML = `<div class="spread">
      <h1 style="margin:0">Admin</h1>
      <div class="row">
        <a class="btn sm ghost" href="dashboard.html">Member dashboard</a>
        <a class="btn sm ghost" href="therapist-dashboard.html">Practice dashboard</a>
      </div>
    </div>
    <p class="faint" style="margin:6px 0 0">Your admin account can open both dashboards: the member
      one at <code>dashboard.html</code> and the therapist one at <code>therapist-dashboard.html</code>.</p>
    <div class="tabs">${TABS.map(([k,l])=>
      `<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>
    <div id="body">${body}</div>`;
  root.querySelectorAll('.tabs [data-tab]').forEach(b => b.onclick = () => {
    tab = b.dataset.tab; history.replaceState({},'','#'+tab); route();
  });
}

/* --------------------------------------------------------- members */
// Members and therapists are separate memberships: a member pays for a tier
// (Free, Basic, Premium) and a therapist pays for a practice listing. Both are
// rows in `profiles` (the admin policy reads them all); a therapist's listing
// details come from therapist_profiles.
//
// `comped` is a complimentary membership an admin granted here, with no Stripe
// subscription behind it; the database counts it as active (sub_active()).
const LIVE_STATUSES = ['active', 'trialing', 'comped'];
const isLive = (p) => LIVE_STATUSES.includes(p.subscription_status);
const paysStripe = (p) => !!p.stripe_subscription_id && p.subscription_status !== 'comped' && isLive(p);
const statusBadge = (p) => {
  const st = p.subscription_status;
  if (!st) return '<span class="badge gray">no subscription</span>';
  const live = LIVE_STATUSES.includes(st);
  const label = st === 'comped' ? 'complimentary'
    : p.cancel_at_period_end && live ? 'canceling' : st.replace(/_/g, ' ');
  return `<span class="badge ${live ? 'live' : 'gray'}">${esc(label)}</span>`;
};
const renews = (p) => p.subscription_status === 'comped' ? 'No charge'
  : p.current_period_end ? `${p.cancel_at_period_end ? 'Ends' : 'Renews'} ${fmtDate(p.current_period_end)}` : '—';

/** Calls the admin-membership Edge Function; toasts and returns null on failure. */
async function adminCall(action, body = {}, btn = null, label = 'Working…') {
  if (btn) busy(btn, true, label);
  const out = await callStripeFn('admin-membership', { action, ...body });
  if (btn) busy(btn, false);
  if (out.error) { toast(out.message || 'That did not work.', 'err'); return null; }
  return out;
}
const planName = (tier) => ({ free: 'Free', basic: 'Basic', premium: 'Premium' })[tier] || esc(tier || '—');

let mView = 'members', mQuery = '', mStatus = 'all';

async function members(){
  render('<div class="skeleton" style="height:150px"></div>');
  const [{ data: people, error }, { data: listings }] = await Promise.all([
    sb.from('profiles').select('id,email,full_name,role,tier,stripe_subscription_id,subscription_status,current_period_end,cancel_at_period_end,created_at')
      .order('created_at', { ascending: false }),
    sb.rpc('admin_pending_therapists'),
  ]);
  if (error) return render(`<div class="notice warn">Could not load memberships: ${esc(error.message)}</div>`);

  const byUser = Object.fromEntries((listings||[]).map(t => [t.user_id, t]));
  const all = people || [];
  const memberRows = all.filter(p => p.role !== 'therapist');
  const therapistRows = all.filter(p => p.role === 'therapist');

  const stat = (n, label) => `<div class="card"><div style="font-size:1.8rem;font-weight:300;color:var(--green)">${n}</div>
    <div class="faint">${label}</div></div>`;

  const draw = () => {
    const rows = (mView === 'members' ? memberRows : therapistRows).filter(p => {
      if (mStatus === 'paying' && !isLive(p)) return false;
      if (mStatus === 'none' && isLive(p)) return false;
      if (!mQuery) return true;
      const t = byUser[p.id];
      const hay = [p.full_name, p.email, t && `${t.first_name} ${t.last_name}`].join(' ').toLowerCase();
      return hay.includes(mQuery.toLowerCase());
    });

    const memberTable = () => `<table class="data">
      <thead><tr><th>Member</th><th>Plan</th><th>Status</th><th>Billing</th><th>Joined</th><th></th></tr></thead>
      <tbody>${rows.map(p => `<tr>
        <td><strong>${esc(p.full_name || '—')}</strong>${p.role === 'admin' ? ' <span class="badge gray">admin</span>' : ''}<br>
          <span class="faint">${esc(p.email || '')}</span></td>
        <td>${planName(p.tier)}</td>
        <td>${statusBadge(p)}</td>
        <td class="faint">${renews(p)}</td>
        <td class="faint">${fmtDate(p.created_at)}</td>
        <td>${manageBtn(p)}</td>
      </tr>`).join('')}</tbody></table>`;

    const therapistTable = () => `<table class="data">
      <thead><tr><th>Therapist</th><th>Status</th><th>Billing</th><th>License</th><th>Listing</th><th>Joined</th><th></th></tr></thead>
      <tbody>${rows.map(p => { const t = byUser[p.id]; return `<tr>
        <td><strong>${esc(t ? `${t.first_name||''} ${t.last_name||''}`.trim() || p.full_name || '—' : p.full_name || '—')}</strong>${t?.credentials ? ', ' + esc(t.credentials) : ''}<br>
          <span class="faint">${esc(p.email || '')}</span></td>
        <td>${statusBadge(p)}</td>
        <td class="faint">${renews(p)}</td>
        <td>${t ? `<span class="badge ${t.verification === 'verified' ? 'live' : 'gray'}">${esc(t.verification)}</span>` : '<span class="faint">no profile yet</span>'}</td>
        <td>${t?.published
          ? (t.slug ? `<a href="therapist.html?slug=${encodeURIComponent(t.slug)}" target="_blank" rel="noopener">live ↗</a>` : 'live')
          : '<span class="faint">not listed</span>'}</td>
        <td class="faint">${fmtDate(p.created_at)}</td>
        <td>${manageBtn(p)}</td>
      </tr>`; }).join('')}</tbody></table>`;

    document.getElementById('mlist').innerHTML = rows.length
      ? `<div class="scroll-x">${mView === 'members' ? memberTable() : therapistTable()}</div>
         <p class="faint" style="margin-top:10px">Showing ${rows.length} of ${(mView === 'members' ? memberRows : therapistRows).length}.</p>`
      : '<div class="empty">Nobody matches.</div>';
    document.querySelectorAll('[data-manage]').forEach(b => b.onclick = () =>
      manage(all.find(p => p.id === b.dataset.manage), byUser[b.dataset.manage]));
  };

  render(`
    <div class="spread">
      <h2 style="margin:0">Memberships</h2>
      <button class="btn sm" id="addmember">Add a member or therapist</button>
    </div>
    <p class="muted" style="max-width:64ch">Everyone with an account, split into the two kinds of
      membership: <strong>members</strong>, who use the site for themselves, and
      <strong>therapists</strong>, who pay for a practice listing. Use <strong>Manage</strong> on a
      row to change someone's plan, end their membership, or apply a discount code.</p>

    <div class="grid g4" style="margin-top:18px">
      ${stat(memberRows.length, 'members')}
      ${stat(memberRows.filter(isLive).length, 'members on Basic or Premium')}
      ${stat(therapistRows.length, 'therapists')}
      ${stat(therapistRows.filter(isLive).length, 'active therapist memberships')}
    </div>

    <div class="tabs" style="margin:28px 0 0">
      <button data-mview="members" class="${mView==='members'?'on':''}">Members (${memberRows.length})</button>
      <button data-mview="therapists" class="${mView==='therapists'?'on':''}">Therapists (${therapistRows.length})</button>
    </div>
    <div class="mfilter">
      <input id="mq" type="search" placeholder="Search by name or email" value="${esc(mQuery)}" aria-label="Search">
      <select id="ms" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option value="paying">Active (paid, trial or complimentary)</option>
        <option value="none">No active membership</option>
      </select>
    </div>
    <div id="mlist"></div>`);

  document.getElementById('ms').value = mStatus;
  document.getElementById('addmember').onclick = addMember;
  document.querySelectorAll('[data-mview]').forEach(b => b.onclick = () => {
    mView = b.dataset.mview;
    document.querySelectorAll('[data-mview]').forEach(x => x.classList.toggle('on', x === b));
    draw();
  });
  document.getElementById('mq').oninput = (e) => { mQuery = e.target.value.trim(); draw(); };
  document.getElementById('ms').onchange = (e) => { mStatus = e.target.value; draw(); };
  draw();
}

const manageBtn = (p) => p.role === 'admin' ? ''
  : `<button class="btn sm ghost" data-manage="${p.id}">Manage</button>`;

/** The Manage window for one account: change plan, end, resume, discount. */
async function manage(p, listing){
  const therapist = p.role === 'therapist';
  const stripe = paysStripe(p);
  const comped = p.subscription_status === 'comped';
  const name = listing ? `${listing.first_name||''} ${listing.last_name||''}`.trim() : '';
  const { data: codes } = stripe
    ? await sb.from('discount_codes').select('id,code,percent_off,amount_off_cents,audience,active,expires_at')
        .eq('active', true).order('created_at', { ascending: false })
    : { data: [] };
  const usable = (codes||[]).filter(c => (c.audience === 'all' || c.audience === (therapist ? 'therapist' : 'member'))
    && (!c.expires_at || new Date(c.expires_at) > new Date()));

  const now = therapist ? (isLive(p) ? 'Therapist membership' : 'No membership')
    : (isLive(p) ? planName(p.tier) : 'Free');

  const back = modal(`
    <h2 style="margin-bottom:4px">${esc(name || p.full_name || p.email || 'Account')}</h2>
    <p class="faint" style="margin:0 0 14px">${esc(p.email||'')} · ${therapist ? 'Therapist' : 'Member'} account</p>
    <p style="margin:0 0 18px">Now: <strong>${esc(now)}</strong> ${statusBadge(p)}
      <span class="faint">${esc(renews(p))}</span></p>

    <h3 style="margin:0 0 6px">Change plan</h3>
    <p class="muted" style="font-size:.9rem;margin:0 0 10px">${stripe
      ? 'They pay through Stripe, so their subscription moves to the new price. Stripe charges or credits the difference on their next bill.'
      : 'They have no paid subscription, so this gives them the plan <strong>free of charge</strong> (complimentary) until you end it. No card is needed.'}</p>
    <div class="row">
      ${therapist ? '<input type="hidden" id="mp" value="therapist"><span>Therapist membership</span>'
        : `<select id="mp" style="width:auto"><option value="basic">Basic</option><option value="premium">Premium</option></select>`}
      ${stripe ? `<select id="mi" style="width:auto"><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select>` : ''}
      <button class="btn sm" id="mchange">${stripe ? 'Switch plan' : 'Give this plan free'}</button>
    </div>

    <h3 style="margin:22px 0 6px">End membership</h3>
    ${stripe ? `
      <p class="muted" style="font-size:.9rem;margin:0 0 10px">Stops their Stripe subscription. Ending now
        takes access away at once and does not refund the current period.${therapist ? ' Their listing comes down.' : ''}</p>
      <div class="row">
        ${p.cancel_at_period_end
          ? `<button class="btn sm ghost" id="mresume">Keep it going (undo the scheduled end)</button>`
          : `<button class="btn sm ghost" id="mendlater">End when the current period is over</button>`}
        <button class="btn sm danger" id="mendnow">End now</button>
      </div>`
    : comped ? `
      <p class="muted" style="font-size:.9rem;margin:0 0 10px">Ends the complimentary membership at once.
        ${therapist ? 'Their listing comes down.' : 'They go back to the Free plan.'}</p>
      <button class="btn sm danger" id="mendnow">End complimentary membership</button>`
    : '<p class="faint" style="margin:0">There is no active membership to end.</p>'}

    <h3 style="margin:22px 0 6px">Discount</h3>
    ${stripe ? (usable.length ? `
      <p class="muted" style="font-size:.9rem;margin:0 0 10px">Puts a code on their subscription. It replaces
        any discount they already have.</p>
      <div class="row">
        <select id="mcode" style="width:auto">${usable.map(c =>
          `<option value="${c.id}">${esc(c.code)} — ${esc(codeOff(c))}</option>`).join('')}</select>
        <button class="btn sm" id="mapply">Apply code</button>
      </div>`
      : '<p class="faint" style="margin:0">No active codes fit this account. Make one on the Discount codes tab.</p>')
    : `<p class="faint" style="margin:0">Codes discount a paid subscription. This account has none, so give
        them a code to enter on the checkout page when they sign up for a plan.</p>`}

    <div class="row" style="justify-content:flex-end;margin-top:22px">
      <button class="btn ghost" id="mclose">Close</button></div>`);

  const done = (msg) => { back.remove(); toast(msg, 'ok'); members(); };
  back.querySelector('#mclose').onclick = () => back.remove();
  if (!therapist && ['basic','premium'].includes(p.tier)) back.querySelector('#mp').value = p.tier === 'basic' ? 'premium' : 'basic';

  back.querySelector('#mchange').onclick = async (e) => {
    const plan = back.querySelector('#mp').value;
    const interval = back.querySelector('#mi')?.value || 'monthly';
    const out = await adminCall('change_plan', { user_id: p.id, plan, interval }, e.target, 'Saving…');
    if (out) done(out.unchanged ? 'They are already on that plan.' : out.complimentary ? 'Plan given free of charge.' : 'Plan switched in Stripe.');
  };
  back.querySelector('#mendnow')?.addEventListener('click', async (e) => {
    if (!confirm('End this membership now? Access stops straight away.')) return;
    if (await adminCall('end', { user_id: p.id, when: 'now' }, e.target, 'Ending…')) done('Membership ended.');
  });
  back.querySelector('#mendlater')?.addEventListener('click', async (e) => {
    if (await adminCall('end', { user_id: p.id, when: 'period_end' }, e.target, 'Scheduling…'))
      done('It will end when the current period is over.');
  });
  back.querySelector('#mresume')?.addEventListener('click', async (e) => {
    if (await adminCall('resume', { user_id: p.id }, e.target, 'Saving…')) done('The membership will keep renewing.');
  });
  back.querySelector('#mapply')?.addEventListener('click', async (e) => {
    const code_id = back.querySelector('#mcode').value;
    if (await adminCall('apply_code', { user_id: p.id, code_id }, e.target, 'Applying…')) done('Discount applied.');
  });
}

/** The Add window: invite someone by email, optionally on a free plan. */
function addMember(){
  const back = modal(`
    <h2>Add a member or therapist</h2>
    <p class="muted" style="font-size:.92rem">They get an email invitation with a link that signs them in.</p>
    <div class="field"><label for="ae">Email</label><input id="ae" type="email" autocomplete="off"></div>
    <div class="field"><label for="an">Full name <span class="faint">(optional)</span></label><input id="an"></div>
    <div class="field"><label for="at">Account type</label>
      <select id="at"><option value="member">Member</option><option value="therapist">Therapist</option></select></div>
    <div class="field"><label for="ap">Membership</label><select id="ap"></select>
      <p class="faint" style="margin:6px 0 0;font-size:.86rem">A plan picked here is complimentary: no card
        and no charge until you end it. To have them pay, leave it off and they choose a plan themselves.</p></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" id="acancel">Cancel</button>
      <button class="btn" id="asend">Send invitation</button></div>`);
  const plans = () => {
    back.querySelector('#ap').innerHTML = back.querySelector('#at').value === 'therapist'
      ? '<option value="none">None yet — they start it themselves</option><option value="therapist">Therapist membership, free</option>'
      : '<option value="free">Free</option><option value="basic">Basic, free of charge</option><option value="premium">Premium, free of charge</option>';
  };
  plans();
  back.querySelector('#at').onchange = plans;
  back.querySelector('#acancel').onclick = () => back.remove();
  back.querySelector('#asend').onclick = async (e) => {
    const out = await adminCall('add', {
      email: back.querySelector('#ae').value.trim(),
      full_name: back.querySelector('#an').value.trim(),
      type: back.querySelector('#at').value,
      plan: back.querySelector('#ap').value,
    }, e.target, 'Sending…');
    if (!out) return;
    mView = back.querySelector('#at').value === 'therapist' ? 'therapists' : 'members';
    back.remove(); toast('Invitation sent.', 'ok');
    members();
  };
}

/* ----------------------------------------------------------- codes */
const money = (cents) => '$' + (cents / 100).toFixed(cents % 100 ? 2 : 0);
const codeOff = (c) => c.percent_off ? `${c.percent_off}% off` : `${money(c.amount_off_cents)} off`;
const codeLasts = (c) => c.duration === 'once' ? 'first payment'
  : c.duration === 'forever' ? 'every payment'
  : `${c.duration_in_months} month${c.duration_in_months === 1 ? '' : 's'}`;
const codeFor = (c) => ({ all: 'Everyone', member: 'Members', therapist: 'Therapists' })[c.audience] || c.audience;

async function codes(){
  render('<div class="skeleton" style="height:150px"></div>');
  const out = await callStripeFn('admin-membership', { action: 'list_codes' });
  const list = out.codes || [];

  render(`
    <h2>Discount codes</h2>
    <p class="muted" style="max-width:64ch">Make a code, then either share it — people type it on the
      checkout page, or on their account page if they already pay — or apply it for them from
      <strong>Memberships → Manage</strong>. Codes are created in Stripe, which tracks every use.</p>
    ${out.error ? `<div class="notice warn" style="margin:14px 0">${esc(out.message || 'Could not load the codes.')}</div>` : ''}

    <div class="card" style="margin-top:18px">
      <h3 style="margin-top:0">New code</h3>
      <div class="kvrow"><label for="cc" style="margin:0">Code</label>
        <div class="row" style="flex-wrap:nowrap"><input id="cc" placeholder="e.g. WELCOME20" maxlength="30"
          style="text-transform:uppercase"><button class="btn sm ghost" id="cgen" type="button" style="white-space:nowrap">Make one up</button></div></div>
      <div class="kvrow"><label for="ck" style="margin:0">Discount</label>
        <div class="row" style="flex-wrap:nowrap">
          <select id="ck" style="width:auto"><option value="percent">Percent off</option><option value="amount">Dollars off</option></select>
          <input id="cv" type="number" min="1" step="1" placeholder="20" style="max-width:120px"></div></div>
      <div class="kvrow"><label for="cd" style="margin:0">How long it lasts</label>
        <div class="row" style="flex-wrap:nowrap">
          <select id="cd" style="width:auto"><option value="once">First payment only</option>
            <option value="repeating">A number of months</option><option value="forever">Every payment, for good</option></select>
          <input id="cm" type="number" min="1" max="36" placeholder="months" style="max-width:110px;display:none"></div></div>
      <div class="kvrow"><label for="ca" style="margin:0">Who can use it</label>
        <select id="ca"><option value="all">Members and therapists</option><option value="member">Members only</option>
          <option value="therapist">Therapists only</option></select></div>
      <div class="kvrow"><label for="cx" style="margin:0">Most uses <span class="faint">(blank = no limit)</span></label>
        <input id="cx" type="number" min="1" step="1"></div>
      <div class="kvrow"><label for="ce" style="margin:0">Last day to use it <span class="faint">(optional)</span></label>
        <input id="ce" type="date"></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="ccreate">Create code</button></div>
    </div>

    <h3 style="margin-top:30px">Your codes</h3>
    ${list.length ? `<div class="scroll-x"><table class="data">
      <thead><tr><th>Code</th><th>Discount</th><th>Lasts</th><th>For</th><th>Used</th><th>Last day</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.map(c => {
        const expired = c.expires_at && new Date(c.expires_at) < new Date();
        return `<tr>
        <td><code>${esc(c.code)}</code> <button class="btn sm ghost" data-copy="${esc(c.code)}">Copy</button></td>
        <td>${esc(codeOff(c))}</td>
        <td class="faint">${esc(codeLasts(c))}</td>
        <td class="faint">${esc(codeFor(c))}</td>
        <td class="faint">${c.times_redeemed ?? '—'}${c.max_redemptions ? ' of ' + c.max_redemptions : ''}</td>
        <td class="faint">${c.expires_at ? fmtDate(c.expires_at) : '—'}</td>
        <td>${c.active && !expired ? '<span class="badge live">active</span>'
          : `<span class="badge gray">${expired ? 'expired' : 'ended'}</span>`}</td>
        <td>${c.active && !expired ? `<button class="btn sm ghost" data-endcode="${c.id}">End</button>` : ''}</td>
      </tr>`; }).join('')}</tbody></table></div>`
    : '<div class="empty">No codes yet.</div>'}`);

  const kind = document.getElementById('ck'), val = document.getElementById('cv');
  kind.onchange = () => { val.step = kind.value === 'amount' ? '0.01' : '1'; val.placeholder = kind.value === 'amount' ? '5.00' : '20'; };
  const dur = document.getElementById('cd');
  dur.onchange = () => { document.getElementById('cm').style.display = dur.value === 'repeating' ? '' : 'none'; };
  document.getElementById('cgen').onclick = () => {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const bytes = crypto.getRandomValues(new Uint8Array(8));
    document.getElementById('cc').value = [...bytes].map(b => abc[b % abc.length]).join('');
  };
  document.getElementById('ccreate').onclick = async (e) => {
    const res = await adminCall('create_code', {
      code: document.getElementById('cc').value, kind: kind.value, value: val.value,
      duration: dur.value, months: document.getElementById('cm').value,
      audience: document.getElementById('ca').value,
      max_redemptions: document.getElementById('cx').value, expires_on: document.getElementById('ce').value,
    }, e.target, 'Creating…');
    if (res) { toast(`Code ${res.code.code} is ready.`, 'ok'); codes(); }
  };
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); toast('Copied.', 'ok'); }
    catch { toast('Copy did not work — select the code instead.', 'err'); }
  });
  document.querySelectorAll('[data-endcode]').forEach(b => b.onclick = async () => {
    if (!confirm('End this code? Nobody will be able to use it again. Discounts already given stay.')) return;
    if (await adminCall('end_code', { code_id: b.dataset.endcode }, b, 'Ending…')) { toast('Code ended.', 'ok'); codes(); }
  });
}

/* ---------------------------------------------------------- verify */
async function verify(){
  render('<div class="skeleton" style="height:150px"></div>');
  const [{ data: rows }, { data: boards }] = await Promise.all([
    sb.rpc('admin_pending_therapists'),
    sb.from('state_boards').select('*'),
  ]);
  // Psychologists are licensed by a separate board in some states; those
  // states have a `psychology` row. Everyone else, and psychologists in the
  // states whose lookup is statewide, use the `behavioral_health` row.
  const PSYCH_TYPES = ['PsyD', 'PhD', 'EdD'];
  const boardFor = (st, licenseType) => {
    const row = (p) => (boards||[]).find(b => b.state === st && b.profession === p);
    return (PSYCH_TYPES.includes(licenseType) && row('psychology')) || row('behavioral_health');
  };

  const lookupUrl = (t) => {
    const st = (t.license_states||[])[0] || '';
    const b = boardFor(st, t.license_type);
    return b?.verify_url
      || `https://www.google.com/search?q=${encodeURIComponent(st + ' board behavioral health license verification ' + (t.license_type||''))}`;
  };

  render(`
    <h2>License verification queue</h2>
    <p class="muted" style="max-width:64ch">Confirm each license against the state board before
      approving. A listing cannot appear in the directory until it is verified <em>and</em> the
      membership is active — so approving here does not publish anything on its own.</p>

    ${(rows||[]).length ? (rows||[]).map(t=>{
      const st = (t.license_states||[])[0] || '—';
      const b = boardFor(st, t.license_type);
      return `<div class="card" style="margin-top:14px">
        <div class="spread">
          <div>
            <h3 style="margin:0">${esc(t.first_name)} ${esc(t.last_name)}${t.credentials?', '+esc(t.credentials):''}</h3>
            <p class="faint" style="margin:4px 0">
              License <code>${esc(t.license_number||'—')}</code>
              ${t.license_type?`(${esc(t.license_type)})`:''}
              in ${esc((t.license_states||[]).join(', ')||'—')}
              · joined ${fmtDate(t.created_at)}</p>
            <p class="faint" style="margin:0">
              ${b ? esc(b.board_name) : `No board on file for ${esc(st)}`}
              · <a href="${esc(lookupUrl(t))}" target="_blank" rel="noopener">Open the board lookup ↗</a></p>
          </div>
          <span class="badge ${t.verification==='verified'?'':'gray'}">
            ${esc(t.verification)}${t.identity_status && t.identity_status!=='unverified'
              ? ' · ID ' + esc(t.identity_status.replace('_',' ')) : ''}${t.published?' · live':''}</span>
        </div>
        ${t.bio?`<p class="muted" style="font-size:.92rem;margin-top:10px">${esc(String(t.bio).slice(0,240))}</p>`:''}
        <p class="faint" style="margin:8px 0">Private contact: ${esc(t.contact_email||'—')}
          · ${esc(t.contact_phone||'—')}
          ${t.website?` · <a href="${esc(t.website)}" target="_blank" rel="noopener">website ↗</a>`:''}</p>
        <div class="row">
          <button class="btn sm" data-ok="${t.id}">Record as verified</button>
          <button class="btn sm danger" data-no="${t.id}">Reject</button>
        </div>
      </div>`;
    }).join('') : '<div class="empty" style="margin-top:18px">No therapist profiles yet.</div>'}`);

  document.querySelectorAll('[data-ok]').forEach(btn => btn.onclick = () => {
    const t = rows.find(r => r.id === btn.dataset.ok);
    const back = modal(`
      <h2>Record a verified license</h2>
      <p class="muted" style="font-size:.92rem">Copy what the board actually shows. This is kept
        as the audit record behind the “verified” badge on their profile.</p>
      <div class="field"><label for="vn">Name exactly as the board shows it</label>
        <input id="vn" value="${esc(t.first_name+' '+t.last_name)}"></div>
      <div class="field"><label for="vs">License status on the board</label>
        <input id="vs" placeholder="e.g. Clear" value="Clear"></div>
      <div class="field"><label for="ve">Expiry date</label><input id="ve" type="date"></div>
      <div class="field"><label style="display:flex;gap:10px;align-items:center">
        <input type="checkbox" id="vd" style="width:18px;height:18px;accent-color:var(--green)">
        <span>Disciplinary action on record</span></label></div>
      <div class="field"><label for="vnote">Notes <span class="faint">(optional)</span></label>
        <input id="vnote"></div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn ghost" id="cancel">Cancel</button>
        <button class="btn" id="confirm">Record as verified</button></div>`);
    back.querySelector('#cancel').onclick = () => back.remove();
    back.querySelector('#confirm').onclick = async (e) => {
      const disc = back.querySelector('#vd').checked;
      busy(e.target, true, 'Recording…');
      const { error } = await sb.rpc('record_license_check', {
        p_therapist_id: t.id,
        p_status: disc ? 'needs_review' : 'verified',
        p_method: 'manual',
        p_licensee_name: back.querySelector('#vn').value.trim() || null,
        p_license_status: back.querySelector('#vs').value.trim() || null,
        p_expires_on: back.querySelector('#ve').value || null,
        p_disciplinary: disc,
        p_board_name: boardFor((t.license_states||[])[0], t.license_type)?.board_name || null,
        p_source_url: lookupUrl(t),
        p_notes: back.querySelector('#vnote').value.trim() || null,
      });
      busy(e.target, false);
      if (error) return toast(error.message,'err');
      back.remove();
      toast(disc ? 'Flagged for review — discipline on record.' : 'Recorded as verified.','ok');
      verify();
    };
  });

  document.querySelectorAll('[data-no]').forEach(btn => btn.onclick = async () => {
    const why = prompt('Why is this being rejected? (kept on the record)');
    if (why === null) return;
    const t = rows.find(r => r.id === btn.dataset.no);
    const { error } = await sb.rpc('record_license_check', {
      p_therapist_id: t.id, p_status: 'rejected', p_method: 'manual',
      p_source_url: lookupUrl(t), p_notes: why || null,
    });
    error ? toast(error.message,'err') : (toast('Rejected.','ok'), verify());
  });
}

/* --------------------------------------------------------- numbers */
async function numbers(){
  render('<div class="skeleton" style="height:150px"></div>');
  const { data: rows } = await sb.rpc('admin_pending_therapists');
  const verified = (rows||[]).filter(t => t.verification === 'verified');

  render(`
    <h2>Tracking numbers</h2>
    <p class="muted" style="max-width:64ch">Each verified therapist gets a Theraglee number shown
      on their profile instead of their own line. Calls to it forward to their real number, and
      every call is counted on their dashboard.</p>

    <div class="notice warn" style="margin:18px 0">
      <strong>Not yet automatic.</strong> Buying and forwarding real numbers needs a telephony
      account — Twilio is the usual choice, at roughly $1 a month per number plus a cent or so
      a minute. Until that is connected you can paste in a forwarding number by hand here, and
      the site will display and count it exactly the same way.
    </div>

    ${verified.length ? `<div class="scroll-x"><table class="data">
      <thead><tr><th>Therapist</th><th>Forwards to</th><th>Theraglee number</th><th></th></tr></thead>
      <tbody>${verified.map(t=>`<tr>
        <td><strong>${esc(t.first_name)} ${esc(t.last_name)}</strong><br>
          <span class="faint">${esc((t.license_states||[]).join(', '))}</span></td>
        <td class="faint">${esc(t.contact_phone||'no number on file')}</td>
        <td>${t.proxy_phone
          ? `<code>${esc(t.proxy_phone)}</code>`
          : '<span class="faint">not issued</span>'}</td>
        <td><button class="btn sm ghost" data-num="${t.id}"
          data-cur="${esc(t.proxy_phone||'')}">${t.proxy_phone?'Change':'Assign'}</button></td>
      </tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">No verified listings yet.</div>'}`);

  document.querySelectorAll('[data-num]').forEach(btn => btn.onclick = () => {
    const back = modal(`
      <h2>Assign a Theraglee number</h2>
      <p class="muted" style="font-size:.92rem">This is what visitors see on the profile. Calls
        to it should forward to the therapist's real number.</p>
      <div class="field"><label for="np">Number to display</label>
        <input id="np" placeholder="(555) 010-0199" value="${esc(btn.dataset.cur)}"></div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn ghost" id="cancel">Cancel</button>
        <button class="btn" id="save">Save</button></div>`);
    back.querySelector('#cancel').onclick = () => back.remove();
    back.querySelector('#save').onclick = async (e) => {
      const v = back.querySelector('#np').value.trim();
      busy(e.target, true, 'Saving…');
      const { error } = await sb.from('therapist_profiles').update({
        proxy_phone: v || null,
        proxy_phone_provider: v ? 'manual' : null,
        proxy_phone_assigned_at: v ? new Date().toISOString() : null,
      }).eq('id', btn.dataset.num);
      busy(e.target, false);
      if (error) return toast(error.message,'err');
      back.remove(); toast('Number saved.','ok'); numbers();
    };
  });
}

/* --------------------------------------------------------- billing */
async function billing(){
  const { data } = await sb.from('app_config').select('*');
  const cfg = Object.fromEntries((data||[]).map(r=>[r.key,r.value]));
  const row = (k,label,ph) => `<div class="kvrow">
    <label for="${k}" style="margin:0">${label}</label>
    <input id="${k}" value="${esc(cfg[k]||'')}" placeholder="${ph}"></div>`;
  const toggle = (k,label,help) => `
    <label style="display:flex;gap:12px;align-items:center;padding:16px;
      border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--paper)">
      <input type="checkbox" class="cfgtoggle" id="${k}" ${cfg[k]==='true'?'checked':''}
        style="width:20px;height:20px;accent-color:var(--green);flex:none">
      <span><strong>${label}</strong><br>
        <span class="muted">${help}</span></span>
    </label>`;

  render(`
    <h2>Stripe price IDs</h2>
    <p class="muted">Create each product in Stripe, then paste its <strong>price ID</strong>
      (starts with <code>price_</code>) here.</p>
    ${row('price_basic_monthly','Basic — monthly','price_…')}
    ${row('price_basic_yearly','Basic — yearly','price_…')}
    ${row('price_premium_monthly','Premium — monthly','price_…')}
    ${row('price_premium_yearly','Premium — yearly','price_…')}
    ${row('price_therapist_monthly','Therapist — monthly','price_…')}
    ${row('price_therapist_yearly','Therapist — yearly','price_…')}

    <h2 style="margin-top:34px">Prices shown on the site</h2>
    ${row('display_basic_monthly','Basic — monthly','9')}
    ${row('display_basic_yearly','Basic — yearly','90')}
    ${row('display_premium_monthly','Premium — monthly','19')}
    ${row('display_premium_yearly','Premium — yearly','190')}
    ${row('display_therapist_monthly','Therapist — monthly','29')}
    ${row('display_therapist_yearly','Therapist — yearly','290')}

    <h2 style="margin-top:34px">Founding member offer</h2>
    <p class="muted" style="max-width:64ch">A discounted <em>monthly</em> therapist rate for the
      first therapists who join. In Stripe, add it as a third price on the therapist membership
      product, then paste its ID here. Therapists who take it keep the rate for as long as their
      membership stays active, even after the offer closes. The switch below turns the offer on and
      off across the site; the deadline and the number of spots close it on their own.</p>
    ${row('price_therapist_founding','Founding — Stripe price ID','price_…')}
    ${row('display_therapist_founding','Founding — monthly price shown','20')}
    ${row('founding_spots','Spots (blank = no limit)','150')}
    ${row('founding_deadline','Last day to join (YYYY-MM-DD, blank = none)','2026-12-31')}
    <div class="stack" style="margin-top:12px">
      ${toggle('founding_enabled','Offer the founding member rate',
        'Shows the offer on the For Therapists page and a "Founding member" button on the practice dashboard, and lets checkout sell it. Admins can test the checkout while this is off.')}
    </div>

    <h2 style="margin-top:34px">Session payments (Stripe Connect)</h2>
    ${row('platform_fee_percent','Theraglee keeps (%)','10')}
    ${row('platform_fee_min_cents','…but never less than (cents)','100')}

    <h2 style="margin-top:34px">Go live</h2>
    <div class="stack">
      ${toggle('stripe_enabled','Accept payments',
        'Turn on once the keys are set in Supabase and the price IDs are filled in. Admins can test checkout before this is on.')}
      ${toggle('stripe_tax_enabled','Collect sales tax with Stripe Tax',
        'Turn on after Stripe Tax is set up in the Dashboard (origin address, registrations, and a tax code on each product). Checkout fails if this is on before that.')}
      ${toggle('identity_required','Require the Stripe Identity check before a listing publishes',
        'Turn on after Stripe Identity is activated on the account. Therapists see the check on their Membership tab either way.')}
      ${toggle('connect_enabled','Let therapists take session payments (Stripe Connect)',
        'Turn on after the Connect platform profile is complete and the Connect webhook is pointed at stripe-webhook.')}
    </div>

    <div class="row" style="margin-top:24px">
      <button class="btn" id="savecfg">Save settings</button>
      <span class="faint" id="cfgstatus"></span>
    </div>

    <div class="notice warn" style="margin-top:26px">
      <strong>Set outside this screen</strong>, under Supabase → Edge Functions → Secrets:
      <code>STRIPE_SECRET_KEY</code>, <code>STRIPE_WEBHOOK_SECRET</code>,
      <code>STRIPE_CONNECT_WEBHOOK_SECRET</code> (the second endpoint, for connected accounts),
      <code>SITE_URL</code>,
      <code>RESEND_API_KEY</code> and <code>MAIL_FROM</code> for therapist messages, and
      <code>LICENSE_VERIFY_URL</code> / <code>LICENSE_VERIFY_API_KEY</code> if you sign up with a
      license-verification service. Point both Stripe webhooks at
      <code>https://oekqzuguruyqkafsqhos.supabase.co/functions/v1/stripe-webhook</code>.
      The step-by-step is in <code>docs/stripe.md</code> in the repository.
    </div>`);

  document.getElementById('savecfg').onclick = async (e) => {
    busy(e.target, true, 'Saving…');
    for (const i of document.querySelectorAll('.kvrow input')) {
      await sb.rpc('admin_set_config', { p_key: i.id, p_value: i.value.trim() });
    }
    for (const i of document.querySelectorAll('.cfgtoggle')) {
      await sb.rpc('admin_set_config', { p_key: i.id, p_value: i.checked ? 'true' : 'false' });
    }
    busy(e.target, false);
    document.getElementById('cfgstatus').textContent = 'Saved ' + new Date().toLocaleTimeString();
    toast('Settings saved.','ok');
  };
}

/* --------------------------------------------------------- content */
async function content(){
  const tables = ['daily_content','articles','checklists','worksheets','quizzes',
                  'challenge_templates','mandalas','therapist_resources','profiles',
                  'therapist_profiles','therapist_messages'];
  const counts = {};
  for (const t of tables) {
    const { count } = await sb.from(t).select('id', { count:'exact', head:true });
    counts[t] = count ?? '—';
  }
  render(`<h2>What's in the library</h2>
    <div class="grid g4" style="margin-top:18px">${Object.entries(counts).map(([k,v])=>
      `<div class="card"><div style="font-size:1.8rem;font-weight:300;color:var(--green)">${v}</div>
       <div class="faint">${esc(k.replace(/_/g,' '))}</div></div>`).join('')}</div>
    <div class="notice" style="margin-top:24px">Content is edited in the Supabase table editor
      for now. Ask and I'll build an in-site editor.</div>`);
}

function route(){ ({ members, codes, verify, numbers, billing, content }[tab] || members)(); }
route();
}
}
