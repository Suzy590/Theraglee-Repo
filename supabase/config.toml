# Supabase CLI configuration for the Theraglee project.
#
# The Stripe functions validate the caller's JWT in their own code (so they can
# answer with friendly JSON), and the webhook is called by Stripe, which has no
# Supabase JWT at all — so verify_jwt is off for each of them, matching how the
# functions were first deployed.
project_id = "oekqzuguruyqkafsqhos"

[functions.stripe-checkout]
verify_jwt = false

[functions.stripe-portal]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-connect]
verify_jwt = false

[functions.stripe-session-checkout]
verify_jwt = false

# Called by Postgres (pg_net) with a shared key as well as by signed-in users;
# the function checks both itself.
[functions.verify-license]
verify_jwt = false

# Called by Postgres (pg_net) with a shared key when a member replies to a
# Match Mode message; the function checks the key itself.
[functions.match-reply-alert]
verify_jwt = false

# Admin-only membership and discount-code actions; the function checks the
# caller is an admin itself.
[functions.admin-membership]
verify_jwt = false

# A paying member enters a discount code on their account page.
[functions.stripe-redeem]
verify_jwt = false

# A member deletes their own account (and ends their membership); the
# function validates the caller's session itself.
[functions.delete-account]
verify_jwt = false

# Called by Twilio when a Theraglee tracking number rings and when the
# forwarded call ends; the function checks Twilio's request signature itself.
[functions.twilio-voice]
verify_jwt = false

# Issues and releases Theraglee tracking numbers through Twilio; called by
# Postgres (pg_net) with a shared key when a listing goes live, and by an
# administrator with their session. The function checks both itself.
[functions.twilio-numbers]
verify_jwt = false

# Google Analytics reports for the admin screen's Google Analytics tab; the
# function checks the caller is an admin itself.
[functions.google-analytics]
verify_jwt = false

# Starts a founding therapist's billing when their first match arrives; called
# by pg_cron every hour with a shared key, or by an administrator with their
# session. The function checks both itself.
[functions.founding-billing]
verify_jwt = false

# The evening mood reminder; called by pg_cron with the shared key in
# app_secrets, which the function checks itself. GET ?u=<token> is the
# unsubscribe link in every email.
[functions.mood-reminder]
verify_jwt = false

# The emails Supabase Auth sends. The repo's copy of each template lives in
# supabase/templates/; the live copy is the one in the dashboard
# (Authentication → Emails → Templates), pasted from here by hand, as
# docs/auth-emails.md says. Never run `supabase config push` to apply it:
# that would also push every other [auth] setting this file leaves at its
# default (the Site URL among them) over the live ones.
[auth.email.template.recovery]
subject = "Reset your Theraglee password"
content_path = "./supabase/templates/recovery.html"
